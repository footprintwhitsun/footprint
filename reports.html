<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - OKWESIWA LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/lazy-libs.js"></script>
    <script data-lazy-src="/vendor/xlsx-0.20.2.full.min.js"></script>
    <script src="/vendor/chart-4.4.1.umd.min.js"></script>
    <script src="/auth-guard.js"></script>
    <script src="/currency.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { flex: 1; padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap" id="hub"></div>
        <footer style="text-align:center;padding:16px 24px;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border);">© 2026 OKWESIWA LTD</footer>
    </main>
</div>

<script>
(function () {
    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
    const esc = OkwUI.escapeHtml;
    const fmt = (n) => (typeof formatCurrency === 'function' ? formatCurrency(n) : 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const monthStart = () => new Date().toISOString().slice(0, 8) + '01';
    const todayStr = () => new Date().toISOString().slice(0, 10);
    const cssVar = (name, fallback) => (getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim() || fallback;

    /* ====================================================================
       Section 1 - Overview: charts and totals from /api/reports/all
       (replaces the old Sales dashboard and Profitability pages)
       ==================================================================== */
    let overviewCharts = [];
    function destroyOverviewCharts() {
        overviewCharts.forEach(c => { try { c.destroy(); } catch (_) { } });
        overviewCharts = [];
    }

    function mountOverview(panel, ctx) {
        destroyOverviewCharts();

        let range = { from: monthStart(), to: todayStr() };
        let branch = 'All Branches';

        ctx.toolbar.innerHTML = `
            <select id="ov-branch" class="okw-select" aria-label="Branch"><option value="All Branches">All Branches</option></select>
            <div id="ov-date-picker"></div>`;
        panel.innerHTML = `
            <div class="okw-kpi-row" id="ov-kpis"></div>
            <div id="ov-body"><div class="okw-empty">Loading...</div></div>
            <div class="okw-card" id="ov-ytd-card" style="margin-top:20px;">
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;">
                    <div>
                        <h2 class="okw-chart-title" style="margin:0;">Year-to-Date (YTD) Product Performance</h2>
                        <div id="ov-ytd-summary" style="font-size:13px;color:var(--color-text-muted);margin-top:4px;">Loading YTD sales...</div>
                    </div>
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                        <input id="ov-ytd-search" class="okw-input" type="search" placeholder="Search product or barcode..." style="min-width:220px;">
                        <button id="ov-ytd-export" class="okw-btn okw-btn-secondary" type="button">Export CSV</button>
                    </div>
                </div>
                <div id="ov-ytd-table"><div class="okw-empty">Loading...</div></div>
            </div>`;

        const branchSel = ctx.toolbar.querySelector('#ov-branch');
        fetch('/api/branches', { headers, credentials: 'include' })
            .then(r => (r.ok ? r.json() : []))
            .then(list => {
                (Array.isArray(list) ? list : []).forEach(b => {
                    if (!b.name) return;
                    const o = document.createElement('option');
                    o.value = b.name; o.textContent = b.name;
                    branchSel.appendChild(o);
                });
            }).catch(() => { });
        branchSel.addEventListener('change', () => { branch = branchSel.value; load(); });
        OkwUI.dateRangePicker('#ov-date-picker', (r) => { range = r; load(); });

        async function load() {
            const body = panel.querySelector('#ov-body');
            if (!body) return;
            const qs = new URLSearchParams({ from: range.from, to: range.to });
            if (branch !== 'All Branches') qs.set('branch', branch);
            let d;
            try {
                const res = await fetch(`/api/reports/all?${qs}`, { headers, credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load the overview');
                d = await res.json();
                OkwUI.warnIfPartial(d);
            } catch (err) {
                OkwUI.toast(err.message || 'Failed to load the overview', 'danger');
                body.innerHTML = '<div class="okw-empty">The overview could not be loaded.</div>';
                return;
            }

            const p = d.profitAndLoss || {};
            const daily = d.dailySummary || [];
            const receipts = daily.reduce((s, r) => s + Number(r.receipts || 0), 0);
            const margin = Number(p.sales) > 0 ? (Number(p.gross_profit || 0) / Number(p.sales)) * 100 : 0;
            const bestProduct = (d.fastMovers || []).slice().sort((a, b) => Number(b.revenue || 0) - Number(a.revenue || 0))[0];
            const topCashier = (d.salesByTeller || []).slice().sort((a, b) => Number(b.sales || 0) - Number(a.sales || 0))[0];
            const topCashierName = topCashier ? String(topCashier.teller || '').replace(/\s*\(@[^)]*\)\s*/g, '').trim() : 'None yet';
            panel.querySelector('#ov-kpis').innerHTML = [
                OkwUI.kpiCard({ label: 'Sales', value: fmt(p.sales), subtext: `${receipts} receipts`, tone: 'primary' }),
                OkwUI.kpiCard({ label: 'Gross profit', value: fmt(p.gross_profit), subtext: `${margin.toFixed(1)}% gross margin`, tone: 'info' }),
                OkwUI.kpiCard({ label: 'Expenses', value: fmt(p.expenses), tone: 'warning' }),
                OkwUI.kpiCard({ label: 'Net profit', value: fmt(p.net_profit), subtext: Number(p.net_profit) < 0 ? 'Loss for this period' : '', tone: Number(p.net_profit) < 0 ? 'danger' : 'success' }),
                OkwUI.kpiCard({ label: 'Best product', value: bestProduct ? bestProduct.name : 'None yet', subtext: bestProduct ? fmt(bestProduct.revenue) + ' revenue' : '', tone: 'primary' }),
                OkwUI.kpiCard({ label: 'Top cashier', value: topCashierName || 'None yet', subtext: topCashier ? fmt(topCashier.sales) + ' in sales' : '', tone: 'primary' })
            ].join('');

            destroyOverviewCharts();

            if (!daily.length) {
                body.innerHTML = '<div class="okw-empty">No sales in this period.</div>';
                return;
            }
            if (typeof Chart === 'undefined') {
                body.innerHTML = '<div class="okw-empty">Charts could not load. Check the internet connection and refresh.</div>';
                return;
            }

            body.innerHTML = `
                <div class="okw-chart-grid">
                    <div class="okw-card"><h2 class="okw-chart-title">Sales and profit by day</h2><div class="okw-chart-box"><canvas id="ov-trend"></canvas></div></div>
                    <div class="okw-card"><h2 class="okw-chart-title">Payment methods</h2><div class="okw-chart-box"><canvas id="ov-methods"></canvas></div></div>
                    <div class="okw-card"><h2 class="okw-chart-title">Top 5 products by revenue</h2><div class="okw-chart-box"><canvas id="ov-top"></canvas></div></div>
                    <div class="okw-card"><h2 class="okw-chart-title">Revenue, cost and profit</h2><div class="okw-chart-box"><canvas id="ov-pnl"></canvas></div></div>
                </div>`;

            const primary = cssVar('--color-primary', '#273990');
            const accent = cssVar('--color-accent', '#F9A51A');
            const success = cssVar('--color-success', '#15803D');
            const info = cssVar('--color-info', '#0369A1');
            const danger = cssVar('--color-danger', '#B91C1C');
            const warning = cssVar('--color-warning', '#B45309');
            const muted = cssVar('--color-text-muted', '#6B7280');
            const grid = cssVar('--color-border', '#E2E8F0');
            Chart.defaults.color = muted;
            Chart.defaults.font.family = cssVar('--font-sans', 'Inter, sans-serif');
            const baseOpts = { responsive: true, maintainAspectRatio: false };
            const scales = { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: grid } } };
            const make = (id, cfg) => { const c = new Chart(body.querySelector('#' + id), cfg); overviewCharts.push(c); };

            make('ov-trend', {
                type: 'line',
                data: {
                    labels: daily.map(r => String(r.day).slice(0, 10)),
                    datasets: [
                        { label: 'Sales', data: daily.map(r => Number(r.sales || 0)), borderColor: primary, backgroundColor: primary, tension: 0.3, pointRadius: 2 },
                        { label: 'Profit', data: daily.map(r => Number(r.profit || 0)), borderColor: success, backgroundColor: success, tension: 0.3, pointRadius: 2 }
                    ]
                },
                options: { ...baseOpts, scales }
            });

            const m = d.salesByPaymentMethod || [];
            const sum = (k) => m.reduce((s, r) => s + Number(r[k] || 0), 0);
            const methodRows = [['Cash', sum('cash'), primary], ['Mobile money', sum('momo'), accent], ['Card', sum('card'), info], ['Bank / cheque', sum('bank'), success], ['Credit', sum('credit'), warning]].filter(r => r[1] > 0);
            make('ov-methods', {
                type: 'doughnut',
                data: { labels: methodRows.map(r => r[0]), datasets: [{ data: methodRows.map(r => r[1]), backgroundColor: methodRows.map(r => r[2]), borderWidth: 0 }] },
                options: { ...baseOpts, cutout: '62%', plugins: { legend: { position: 'bottom' } } }
            });

            const top = (d.fastMovers || []).slice().sort((a, b) => Number(b.revenue || 0) - Number(a.revenue || 0)).slice(0, 5);
            make('ov-top', {
                type: 'bar',
                data: { labels: top.map(r => r.name), datasets: [{ label: 'Revenue', data: top.map(r => Number(r.revenue || 0)), backgroundColor: accent, borderRadius: 4 }] },
                options: { ...baseOpts, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: grid } }, y: { grid: { display: false } } } }
            });

            make('ov-pnl', {
                type: 'bar',
                data: {
                    labels: ['Sales', 'Cost of goods', 'Gross profit', 'Expenses', 'Net profit'],
                    datasets: [{
                        data: [p.sales, p.cost_of_goods, p.gross_profit, p.expenses, p.net_profit].map(v => Number(v || 0)),
                        backgroundColor: [primary, warning, info, danger, success], borderRadius: 4
                    }]
                },
                options: { ...baseOpts, plugins: { legend: { display: false } }, scales }
            });
        }
        let ytdRows = [];
        function renderYtdTable() {
            const host = panel.querySelector('#ov-ytd-table');
            if (!host) return;
            const q = (panel.querySelector('#ov-ytd-search')?.value || '').trim().toLowerCase();
            const filtered = q
                ? ytdRows.filter(r => String(r.name || '').toLowerCase().includes(q) || String(r.barcode || '').toLowerCase().includes(q))
                : ytdRows;
            if (!filtered.length) {
                host.innerHTML = `<div class="okw-empty">${q ? 'No matching products.' : 'No YTD product sales recorded yet.'}</div>`;
                return;
            }
            host.innerHTML = `
                <div style="overflow-x:auto;">
                    <table class="okw-table" style="width:100%;">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Barcode</th>
                                <th style="text-align:right;">YTD Units Sold</th>
                                <th style="text-align:right;">YTD Revenue</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(r => `
                                <tr>
                                    <td><strong>${esc(r.name || 'Unnamed')}</strong></td>
                                    <td style="color:var(--color-text-muted);">${esc(r.barcode || '—')}</td>
                                    <td style="text-align:right;">${Number(r.qty || 0).toLocaleString()}</td>
                                    <td style="text-align:right;"><strong>${fmt(r.revenue || 0)}</strong></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        async function loadYtd() {
            const summaryEl = panel.querySelector('#ov-ytd-summary');
            const tableEl = panel.querySelector('#ov-ytd-table');
            try {
                const res = await fetch('/api/analytics/ytd/all', { headers, credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load YTD analytics');
                const ytd = await res.json();
                ytdRows = Array.isArray(ytd.breakdown) ? ytd.breakdown : [];
                if (summaryEl) {
                    summaryEl.textContent = `${Number(ytd.totalUnits || 0).toLocaleString()} units sold · ${fmt(ytd.totalRevenue || 0)} YTD revenue (${ytdRows.length} products)`;
                }
                renderYtdTable();
            } catch (err) {
                if (summaryEl) summaryEl.textContent = 'Could not load YTD summary.';
                if (tableEl) tableEl.innerHTML = '<div class="okw-empty">Could not load YTD product breakdown.</div>';
            }
        }

        panel.querySelector('#ov-ytd-search')?.addEventListener('input', renderYtdTable);
        panel.querySelector('#ov-ytd-export')?.addEventListener('click', () => {
            if (!ytdRows.length) return;
            const csv = [['Product', 'Barcode', 'YTD Units Sold', 'YTD Revenue'], ...ytdRows.map(r => [r.name || '', r.barcode || '', Number(r.qty || 0), Number(r.revenue || 0).toFixed(2)])]
                .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                .join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ytd-product-performance-${todayStr()}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        });

        load();
        loadYtd();
    }

    /* ====================================================================
       Section 2 - Detailed reports: the full 32-type report engine that
       lived on the old Reports page, moved here unchanged apart from how
       it is mounted and how a report is chosen from the link (?report=).
       ==================================================================== */
    const DETAILED_TYPE_SELECT = `<select id="rep-type" class="okw-select" aria-label="Report Type"><option value="pnl">Profit / Loss Report</option><option value="z_report">Z Report</option><option value="purchase_sale">Purchase &amp; Sale</option><option value="tax">Tax Report</option><option value="supplier_customer">Supplier &amp; Customer Report</option><option value="customer_groups">Customer Groups Report</option><option value="stock">Stock Report</option><option value="adj">Stock Adjustment Report</option><option value="trending">Trending Products</option><option value="items_report">Items Report</option><option value="product_purchase">Product Purchase Report</option><option value="product_sell">Product Sell Report</option><option value="daily_sales_product">Daily Sales by Product</option><option value="purchase_sale_product">Purchase &amp; Sale Product</option><option value="purchase_payment">Purchase Payment Report</option><option value="sell_payment">Sell Payment Report</option><option value="payment_by_age">Payment by Age</option><option value="expense">Expense Report</option><option value="shifts">Register Report</option><option value="teller">Sales Representative Report</option><option value="activity_log">Activity Log</option><option value="deleted_transactions">Deleted Transactions</option><option value="transactions">Transaction History</option><option value="daily">Daily Summary</option><option value="cat">Sales by Category</option><option value="method">By Payment Method</option><option value="hourly">Hourly Sales</option><option value="quotes">Quotations</option><option value="slow_movers">Slow Movers (30+ Days)</option><option value="margin">Profit by Item</option><option value="variance">Stock Count Variance</option></select>`;

    function mountDetailed(panel, ctx) {
        destroyOverviewCharts();
        ctx.toolbar.innerHTML = DETAILED_TYPE_SELECT + `
            <select id="rep-branch" class="okw-select" aria-label="Branch"><option value="All Branches">All Branches</option></select>
            <div id="rep-date-picker"></div>`;
        panel.innerHTML = '<div id="rep-host">Loading report...</div>';
                    const token = localStorage.getItem("authToken") || localStorage.getItem("token") || sessionStorage.getItem("token");
            const headers = { Authorization: "Bearer " + token };
            const fmt = (n) => (typeof formatCurrency === "function" ? formatCurrency(n) : ("GH₵ " + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })));

            const urlParams = new URLSearchParams(window.location.search);
            const initReport = urlParams.get("report");
            let reportType = "transactions";
            const typeSelect = document.getElementById("rep-type");
            if (typeSelect && initReport && Array.from(typeSelect.options).some(o => o.value === initReport)) reportType = initReport;
            if (typeSelect) typeSelect.value = reportType;

            let dateRange = { from: new Date().toISOString().slice(0, 8) + "01", to: new Date().toISOString().slice(0, 10) };
            let selectedBranch = "All Branches";
            const branchSelect = document.getElementById("rep-branch");
            let cacheAll = null;
            let cacheTrx = null;
            let cacheShifts = null;

            async function loadBranches() {
                try {
                    const res = await fetch("/api/branches", { headers });
                    if (!res.ok) return;
                    const data = await res.json();
                    const list = Array.isArray(data) ? data : (data.locations || []);
                    if (branchSelect && list.length) {
                        const existing = new Set(Array.from(branchSelect.options).map(o => o.value));
                        for (const loc of list) {
                            const name = loc.name || loc.location_name;
                            if (name && !existing.has(name)) {
                                const opt = document.createElement("option");
                                opt.value = name;
                                opt.textContent = name;
                                branchSelect.appendChild(opt);
                                existing.add(name);
                            }
                        }
                    }
                } catch (_) {}
            }
            loadBranches();

            OkwUI.dateRangePicker("#rep-date-picker", (r) => {
                dateRange = r;
                cacheAll = null;
                loadAndRender();
            });

            async function loadAndRender() {
                const host = document.getElementById("rep-host");
                if (!host) return;
                host.innerHTML = "<div style=\"padding:20px;color:var(--color-text-muted);\">Loading report...</div>";

                try {
                    if (reportType === "transactions") {
                        if (!cacheTrx) {
                            const res = await fetch("/api/transactions", { headers });
                            cacheTrx = res.ok ? await res.json() : [];
                        }
                        const filtered = (Array.isArray(cacheTrx) ? cacheTrx : []).filter(t => {
                            const d = String(t.created_at || "").slice(0, 10);
                            const dateOk = (!dateRange.from || d >= dateRange.from) && (!dateRange.to || d <= dateRange.to);
                            const branchOk = selectedBranch === "All Branches" || String(t.store_location || "").toLowerCase() === selectedBranch.toLowerCase();
                            return dateOk && branchOk;
                        }).map(t => ({
                            date: new Date(t.created_at).toLocaleString(),
                            receipt: t.receipt_number || ("#" + t.id),
                            items: Array.isArray(t.items) ? t.items.map(i => i.name + " (" + i.qty + ")").join(", ") : "—",
                            cashier: t.cashier_name || t.seller_name || "Staff",
                            total: Number(t.total_amount || 0)
                        }));
                        OkwUI.dataTable(host, {
                            columns: [
                                { key: "date", label: "Date" },
                                { key: "receipt", label: "Receipt #" },
                                { key: "items", label: "Items" },
                                { key: "cashier", label: "Staff" },
                                { key: "total", label: "Total", numeric: true, render: fmt }
                            ],
                            rows: filtered,
                            searchPlaceholder: "Search receipt, item, or staff...",
                            exportFilename: "okwesiwa-transactions-report.xlsx",
                            printTitle: "OKWESIWA LTD — Transaction History"
                        });
                        return;
                    }

                    if (reportType === "shifts") {
                        if (!cacheShifts) {
                            const res = await fetch("/api/shifts", { headers });
                            cacheShifts = res.ok ? await res.json() : [];
                        }
                        const filtered = (Array.isArray(cacheShifts) ? cacheShifts : []).filter(s => {
                            const d = String(s.start_time || s.created_at || "").slice(0, 10);
                            return (!dateRange.from || d >= dateRange.from) && (!dateRange.to || d <= dateRange.to);
                        }).map(s => ({
                            staff: s.user_name || "Staff",
                            start: s.start_time ? new Date(s.start_time).toLocaleString() : "—",
                            end: s.end_time ? new Date(s.end_time).toLocaleString() : "Active",
                            start_cash: Number(s.start_cash || 0),
                            end_cash: s.end_cash !== null && s.end_cash !== undefined ? Number(s.end_cash) : 0,
                            sales: Number(s.total_sales || 0),
                            status: String(s.status || "open").toUpperCase()
                        }));
                        OkwUI.dataTable(host, {
                            columns: [
                                { key: "staff", label: "Staff" },
                                { key: "start", label: "Start Time" },
                                { key: "end", label: "End Time" },
                                { key: "start_cash", label: "Start Cash", numeric: true, render: fmt },
                                { key: "end_cash", label: "End Cash", numeric: true, render: fmt },
                                { key: "sales", label: "Total Sales", numeric: true, render: fmt },
                                { key: "status", label: "Status", render: v => OkwUI.badge(v, v === "OPEN" ? "success" : "neutral") }
                            ],
                            rows: filtered,
                            searchPlaceholder: "Search staff or status...",
                            exportFilename: "okwesiwa-shift-reports.xlsx",
                            printTitle: "OKWESIWA LTD — Shift Reports"
                        });
                        return;
                    }

                    if (!cacheAll) {
                        const brParam = selectedBranch && selectedBranch !== "All Branches" ? ("&branch=" + encodeURIComponent(selectedBranch)) : "";
                        const res = await fetch("/api/reports/all?from=" + dateRange.from + "&to=" + dateRange.to + brParam, { headers });
                        if (!res.ok) {
                            host.innerHTML = "<div style=\"padding:20px;color:var(--color-danger);\">Failed to load report data.</div>";
                            return;
                        }
                        cacheAll = await res.json();
                        OkwUI.warnIfPartial(cacheAll);
                    }
                    const d = cacheAll;

                    if (reportType === "cat") {
                        OkwUI.dataTable(host, {
                            columns: [
                                { key: "category", label: "Category" },
                                { key: "qty", label: "Qty", numeric: true },
                                { key: "revenue", label: "Revenue", numeric: true, render: fmt },
                                { key: "cost", label: "Cost", numeric: true, render: fmt },
                                { key: "profit", label: "Profit", numeric: true, render: fmt }
                            ],
                            rows: d.salesByCategory || [], exportFilename: "okwesiwa-sales-by-category.xlsx", printTitle: "OKWESIWA LTD — Sales by Category"
                        });
                    } else if (reportType === "daily") {
                        OkwUI.dataTable(host, {
                            columns: [
                                { key: "day", label: "Date" },
                                { key: "receipts", label: "Receipts", numeric: true },
                                { key: "sales", label: "Sales", numeric: true, render: fmt },
                                { key: "profit", label: "Profit", numeric: true, render: fmt },
                                { key: "avg_sale", label: "Avg Sale", numeric: true, render: fmt }
                            ],
                            rows: d.dailySummary || [], exportFilename: "okwesiwa-daily-summary.xlsx", printTitle: "OKWESIWA LTD — Daily Summary"
                        });
                    } else if (reportType === "teller") {
                        OkwUI.dataTable(host, {
                            columns: [
                                { key: "teller", label: "Teller" },
                                { key: "receipts", label: "Receipts", numeric: true },
                                { key: "sales", label: "Sales", numeric: true, render: fmt },
                                { key: "discounts", label: "Discounts Given", numeric: true, render: fmt },
                                { key: "voids", label: "Voids/Returns", numeric: true }
                            ],

    /* ====================================================================
       Section 3 - Items, brands and customers (drill-down)
       Saved views are stored in the database for each user.
       ==================================================================== */
    function mountDrilldown(panel, ctx) {
        destroyOverviewCharts();
        ctx.toolbar.style.flexWrap = 'wrap';
        let range = { from: monthStart(), to: todayStr() };
        let active = 'items_today';
        let data = null;
        let drillBrand = null;
        let views = [];

        ctx.toolbar.innerHTML = `
            <select id="cr-report-type" class="okw-select" aria-label="Report type">
                <option value="items_today">Items sold today</option>
                <option value="items_period">Items sold (any period)</option>
                <option value="by_brand">Sales by brand</option>
                <option value="top_customers">Top customers</option>
                <option value="customers_owing">Customers owing (aging)</option>
                <option value="stock_on_hand">Stock on hand</option>
            </select>
            <div id="cr-date-picker"></div>
            <input type="text" id="cr-brand" class="okw-input" placeholder="Brand..." aria-label="Brand">
            <input type="text" id="cr-category" class="okw-input" placeholder="Category..." aria-label="Category">
            <input type="text" id="cr-item" class="okw-input" placeholder="Item name..." aria-label="Item name">
            <select id="cr-method" class="okw-select" aria-label="Payment method">
                <option value="">All payment methods</option>
                <option value="cash">Cash</option>
                <option value="momo">Mobile money</option>
                <option value="card">Card</option>
                <option value="credit">Credit</option>
                <option value="split">Split</option>
            </select>
            <button type="button" class="okw-btn okw-btn-primary" id="cr-apply">Apply</button>
            <select id="cr-views" class="okw-select" aria-label="Saved views"><option value="">Saved views...</option></select>
            <button type="button" class="okw-btn okw-btn-outline" id="cr-save-view">Save view</button>
            <button type="button" class="okw-btn okw-btn-outline" id="cr-delete-view">Delete view</button>`;
        panel.innerHTML = `
            <div class="okw-kpi-row" id="cr-kpis"></div>
            <div id="cr-drill-bar"></div>
            <div id="cr-table-host">Loading report...</div>`;

        const $ = (sel) => ctx.toolbar.querySelector(sel);
        const filters = () => ({ brand: $('#cr-brand').value, category: $('#cr-category').value, item: $('#cr-item').value, method: $('#cr-method').value });

        OkwUI.dateRangePicker('#cr-date-picker', (r) => { range = r; load(); });

        async function load() {
            const f = filters();
            const day = todayStr();
            const qs = new URLSearchParams({
                from: active === 'items_today' ? day : range.from,
                to: active === 'items_today' ? day : range.to,
                brand: f.brand, category: f.category, item: f.item, payment_method: f.method
            });
            try {
                const res = await fetch(`/api/reports/core?${qs}`, { headers, credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load the report');
                data = await res.json();
                OkwUI.warnIfPartial(data);
            } catch (err) {
                OkwUI.toast(err.message || 'Failed to load the report', 'danger');
                panel.querySelector('#cr-table-host').innerHTML = '<div class="okw-empty">The report could not be loaded.</div>';
                return;
            }
            renderKpis();
            renderTable();
        }

        function renderKpis() {
            const p = data.period || {};
            const delta = p.pct_change !== null && p.pct_change !== undefined ? `${p.pct_change >= 0 ? '+' : ''}${p.pct_change}% vs prior period` : 'No prior baseline';
            const owing = (data.customersOwing || []).reduce((s, c) => s + Number(c.balance || 0), 0);
            const stockVal = (data.stockOnHand || []).reduce((s, i) => s + Number(i.value_at_cost || 0), 0);
            panel.querySelector('#cr-kpis').innerHTML = [
                OkwUI.kpiCard({ label: 'Period sales', value: fmt(p.current_revenue), subtext: delta, tone: 'primary' }),
                OkwUI.kpiCard({ label: 'Period profit', value: fmt(p.current_profit), subtext: `${p.from || ''} to ${p.to || ''}`, tone: 'success' }),
                OkwUI.kpiCard({ label: 'Customers owing', value: fmt(owing), subtext: `${(data.customersOwing || []).length} accounts`, tone: 'warning' }),
                OkwUI.kpiCard({ label: 'Stock value (cost)', value: fmt(stockVal), subtext: `${(data.stockOnHand || []).length} SKUs`, tone: 'info' })
            ].join('');
        }

        function renderTable() {
            if (!data) return;
            const bar = panel.querySelector('#cr-drill-bar');
            bar.innerHTML = drillBrand
                ? `<div class="okw-filter-bar okw-drill-bar"><span>Drill-down: <strong>${esc(drillBrand)}</strong></span><button type="button" class="okw-btn okw-btn-outline" id="cr-clear-drill">Back to all brands</button></div>`
                : '';
            const clear = bar.querySelector('#cr-clear-drill');
            if (clear) clear.onclick = () => { drillBrand = null; renderTable(); };

            const host = '#cr-table-host';
            if (active === 'items_today' || active === 'items_period') {
                let rows = data.itemsSoldRows || [];
                if (drillBrand) rows = rows.filter(r => r.brand === drillBrand);
                OkwUI.dataTable(host, {
                    columns: [
                        { key: 'day', label: 'Day' },
                        { key: 'receipt_number', label: 'Receipt' },
                        { key: 'brand', label: 'Brand' },
                        { key: 'item', label: 'Item' },
                        { key: 'unit', label: 'Unit' },
                        { key: 'qty', label: 'Qty', numeric: true },
                        { key: 'revenue', label: 'Revenue', numeric: true, render: fmt },
                        { key: 'profit', label: 'Profit', numeric: true, render: fmt },
                        { key: 'customer', label: 'Customer' },
                        { key: 'teller', label: 'Teller' }
                    ],
                    rows, exportFilename: `okwesiwa-${active}.xlsx`, printTitle: 'Items sold'
                });
            } else if (active === 'by_brand') {
                OkwUI.dataTable(host, {
                    columns: [
                        { key: 'brand', label: 'Brand (click to drill)', render: (v) => `<a href="#" class="okw-link-strong" data-drill-brand="${esc(v)}">${esc(v)}</a>` },
                        { key: 'qty', label: 'Qty sold', numeric: true },
                        { key: 'revenue', label: 'Revenue', numeric: true, render: fmt },
                        { key: 'cost', label: 'Cost', numeric: true, render: fmt },
                        { key: 'profit', label: 'Profit', numeric: true, render: fmt },
                        { key: 'margin_pct', label: 'Margin %', numeric: true, render: v => `${v}%` }
                    ],
                    rows: data.salesByBrand || [], exportFilename: 'okwesiwa-sales-by-brand.xlsx', printTitle: 'Sales by brand'
                });
                panel.querySelectorAll('[data-drill-brand]').forEach(a => {
                    a.onclick = (e) => {
                        e.preventDefault();
                        drillBrand = a.dataset.drillBrand;
                        active = 'items_period';
                        $('#cr-report-type').value = active;
                        renderTable();
                    };
                });
            } else if (active === 'top_customers') {
                OkwUI.dataTable(host, {
                    columns: [
                        { key: 'customer', label: 'Customer' },
                        { key: 'visits', label: 'Visits', numeric: true },
                        { key: 'revenue', label: 'Total spent', numeric: true, render: fmt },
                        { key: 'profit', label: 'Profit', numeric: true, render: fmt },
                        { key: 'favourite_brand', label: 'Favourite brand' }
                    ],
                    rows: data.topCustomers || [], exportFilename: 'okwesiwa-top-customers.xlsx', printTitle: 'Top customers'
                });
            } else if (active === 'customers_owing') {
                OkwUI.dataTable(host, {
                    columns: [
                        { key: 'name', label: 'Customer' },
                        { key: 'phone', label: 'Phone' },
                        { key: 'customer_type', label: 'Type' },
                        { key: 'balance', label: 'Balance owed', numeric: true, render: v => `<strong>${esc(fmt(v))}</strong>` },
                        { key: 'days_0_30', label: '0-30 days', numeric: true, render: fmt },
                        { key: 'days_31_60', label: '31-60 days', numeric: true, render: fmt },
                        { key: 'days_61_90', label: '61-90 days', numeric: true, render: fmt },
                        { key: 'days_90_plus', label: '90+ days', numeric: true, render: fmt }
                    ],
                    rows: data.customersOwing || [], exportFilename: 'okwesiwa-customers-owing.xlsx', printTitle: 'Customers owing'
                });
            } else if (active === 'stock_on_hand') {
                OkwUI.dataTable(host, {
                    columns: [
                        { key: 'name', label: 'Item' },
                        { key: 'brand', label: 'Brand' },
                        { key: 'category', label: 'Category' },
                        { key: 'unit', label: 'Unit' },
                        { key: 'stock', label: 'Qty on hand', numeric: true },
                        { key: 'value_at_cost', label: 'Value at cost', numeric: true, render: fmt },
                        { key: 'locations', label: 'Locations' }
                    ],
                    rows: data.stockOnHand || [], exportFilename: 'okwesiwa-stock-on-hand.xlsx', printTitle: 'Stock on hand'
                });
            }
        }

        $('#cr-report-type').addEventListener('change', (e) => {
            drillBrand = null;
            active = e.target.value;
            if (active === 'items_today' || !data) load(); else renderTable();
        });
        $('#cr-apply').addEventListener('click', load);

        // Saved views live in the database (per user), not in this browser.
        async function migrateBrowserViews() {
            // Views saved in this browser by the old Core Reports page move to the person's account once.
            let old = [];
            try { old = JSON.parse(localStorage.getItem('okwesiwa_saved_views') || '[]'); } catch (_) { old = []; }
            if (!Array.isArray(old) || !old.length) return;
            let allSaved = true;
            for (const v of old) {
                try {
                    const res = await fetch('/api/reports/saved-views', {
                        method: 'POST', headers, credentials: 'include',
                        body: JSON.stringify({ name: v.name, filters: { brand: v.brand, category: v.category, item: v.item, method: v.method } })
                    });
                    if (!res.ok) allSaved = false;
                } catch (_) { allSaved = false; }
            }
            if (allSaved) {
                try { localStorage.removeItem('okwesiwa_saved_views'); } catch (_) { }
                OkwUI.toast(`${old.length} saved view${old.length === 1 ? '' : 's'} moved to your account`, 'success');
            }
        }

        async function loadViews() {
            try {
                const res = await fetch('/api/reports/saved-views', { headers, credentials: 'include' });
                const d = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error('Could not load saved views');
                views = d.views || [];
            } catch (err) {
                views = [];
                OkwUI.toast(err.message || 'Could not load saved views', 'warning');
            }
            $('#cr-views').innerHTML = '<option value="">Saved views...</option>' +
                views.map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('');
        }
        $('#cr-views').addEventListener('change', (e) => {
            const v = views.find(x => String(x.id) === e.target.value);
            if (!v) return;
            const f = v.filters || {};
            $('#cr-brand').value = f.brand || '';
            $('#cr-category').value = f.category || '';
            $('#cr-item').value = f.item || '';
            $('#cr-method').value = f.method || '';
            load();
        });
        $('#cr-save-view').addEventListener('click', async () => {
            const name = prompt('Save the current filters as:');
            if (!name || !name.trim()) return;
            try {
                const res = await fetch('/api/reports/saved-views', { method: 'POST', headers, credentials: 'include', body: JSON.stringify({ name: name.trim(), filters: filters() }) });
                const d = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(d.message || 'Failed to save the view');
                OkwUI.toast('View saved', 'success');
                loadViews();
            } catch (err) {
                OkwUI.toast(err.message || 'Failed to save the view', 'danger');
            }
        });
        $('#cr-delete-view').addEventListener('click', async () => {
            const id = $('#cr-views').value;
            if (!id) return OkwUI.toast('Choose a saved view first', 'warning');
            try {
                const res = await fetch('/api/reports/saved-views/' + encodeURIComponent(id), { method: 'DELETE', headers, credentials: 'include' });
                if (!res.ok) throw new Error('Failed to delete the view');
                OkwUI.toast('View deleted', 'success');
                loadViews();
            } catch (err) {
                OkwUI.toast(err.message || 'Failed to delete the view', 'danger');
            }
        });

        migrateBrowserViews().then(loadViews);
        load();
    }

    const linkParams = new URLSearchParams(window.location.search);
    OkwUI.sectionPage({
        mount: '#hub',
        title: 'Reports',
        subtitle: 'Sales, profit, stock and customer reports in one place.',
        defaultId: (!linkParams.get('tab') && linkParams.get('report')) ? 'detailed' : 'overview',
        sections: [
            { id: 'overview', label: 'Overview', render: mountOverview },
            { id: 'detailed', label: 'Detailed reports', render: mountDetailed },
            { id: 'drilldown', label: 'Items, brands & customers', render: mountDrilldown }
        ]
    });
})();
</script>
</body>
</html>
