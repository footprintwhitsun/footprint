<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" data-media-swap>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKWESIWA CO LTD | Categories</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" data-media-swap>
    <link rel="stylesheet" href="sidebar.css">
    <style>
        :root { 
            --primary-color: #273990; --accent-color: #f9a51a; 
            --secondary-color: #1c2b70; 
            --accent-color: #f9a51a; 
            --text-color: #202223; 
            --text-secondary: #6d7175;
            --gray-light: #f6f6f7; 
            --border-color: #e1e3e5;
            --sidebar-width: 260px; 
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); display: flex; flex-direction: column; min-height: 100vh; color: var(--text-color); }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 28px 36px; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn-add { background: var(--primary-color); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; transition: background 0.15s ease; }
        .btn-add:hover { background: var(--secondary-color); }
        .inventory-card { background: white; padding: 22px 24px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: var(--shadow-card); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 11px 14px; color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border-color); background: #fafbfb; }
        td { padding: 12px 14px; border-bottom: 1px solid #f1f2f3; color: var(--text-color); font-size: 13.5px; }
        .action-btn { height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; color: #334155; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12.5px; font-weight: 600; transition: all 0.15s; margin-right: 6px; }
        .action-btn:hover { border-color: var(--primary-color); color: var(--primary-color); background: #f8fafc; }
        .btn-delete { background: #fff4f4; color: #c42b1c; border: 1px solid #ffd2cf; }
        .btn-delete:hover { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #eee; color: #333; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .btn-save { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        
        footer { margin-left: var(--sidebar-width); padding: 10px; text-align: center; color: white; font-size: 12px; background: #1F3A60; }
    .user-profile-row { display: flex; align-items: center; gap: 10px; }
        
        .sidebar-logout-btn { margin-left: auto; flex-shrink: 0; background: none; border: none; color: rgba(255,255,255,0.65); cursor: pointer; padding: 7px; border-radius: 6px; font-size: 16px; line-height: 1; transition: color 0.2s ease, background 0.2s ease; } .sidebar-logout-btn:hover { color: white; background: rgba(220,53,69,0.6); }
        </style>
    <script src="currency.js"></script>
    <script src="telemetry-guard.js"></script>
    <script src="instant-nav.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <link rel="stylesheet" href="/portal-skin.css">
    <script src="/okw-events.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="brand" style="display: flex; flex-direction: column; align-items: center;">
            <img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD" style="width: auto; max-width: 140px; height: 36px; border-radius: 6px; object-fit: contain; background: #ffffff; padding: 3px 8px; border: 1.5px solid #f9a51a;">
            
        </div>
        <div class="nav-links">
        </div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <div style="font-weight: bold;" id="userName"></div>
                <div style="font-size: 12px; opacity: 0.7;" id="userRole"></div>
            </div>
            </div>
            <button class="sidebar-logout-btn" data-onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="main-content">
        <div class="okw-page-header">
            <div class="okw-page-header-text">
                <h1 class="okw-page-title">Categories</h1>
                <p class="okw-page-subtitle">Organize products into categories for faster search, reporting, and POS checkout.</p>
            </div>
            <div class="okw-page-header-actions">
                <button type="button" class="btn-add" data-onclick="openModal()"><i class="fas fa-plus"></i> Add Category</button>
            </div>
        </div>

        <div class="inventory-card">
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Category Code</th>
                        <th>Description</th>
                        <th>Created At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="categoryTable">
                    <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:140px;"></span></td><td><span class="okw-sk-bar" style="width:84px;"></span></td><td><span class="okw-sk-bar" style="width:200px;"></span></td><td><span class="okw-sk-bar" style="width:96px;"></span></td><td><span class="okw-sk-bar" style="width:110px;"></span></td></tr>
                    <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:160px;"></span></td><td><span class="okw-sk-bar" style="width:76px;"></span></td><td><span class="okw-sk-bar" style="width:180px;"></span></td><td><span class="okw-sk-bar" style="width:96px;"></span></td><td><span class="okw-sk-bar" style="width:110px;"></span></td></tr>
                    <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:128px;"></span></td><td><span class="okw-sk-bar" style="width:90px;"></span></td><td><span class="okw-sk-bar" style="width:210px;"></span></td><td><span class="okw-sk-bar" style="width:96px;"></span></td><td><span class="okw-sk-bar" style="width:110px;"></span></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Category Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h3 id="catModalTitle" style="margin-bottom:14px;">Add Category</h3>
            <form data-onsubmit="saveCategory(event)">
                <input type="hidden" id="catId" value="">
                <div class="form-group">
                    <label for="catName">Category Name *</label>
                    <input type="text" id="catName" required placeholder="e.g. Cement & Aggregates">
                </div>
                <div class="form-group">
                    <label for="catCode">Category Code</label>
                    <input type="text" id="catCode" placeholder="e.g. CAT-001">
                </div>
                <div class="form-group">
                    <label for="catDesc">Description</label>
                    <textarea id="catDesc" rows="3" placeholder="Optional description..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" data-onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save" id="catSaveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <footer>© 2026 OKWESIWA CO LTD</footer>

    <script>
        let categoriesCache = [];
        document.addEventListener('DOMContentLoaded', loadCategories);

        function getCatHeaders(json = false) {
            const token = localStorage.getItem('authToken');
            const h = {};
            if (json) h['Content-Type'] = 'application/json';
            if (token && token !== 'null' && token !== 'undefined') h['Authorization'] = `Bearer ${token}`;
            return h;
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories', {
                    headers: getCatHeaders(false),
                    credentials: 'include'
                });
                const categories = await res.json().catch(() => []);
                categoriesCache = Array.isArray(categories) ? categories : [];
                const tbody = document.getElementById('categoryTable');
                
                if (categoriesCache.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:28px; color:var(--text-secondary);">No data available in table</td></tr>';
                    return;
                }

                tbody.innerHTML = categoriesCache.map(c => `
                    <tr>
                        <td style="font-weight:600; color:var(--primary-color);">${OkwUI.escapeHtml(c.name)}</td>
                        <td><span style="font-family:ui-monospace,monospace; font-size:12.5px; color:#475569;">${OkwUI.escapeHtml(c.code || '—')}</span></td>
                        <td>${OkwUI.escapeHtml(c.description || '—')}</td>
                        <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : '—'}</td>
                        <td style="white-space:nowrap;">
                            <button type="button" class="action-btn" data-cat-edit="${Number(c.id)}" title="Edit"><i class="fas fa-edit"></i> Edit</button>
                            <button type="button" class="action-btn btn-delete" data-cat-del="${Number(c.id)}" title="Delete"><i class="fas fa-trash"></i> Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('categoryTable').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Error loading categories</td></tr>';
            }
        }

        document.getElementById('categoryTable').addEventListener('click', (e) => {
            const editBtn = e.target.closest('[data-cat-edit]');
            if (editBtn) {
                const id = Number(editBtn.getAttribute('data-cat-edit'));
                const cat = categoriesCache.find(c => Number(c.id) === id);
                if (cat) openModal(cat);
                return;
            }
            const delBtn = e.target.closest('[data-cat-del]');
            if (delBtn) {
                const id = Number(delBtn.getAttribute('data-cat-del'));
                deleteCategory(id);
            }
        });

        function openModal(existing = null) {
            const isEdit = Boolean(existing && existing.id);
            document.getElementById('catModalTitle').textContent = isEdit ? 'Edit Category' : 'Add Category';
            document.getElementById('catSaveBtn').textContent = isEdit ? 'Save Changes' : 'Save';
            document.getElementById('catId').value = isEdit ? String(existing.id) : '';
            document.getElementById('catName').value = isEdit ? (existing.name || '') : '';
            document.getElementById('catCode').value = isEdit ? (existing.code || '') : '';
            document.getElementById('catDesc').value = isEdit ? (existing.description || '') : '';
            document.getElementById('categoryModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('catId').value.trim();
            const name = document.getElementById('catName').value.trim();
            const code = document.getElementById('catCode').value.trim();
            const description = document.getElementById('catDesc').value.trim();

            try {
                const url = id ? `/api/categories/${id}` : '/api/categories';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: getCatHeaders(true),
                    credentials: 'include',
                    body: JSON.stringify({ name, code, description })
                });

                if (res.ok) {
                    closeModal();
                    loadCategories();
                    if (window.OkwUI && OkwUI.toast) OkwUI.toast(id ? 'Category updated' : 'Category added', 'success');
                } else {
                    const err = await res.json().catch(() => ({}));
                    alert(err.message || "Error saving category");
                }
            } catch (e) { console.error(e); }
        }

        async function deleteCategory(id) {
            if (!confirm("Are you sure? This will not delete products in this category.")) return;
            
            try {
                const res = await fetch(`/api/categories/${id}`, { 
                    method: 'DELETE',
                    headers: getCatHeaders(false),
                    credentials: 'include'
                });
                if (res.ok) {
                    loadCategories();
                    if (window.OkwUI && OkwUI.toast) OkwUI.toast('Category deleted', 'success');
                } else {
                    alert("Error deleting category");
                }
            } catch (e) { console.error(e); }
        }

        async function logout() {
            if (window.authGuard && typeof window.authGuard.logout === 'function') {
                return window.authGuard.logout();
            }
            try {
                const token = localStorage.getItem('authToken');
                if (token) {
                    await fetch('/api/logout', { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).catch(() => {});
                }
            } catch (e) {
                console.error(e);
            } finally {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('/login?logout=true');
            }
        }
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // 2. Mobile Table Auto-Labeler
    function applyTableDataLabels() {
        document.querySelectorAll('.card-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
            if (headers.length === 0) return;
            table.querySelectorAll('tbody tr').forEach(tr => {
                tr.querySelectorAll('td').forEach((td, index) => {
                    if (headers[index] && !td.hasAttribute('data-label')) {
                        td.setAttribute('data-label', headers[index]);
                    }
                });
            });
        });
    }
    /* Optimized: Global MutationObserver removed to prevent DOM thrashing */
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTableDataLabels);
    } else {
        applyTableDataLabels();
    }
})();
</script>
<!-- ====================================================== -->
</body>
</html>
