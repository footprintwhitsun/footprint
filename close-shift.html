<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footprint | Close Shift</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="currency.js"></script>
    <script src="telemetry-guard.js"></script>
    <script src="instant-nav.js"></script>
    <script src="auth-guard.js"></script>
    <style>
        :root {
            --primary-color: #273990; --accent-color: #f9a51a;
            --secondary-color: #1c2b70;
            --gray-light: #f6f6f7;
            --success-color: #27ae60;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 0 25px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .brand { font-size: 24px; font-weight: 700; letter-spacing: 1px; font-family: 'Montserrat', sans-serif; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .back-btn { color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; opacity: 0.9; }
        .back-btn:hover { opacity: 1; }

        /* Container */
        .container {
            max-width: 600px;
            margin: 40px auto;
            width: 90%;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 { color: var(--primary-color); margin-bottom: 20px; text-align: center; }

        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .summary-item { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; }
        .summary-item label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .summary-item span { font-size: 18px; font-weight: 600; color: #333; }
        .summary-item.highlight { background: #e3f2fd; border: 1px solid #bbdefb; }
        .summary-item.highlight span { color: var(--primary-color); }

        .digital-totals { margin-bottom: 30px; padding: 15px; border: 1px dashed #ddd; border-radius: 8px; display: flex; justify-content: space-around; font-size: 14px; color: #555; }
        .digital-totals strong { color: #333; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 8px; }
        .input-field {
            width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--primary-color); }
        textarea.input-field { resize: vertical; min-height: 80px; }

        .diff-display { text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 16px; padding: 10px; border-radius: 6px; }
        .diff-display.balanced { background: #e8f5e9; color: var(--success-color); }
        .diff-display.short { background: #ffebee; color: #c62828; }
        .diff-display.over { background: #fff3e0; color: #f39c12; }

        .btn-close {
            width: 100%; padding: 15px; background: var(--secondary-color); color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-close:hover { opacity: 0.9; }

        /* Footer */
        footer {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 8px 25px;
            display: flex;
            justify-content: center;
            font-size: 12px;
            color: white;
            margin-top: auto;
        }

        /* Success Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none; justify-content: center; align-items: center;
            z-index: 3000; backdrop-filter: blur(4px);
        }
        .modal-box {
            background: white; padding: 40px; border-radius: 16px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%; width: 350px;
        }
        .modal-icon { font-size: 64px; color: var(--success-color); margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 10px; }
        .modal-text { color: #666; font-size: 14px; }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header { padding: 0 15px; height: 60px; }
            .brand { font-size: 14px; gap: 8px; }
            .brand img {
            width: auto;
            max-width: 140px;
            height: 36px;
            aspect-ratio: auto;
            border-radius: 6px;
            object-fit: contain;
            background: #ffffff;
            padding: 3px 10px;
            border: 1.5px solid rgba(249, 165, 26, 0.7);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
            .back-btn { font-size: 0; }
            .back-btn i { font-size: 18px; }

            .container { margin: 20px auto; padding: 20px; }
            
            .summary-grid { grid-template-columns: 1fr; gap: 10px; }
            .digital-totals { flex-direction: column; text-align: center; gap: 10px; }
        }
    </style>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>

    <header>
        <div class="brand"><img src="logo.png" alt="FOOTPRINT" style="width: auto; max-width: 140px; height: 36px; border-radius: 6px; object-fit: contain; background: #ffffff; padding: 3px 8px; border: 1.5px solid #f9a51a;"><span style="font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: 0.05em; text-transform: uppercase;">FOOTPRINT</span></div>
        <a href="pos" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Register</a>
    </header>

    <div class="container">
        <h2>Close Shift & Reconcile</h2>
        
        <div class="summary-grid">
            <div class="summary-item">
                <label>Starting Cash</label>
                <span id="startCash">--</span>
            </div>
            <div class="summary-item">
                <label>Cash Sales</label>
                <span id="cashSales">--</span>
            </div>
            <div class="summary-item highlight">
                <label>Expected Cash</label>
                <span id="expectedCash">--</span>
            </div>
        </div>

        <div class="digital-totals">
            <div>Mobile Money: <strong id="momoTotal">--</strong></div>
            <div>Card Payments: <strong id="cardTotal">--</strong></div>
        </div>

        <form onsubmit="closeShift(event)">
            <div class="form-group">
                <label id="cashCountedLabel">Actual Cash Counted</label>
                <input type="number" id="actualCash" step="0.01" placeholder="0.00" oninput="calculateDifference()">
            </div>
            <div class="diff-display" id="diffDisplay">Difference: 0.00</div>

            <div class="form-group">
                <label>Notes</label>
                <textarea id="notes" class="input-field" placeholder="Explain any discrepancies..."></textarea>
            </div>
            
            <button type="submit" class="btn-close">Submit & Close Shift</button>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon"><i class="fas fa-check-circle"></i></div>
            <div class="modal-title">Shift Closed</div>
            <div class="modal-text">Logging out...</div>
        </div>
    </div>

    <footer>
        <div>&copy; 2026 Footprint. All rights reserved.</div>
    </footer>

    <script>
        let activeShiftId = null;
        let expectedCash = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Check session
                const token = localStorage.getItem('authToken');
                const sessionRes = await fetch('/api/session', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!sessionRes.ok) {
                    window.location.href = '/login';
                    return;
                }

                // Load Summary
                const res = await fetch('/api/shifts/summary', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    activeShiftId = data.shiftId;
                    expectedCash = data.expectedCash;

                    document.getElementById('startCash').textContent = formatCurrency(data.startCash);
                    document.getElementById('cashSales').textContent = formatCurrency(data.cashSales);
                    document.getElementById('expectedCash').textContent = formatCurrency(data.expectedCash);
                    document.getElementById('momoTotal').textContent = formatCurrency(data.momoSales);
                    document.getElementById('cardTotal').textContent = formatCurrency(data.cardSales);
                    
                    calculateDifference();
                } else {
                    alert("Could not load shift summary. You may not have an active shift.");
                }
            } catch (err) {
                console.error(err);
                alert("Error connecting to server.");
            }
        });

        function calculateDifference() {
            const actual = parseFloat(document.getElementById('actualCash').value) || 0;
            const diff = actual - expectedCash;
            const display = document.getElementById('diffDisplay');
            
            display.textContent = `Difference: ${diff >= 0 ? '+' : ''}${formatCurrency(diff)}`;
            display.className = 'diff-display ' + (diff === 0 ? 'balanced' : (diff > 0 ? 'over' : 'short'));
        }

        async function closeShift(e) {
            e.preventDefault();
            const endCash = document.getElementById('actualCash').value;
            const notes = document.getElementById('notes').value;
            const token = localStorage.getItem('authToken');

            const res = await fetch('/api/shifts/close', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ endCash, notes })
            });

            if (res.ok) {
                const channel = new BroadcastChannel('footprint_customer_display');
                channel.postMessage({ type: 'CLOSE' });
                
                document.getElementById('successModal').style.display = 'flex';
                
                // Logout
                if (window.authGuard && typeof window.authGuard.logout === 'function') {
                    setTimeout(() => {
                        window.authGuard.logout();
                    }, 2000);
                } else {
                    await fetch('/api/logout', { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).catch(() => {});
                    
                    setTimeout(() => {
                        localStorage.clear();
                        sessionStorage.clear();
                        window.location.replace('/login?logout=true');
                    }, 2000);
                }
            } else {
                alert("Error closing shift.");
            }
        }
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 250);
        }, 3500);
    };
})();
</script>
<!-- ====================================================== -->
</body>
</html>
