<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Till - OKWESIWA LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/auth-guard.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { flex: 1; padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }
        body.okw-shift-gate .sidebar,
        body.okw-shift-gate .okw-topbar,
        body.okw-shift-gate .okw-hub-head,
        body.okw-shift-gate .okw-hub-bar,
        body.okw-shift-gate footer { display: none !important; }
        body.okw-shift-gate .main-content { margin-left: 0 !important; }
        body.okw-shift-gate .page-wrap { max-width: none !important; padding: 0 !important; }
        body.okw-shift-gate .okw-hub-panel { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; }
        body.okw-shift-gate .okw-hub-panel iframe { width: 100% !important; min-height: 100vh !important; height: 100vh !important; border: 0 !important; }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap" id="hub"></div>
        <footer style="text-align:center;padding:16px 24px;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border);">© 2026 OKWESIWA LTD</footer>
    </main>
</div>

<script>
(function () {
    // Each section shows the existing, working page for that job inside the hub.
    // The server also refuses these pages to anyone without the right role.
    OkwUI.sectionPage({
        mount: '#hub',
        title: 'Till',
        subtitle: 'Open and close your shift, close the day and review sales.',
        defaultId: 'open',
        sections: [
            { id: 'open', label: 'Open shift', embed: '/open-shift' },
            { id: 'close', label: 'Close shift', embed: '/close-shift' },
            { id: 'daily', label: 'Daily close', embed: '/daily-close' },
            { id: 'transactions', label: 'Transactions', embed: '/transactions' }
        ]
    });
})();
</script>
</body>
</html>
