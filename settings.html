<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - OKWESIWA CO LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/lazy-libs.js"></script>
    <script data-lazy-src="/vendor/xlsx-0.20.2.full.min.js"></script>
    <script src="/auth-guard.js"></script>
    <script src="/currency.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { flex: 1; padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 13px; font-weight: 600; color: var(--color-text); }
        .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; margin-top: 14px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .hint { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
        .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface-muted); margin-bottom: 14px; }
        .tag-pill { font-size: 11px; font-family: monospace; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer; color: var(--color-primary); }
        .tag-pill:hover { border-color: var(--color-primary); }
        .checks-row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 8px; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap" id="hub"></div>
        <footer style="text-align:center;padding:16px 24px;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border);">© 2026 OKWESIWA CO LTD</footer>
    </main>
</div>

<script>
(function () {
    const esc = OkwUI.escapeHtml;
    const authToken = () => localStorage.getItem('authToken') || localStorage.getItem('companyToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken()}` };
    const fmt = (n) => (typeof formatCurrency === 'function' ? formatCurrency(n) : 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    const MANAGERS = ['super_admin', 'ceo', 'admin', 'manager', 'store_manager'];
    const CEO_ADMIN = ['super_admin', 'ceo', 'admin'];
    const me = (() => {
        try { return JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('companyUser') || localStorage.getItem('user') || '{}') || {}; }
        catch (_) { return {}; }
    })();
    const myRole = String(me.role || '').toLowerCase();

    // A network failure comes back as { ok: false, status: 0 } so every caller can show its own message.
    async function api(url, opts = {}) {
        try {
            const res = await fetch(url, { headers, credentials: 'include', ...opts });
            const data = await res.json().catch(() => ({}));
            return { ok: res.ok, status: res.status, data };
        } catch (err) {
            return { ok: false, status: 0, data: { message: 'Could not reach the server. Check the connection and try again.' } };
        }
    }

    /* ====================================================================
       Store profile (was Settings): saved to /api/settings
       ==================================================================== */
    async function mountStore(panel, ctx) {
        ctx.toolbar.innerHTML = '<button type="button" class="okw-btn okw-btn-primary" id="st-save">Save</button>';
        const r = await api('/api/settings');
        if (!r.ok) { panel.innerHTML = '<div class="okw-empty">Store details could not be loaded.</div>'; OkwUI.toast('Could not load store details', 'danger'); return; }
        const s = r.data || {};
        const canTarget = ['ceo', 'admin', 'company', 'super_admin'].includes(myRole);
        panel.innerHTML = `
            <h2 class="okw-chart-title">Store profile</h2>
            <p class="hint" style="margin:0 0 16px;">Identification used on receipts and customer messages.</p>
            <div class="form-grid">
                <div class="field"><label for="st-name">Store name</label><input type="text" id="st-name" class="okw-input" value="${esc(s.store_name || '')}" placeholder="OKWESIWA CO LTD"></div>
                <div class="field"><label for="st-phone">Support phone</label><input type="text" id="st-phone" class="okw-input" value="${esc(s.phone || '')}" placeholder="+233 24 000 0000"></div>
                <div class="field"><label for="st-tin">Tax identification number (TIN)</label><input type="text" id="st-tin" class="okw-input" value="${esc(s.tax_id || '')}" placeholder="TIN-00000000"></div>
                <div class="field"><label for="st-email">Company email</label><input type="email" id="st-email" class="okw-input" value="${esc(s.email || '')}" placeholder="info@company.com"></div>
                <div class="field"><label for="st-address">Company address</label><input type="text" id="st-address" class="okw-input" value="${esc(s.address || '')}"></div>
                ${canTarget ? `<div class="field"><label for="st-target">Monthly sales target</label><input type="number" id="st-target" class="okw-input" step="100" min="0" value="${esc(s.monthly_target || '')}" placeholder="50000"></div>` : ''}
            </div>`;
        ctx.toolbar.querySelector('#st-save').addEventListener('click', async () => {
            const name = panel.querySelector('#st-name').value.trim();
            if (!name) return OkwUI.toast('Store name is required', 'warning');
            // Fields this form does not edit are kept from the freshly loaded settings, never from a browser copy.
            const body = {
                storeName: name,
                phone: panel.querySelector('#st-phone').value.trim(),
                taxId: panel.querySelector('#st-tin').value.trim(),
                email: panel.querySelector('#st-email').value.trim(),
                address: panel.querySelector('#st-address').value.trim(),
                logoUrl: s.logo_url || '',
                currencySymbol: s.currency_symbol || '₵',
                vatRate: s.vat_rate ?? 0,
                monthlyTarget: canTarget ? (parseFloat((panel.querySelector('#st-target') || {}).value) || 0) : (s.monthly_target || 0),
                receiptFooter: s.receipt_footer || ''
            };
            try {
                const res = await api('/api/settings', { method: 'POST', body: JSON.stringify(body) });
                if (!res.ok) throw new Error(res.data.message || 'Failed to update settings');
                Object.assign(s, { store_name: body.storeName, phone: body.phone, tax_id: body.taxId, email: body.email, address: body.address, monthly_target: body.monthlyTarget });
                try { localStorage.setItem('posSettings', JSON.stringify(s)); } catch (_) { }
                OkwUI.toast('Store profile saved', 'success');
            } catch (err) {
                OkwUI.toast(err.message || 'Connection error while saving', 'danger');
            }
        });
    }

    /* ====================================================================
       Business configuration (was Business Settings): one saved record,
       edited section by section. Edits in a section you leave are kept
       until you press Save.
       ==================================================================== */
    const bs = { cfg: null, panel: null };
    async function bsEnsure() {
        if (bs.cfg) return;
        const r = await api('/api/business-settings');
        if (!r.ok) throw new Error(r.data.message || 'Could not load business settings');
        bs.cfg = r.data.config || {};
    }
    function v(key, fallback = '') { return bs.cfg[key] ?? fallback; }
    function chk(key) { return bs.cfg[key] ? 'checked' : ''; }
    function bsCollect() {
        if (!bs.panel || !bs.cfg) return;
        bs.panel.querySelectorAll('[data-cfg]').forEach(el => {
            const k = el.getAttribute('data-cfg');
            if (el.type === 'checkbox') bs.cfg[k] = el.checked;
            else if (el.type === 'number') bs.cfg[k] = el.value === '' ? 0 : Number(el.value);
            else bs.cfg[k] = el.value;
        });
    }
    function bsRender(panel, tab) {
        if (tab === 'business') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Business</h2>
                <div class="form-grid">
                    <div class="field"><label>Business Name:*</label><input type="text" class="okw-input" data-cfg="business_name" value="${OkwUI.escapeHtml(v('business_name', 'OKWESIWA CO LTD'))}"></div>
                    <div class="field"><label>Start Date:</label><input type="date" class="okw-input" data-cfg="start_date" value="${OkwUI.escapeHtml(v('start_date'))}"></div>
                    <div class="field"><label>Default profit percent:*</label><input type="number" step="0.01" class="okw-input" data-cfg="default_profit_percent" value="${OkwUI.escapeHtml(v('default_profit_percent', 25))}"></div>
                    <div class="field"><label>Currency:</label>
                        <select class="okw-select" data-cfg="currency">
                            ${['GHS (₵)', 'USD ($)', 'EUR (€)', 'GBP (£)', 'NGN (₦)'].map(o => `<option${v('currency') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Currency Symbol Placement:</label>
                        <select class="okw-select" data-cfg="currency_symbol_placement">
                            ${['Before amount', 'After amount'].map(o => `<option${v('currency_symbol_placement') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Time zone:</label>
                        <select class="okw-select" data-cfg="timezone">
                            ${['Africa/Accra', 'UTC', 'Africa/Lagos', 'Europe/London', 'America/New_York'].map(o => `<option${v('timezone') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field">
                        <label>Upload Logo:</label>
                        <input type="file" id="bs-logo-file" accept="image/*" class="okw-input" style="padding:6px;">
                        <input type="hidden" data-cfg="logo_url" id="bs-logo-url" value="${OkwUI.escapeHtml(v('logo_url', '/okwesiwa-logo.svg'))}">
                        <span class="hint">Previous logo (if exists) will be replaced</span>
                    </div>
                    <div class="field"><label>Financial year start month:</label>
                        <select class="okw-select" data-cfg="financial_year_start_month">
                            ${['January','February','March','April','May','June','July','August','September','October','November','December'].map(o => `<option${v('financial_year_start_month') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Stock Accounting Method:*</label>
                        <select class="okw-select" data-cfg="stock_accounting_method">
                            ${['FIFO', 'LIFO', 'AVCO'].map(o => `<option${v('stock_accounting_method') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Transaction Edit Days:*</label><input type="number" class="okw-input" data-cfg="transaction_edit_days" value="${OkwUI.escapeHtml(v('transaction_edit_days', 30))}"></div>
                    <div class="field"><label>Date Format:*</label>
                        <select class="okw-select" data-cfg="date_format">
                            ${['dd/mm/yyyy', 'mm/dd/yyyy', 'yyyy-mm-dd'].map(o => `<option${v('date_format') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Time Format:*</label>
                        <select class="okw-select" data-cfg="time_format">
                            ${['24 Hour', '12 Hour'].map(o => `<option${v('time_format') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Currency precision:*</label>
                        <select class="okw-select" data-cfg="currency_precision">
                            ${[0, 1, 2, 3, 4].map(o => `<option value="${o}"${Number(v('currency_precision', 2)) === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Quantity precision:*</label>
                        <select class="okw-select" data-cfg="quantity_precision">
                            ${[0, 1, 2, 3, 4].map(o => `<option value="${o}"${Number(v('quantity_precision', 2)) === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Second currency:</label>
                        <select class="okw-select" data-cfg="second_currency">
                            ${['USD ($)', 'EUR (€)', 'GBP (£)', 'NGN (₦)'].map(o => `<option${v('second_currency') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <label class="check-item"><input type="checkbox" data-cfg="accept_second_currency" ${chk('accept_second_currency')}> <span>Accept payments in a second currency</span></label>
                    <p class="hint">The base currency above stays the one prices, stock and reports use. Rates are typed in by hand, under Sell &gt; Exchange rate.</p>
                </div>
            `;
            const logoIn = document.getElementById('bs-logo-file');
            if (logoIn) {
                logoIn.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        const raw = String(reader.result || '');
                        if (file.type === 'image/svg+xml') {
                            document.getElementById('bs-logo-url').value = raw;
                            OkwUI.toast('Logo ready — click Save settings to apply', 'success');
                            return;
                        }
                        const img = new Image();
                        img.onload = () => {
                            const maxW = 420, maxH = 160;
                            const scale = Math.min(1, maxW / img.width, maxH / img.height);
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(img.width * scale));
                            canvas.height = Math.max(1, Math.round(img.height * scale));
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            document.getElementById('bs-logo-url').value = canvas.toDataURL('image/png', 0.9);
                            OkwUI.toast('Logo ready — click Save settings to apply', 'success');
                        };
                        img.src = raw;
                    };
                    reader.readAsDataURL(file);
                });
            }
        } else if (tab === 'tax') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Tax</h2>
                <div class="form-grid">
                    <div class="field"><label>Tax 1 Name:</label><input type="text" class="okw-input" data-cfg="tax_1_name" value="${OkwUI.escapeHtml(v('tax_1_name'))}"></div>
                    <div class="field"><label>Tax 1 No.:</label><input type="text" class="okw-input" data-cfg="tax_1_no" value="${OkwUI.escapeHtml(v('tax_1_no'))}"></div>
                    <div class="field"><label>Tax 2 Name:</label><input type="text" class="okw-input" data-cfg="tax_2_name" value="${OkwUI.escapeHtml(v('tax_2_name'))}"></div>
                    <div class="field"><label>Tax 2 No.:</label><input type="text" class="okw-input" data-cfg="tax_2_no" value="${OkwUI.escapeHtml(v('tax_2_no'))}"></div>
                </div>
                <div style="margin-top:16px;">
                    <label class="check-item"><input type="checkbox" data-cfg="enable_inline_tax" ${chk('enable_inline_tax')}> <span>Enable inline tax in purchase and sell</span></label>
                </div>
            `;
        } else if (tab === 'product') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Product</h2>
                <div class="form-grid">
                    <div class="field"><label>SKU prefix:</label><input type="text" class="okw-input" data-cfg="sku_prefix" value="${OkwUI.escapeHtml(v('sku_prefix'))}"></div>
                    <div class="field"><label>Default Unit:</label><input type="text" class="okw-input" data-cfg="default_unit" value="${OkwUI.escapeHtml(v('default_unit', 'Unit'))}"></div>
                </div>
                <div class="check-grid">
                    <label class="check-item"><input type="checkbox" data-cfg="enable_product_expiry" ${chk('enable_product_expiry')}> <span>Enable Product Expiry</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_brands" ${chk('enable_brands')}> <span>Enable Brands</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_categories" ${chk('enable_categories')}> <span>Enable Categories</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_sub_categories" ${chk('enable_sub_categories')}> <span>Enable Sub-Categories</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_price_tax_info" ${chk('enable_price_tax_info')}> <span>Enable Price &amp; Tax info</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_sub_units" ${chk('enable_sub_units')}> <span>Enable Sub Units</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_racks" ${chk('enable_racks')}> <span>Enable Racks</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_row" ${chk('enable_row')}> <span>Enable Row</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_position" ${chk('enable_position')}> <span>Enable Position</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="enable_warranty" ${chk('enable_warranty')}> <span>Enable Warranty</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="product_image_required" ${chk('product_image_required')}> <span>Is product image required?</span></label>
                </div>
            `;
        } else if (tab === 'invoice') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Invoice Settings</h2>
                <div class="form-grid">
                    <div class="field"><label>Invoice Prefix:</label><input type="text" class="okw-input" data-cfg="invoice_prefix" value="${OkwUI.escapeHtml(v('invoice_prefix', 'INV'))}"></div>
                    <div class="field"><label>Invoice Numbering Scheme:</label><input type="text" class="okw-input" data-cfg="invoice_scheme" value="${OkwUI.escapeHtml(v('invoice_scheme', 'YYYY-0001'))}"></div>
                    <div class="field"><label>Invoice Layout:</label><input type="text" class="okw-input" data-cfg="invoice_layout" value="${OkwUI.escapeHtml(v('invoice_layout', 'Default A4 / Thermal'))}"></div>
                    <div class="field"><label>Invoice Footer Note:</label><input type="text" class="okw-input" data-cfg="invoice_footer_text" value="${OkwUI.escapeHtml(v('invoice_footer_text'))}"></div>
                </div>
                <div style="margin-top:14px;">
                    <label class="check-item"><input type="checkbox" data-cfg="show_logo_on_invoice" ${chk('show_logo_on_invoice')}> <span>Show business logo on invoices</span></label>
                </div>
            `;
        } else if (tab === 'barcode') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Barcode Settings</h2>
                <div class="form-grid">
                    <div class="field"><label>Barcode Format:</label>
                        <select class="okw-select" data-cfg="barcode_type">
                            ${[
                                ['C128', 'Code 128 (C128)'],
                                ['C39', 'Code 39 (C39)'],
                                ['EAN13', 'EAN-13'],
                                ['EAN8', 'EAN-8'],
                                ['UPCA', 'UPC-A'],
                                ['UPCE', 'UPC-E']
                            ].map(([val, lbl]) => {
                                const cur = v('barcode_type', 'C128');
                                const sel = (cur === val || cur === lbl || (cur === 'Code 128' && val === 'C128') || (cur === 'Code 39' && val === 'C39') || (cur === 'EAN-13' && val === 'EAN13')) ? ' selected' : '';
                                return `<option value="${val}"${sel}>${lbl}</option>`;
                            }).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Bar Width:</label><input type="number" class="okw-input" data-cfg="barcode_width" value="${OkwUI.escapeHtml(v('barcode_width', 2))}"></div>
                    <div class="field"><label>Bar Height (px):</label><input type="number" class="okw-input" data-cfg="barcode_height" value="${OkwUI.escapeHtml(v('barcode_height', 40))}"></div>
                </div>
                <div class="check-grid">
                    <label class="check-item"><input type="checkbox" data-cfg="show_price_on_barcode" ${chk('show_price_on_barcode')}> <span>Show price on barcode label</span></label>
                    <label class="check-item"><input type="checkbox" data-cfg="show_business_name_on_barcode" ${chk('show_business_name_on_barcode')}> <span>Show business name on barcode label</span></label>
                </div>
            `;
        } else if (tab === 'printers') {
            panel.innerHTML = `
                <h2 class="okw-chart-title">Receipt Printers</h2>
                <div class="form-grid">
                    <div class="field"><label>Printer Name:</label><input type="text" class="okw-input" data-cfg="printer_name" value="${OkwUI.escapeHtml(v('printer_name'))}"></div>
                    <div class="field"><label>Connection / Driver:</label>
                        <select class="okw-select" data-cfg="printer_type">
                            ${['Browser / ESC-POS', 'USB Thermal', 'Network TCP/IP'].map(o => `<option${v('printer_type') === o ? ' selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field"><label>Paper Width (mm):</label><input type="number" class="okw-input" data-cfg="paper_width_mm" value="${OkwUI.escapeHtml(v('paper_width_mm', 80))}"></div>
                    <div class="field"><label>Characters Per Line:</label><input type="number" class="okw-input" data-cfg="char_per_line" value="${OkwUI.escapeHtml(v('char_per_line', 42))}"></div>
                </div>
                <div style="margin-top:14px;">
                    <label class="check-item"><input type="checkbox" data-cfg="auto_print_receipt" ${chk('auto_print_receipt')}> <span>Auto-print receipt after checkout</span></label>
                </div>
            `;
        }
    }
    async function bsSave() {
        bsCollect();
        const r = await api('/api/business-settings', { method: 'PUT', body: JSON.stringify({ config: bs.cfg }) });
        if (r.ok) {
            bs.cfg = r.data.config || bs.cfg;
            if (bs.cfg.logo_url) {
                try {
                    const cached = JSON.parse(localStorage.getItem('posSettings') || '{}');
                    cached.logo_url = bs.cfg.logo_url;
                    if (bs.cfg.business_name) cached.store_name = bs.cfg.business_name;
                    localStorage.setItem('posSettings', JSON.stringify(cached));
                } catch (_) {}
                document.querySelectorAll('.sidebar .brand img, img[src*="okwesiwa-logo"], img[alt="Store Logo"], .brand-logo').forEach(el => {
                    el.src = bs.cfg.logo_url;
                });
            }
            OkwUI.toast('Business settings saved', 'success');
        }
        else OkwUI.toast(r.data.message || 'Failed to save settings', 'danger');
    }
    function businessSection(id, label) {
        return {
            id, label, group: 'Business', roles: MANAGERS,
            leave: bsCollect,
            render: async (panel, ctx) => {
                ctx.toolbar.innerHTML = '<button type="button" class="okw-btn okw-btn-primary" id="bs-save">Save settings</button>';
                ctx.toolbar.querySelector('#bs-save').addEventListener('click', bsSave);
                try { await bsEnsure(); } catch (err) { panel.innerHTML = '<div class="okw-empty">Business settings could not be loaded.</div>'; OkwUI.toast(err.message, 'danger'); return; }
                bs.panel = panel;
                bsRender(panel, id);
            }
        };
    }

    /* ====================================================================
       Locations (branches): stored in the database through /api/branches
       ==================================================================== */
    function mountLocations(panel, ctx) {
        ctx.toolbar.innerHTML = '<button type="button" class="okw-btn okw-btn-primary" id="loc-add">Add location</button>';
        panel.innerHTML = '<div id="loc-form"></div><div id="loc-table">Loading...</div>';
        const formHost = panel.querySelector('#loc-form');
        const tableHost = panel.querySelector('#loc-table');
        let rows = [];

        async function load() {
            const r = await api('/api/branches');
            if (!r.ok) { tableHost.innerHTML = '<div class="okw-empty">Locations could not be loaded.</div>'; OkwUI.toast(r.data.message || 'Could not load locations', 'danger'); return; }
            rows = (Array.isArray(r.data) ? r.data : []).map(b => ({ id: b.id, name: b.name, address: b.location || '', phone: b.phone || '', manager: b.manager || '', status: b.status || 'Active', is_main: !!b.is_main }));
            if (!rows.length) { tableHost.innerHTML = '<div class="okw-empty">No locations yet. Use "Add location" to create your first one.</div>'; return; }
            OkwUI.dataTable('#loc-table', {
                columns: [
                    { key: 'name', label: 'Location', render: (val, row) => esc(val) + (row.is_main ? ' ' + OkwUI.badge('Main', 'info') : '') },
                    { key: 'address', label: 'Address' },
                    { key: 'phone', label: 'Phone' },
                    { key: 'manager', label: 'Manager' },
                    { key: 'status', label: 'Status', render: (val) => OkwUI.badge(val, val === 'Active' ? 'success' : (val === 'Maintenance' ? 'warning' : 'danger')) },
                    {
                        key: 'id', label: 'Actions', render: (id) => `<div class="okw-filter-bar">
                            <button type="button" class="okw-btn okw-btn-outline" data-loc-edit="${Number(id)}">Edit</button>
                            <button type="button" class="okw-btn okw-btn-danger" data-loc-del="${Number(id)}">Delete</button></div>`
                    }
                ],
                rows, exportFilename: 'okwesiwa-locations.xlsx', printTitle: 'Locations'
            });
        }

        function showForm(loc) {
            const l = loc || { id: '', name: '', address: '', phone: '', manager: '', status: 'Active' };
            formHost.innerHTML = `
                <h2 class="okw-chart-title">${l.id ? 'Edit location' : 'Add location'}</h2>
                <div class="form-grid">
                    <div class="field"><label for="lc-name">Store name</label><input type="text" id="lc-name" class="okw-input" value="${esc(l.name)}"></div>
                    <div class="field"><label for="lc-address">Address</label><input type="text" id="lc-address" class="okw-input" value="${esc(l.address)}"></div>
                    <div class="field"><label for="lc-phone">Phone</label><input type="text" id="lc-phone" class="okw-input" value="${esc(l.phone)}"></div>
                    <div class="field"><label for="lc-manager">Manager</label><input type="text" id="lc-manager" class="okw-input" value="${esc(l.manager)}"></div>
                    <div class="field"><label for="lc-status">Status</label>
                        <select id="lc-status" class="okw-select">${['Active', 'Maintenance', 'Closed'].map(o => `<option${l.status === o ? ' selected' : ''}>${o}</option>`).join('')}</select>
                    </div>
                </div>
                <div class="okw-filter-bar" style="margin:16px 0 20px;justify-content:flex-end;">
                    <button type="button" class="okw-btn okw-btn-outline" id="lc-cancel">Cancel</button>
                    <button type="button" class="okw-btn okw-btn-primary" id="lc-save">Save location</button>
                </div>`;
            formHost.querySelector('#lc-name').focus();
            formHost.querySelector('#lc-cancel').onclick = () => { formHost.innerHTML = ''; };
            formHost.querySelector('#lc-save').onclick = async () => {
                const body = {
                    name: formHost.querySelector('#lc-name').value.trim(),
                    location: formHost.querySelector('#lc-address').value.trim(),
                    phone: formHost.querySelector('#lc-phone').value.trim(),
                    manager: formHost.querySelector('#lc-manager').value.trim(),
                    status: formHost.querySelector('#lc-status').value
                };
                if (!body.name) return OkwUI.toast('Give the location a name', 'warning');
                try {
                    const r = await api(l.id ? '/api/branches/' + encodeURIComponent(l.id) : '/api/branches', { method: l.id ? 'PUT' : 'POST', body: JSON.stringify(body) });
                    if (!r.ok) throw new Error(r.data.message || 'Could not save the location');
                    OkwUI.toast(l.id ? 'Location updated' : 'Location added', 'success');
                    formHost.innerHTML = '';
                    load();
                } catch (err) { OkwUI.toast(err.message, 'danger'); }
            };
        }

        ctx.toolbar.querySelector('#loc-add').onclick = () => showForm(null);
        tableHost.addEventListener('click', async (e) => {
            const edit = e.target.closest('[data-loc-edit]');
            const del = e.target.closest('[data-loc-del]');
            if (edit) { showForm(rows.find(x => x.id === Number(edit.dataset.locEdit))); return; }
            if (del) {
                const loc = rows.find(x => x.id === Number(del.dataset.locDel));
                if (!loc) return;
                const ok = await OkwUI.confirm('Delete location', `Delete "${loc.name}"? Past sales and stock records keep the branch name, but the location is removed from every list.`, { confirmText: 'Delete' });
                if (!ok) return;
                try {
                    const r = await api('/api/branches/' + encodeURIComponent(loc.id), { method: 'DELETE' });
                    if (!r.ok) throw new Error(r.data.message || 'Could not delete the location');
                    OkwUI.toast('Location deleted', 'success');
                    load();
                } catch (err) { OkwUI.toast(err.message, 'danger'); }
            }
        });
        load();
    }

    /* ====================================================================
       Tax rates and liability report (was Tax Management)
       ==================================================================== */
    function mountTax(panel, ctx) {
        const monthStart = new Date().toISOString().slice(0, 8) + '01';
        let range = { from: monthStart, to: new Date().toISOString().slice(0, 10) };
        let branch = 'All Branches';

        ctx.toolbar.innerHTML = OkwUI.filterDropdown({
            label: 'Filters',
            contentHtml: `
                <div class="okw-filter-field">
                    <label for="tx-branch">Branch</label>
                    <select id="tx-branch" class="okw-select" aria-label="Branch"><option value="All Branches">All Branches</option></select>
                </div>
                <div class="okw-filter-field">
                    <label>Date Range</label>
                    <div id="tx-date-picker"></div>
                </div>`
        });
        panel.innerHTML = `
            <div class="form-grid" style="margin-bottom:24px;align-items:start;">
                <div>
                    <h2 class="okw-chart-title">Add tax rule</h2>
                    <div class="form-grid">
                        <div class="field"><label for="tx-name">Tax name</label><input type="text" id="tx-name" class="okw-input" placeholder="e.g. NHIS levy"></div>
                        <div class="field"><label for="tx-rate">Rate (%)</label><input type="number" id="tx-rate" class="okw-input" step="0.01" placeholder="2.5"></div>
                    </div>
                    <div class="okw-filter-bar" style="margin-top:12px;"><button type="button" class="okw-btn okw-btn-primary" id="tx-add">Add rule</button></div>
                </div>
                <div>
                    <h2 class="okw-chart-title">Active tax rules</h2>
                    <div id="tx-rules">Loading...</div>
                </div>
            </div>
            <h2 class="okw-chart-title">Tax liability report</h2>
            <p class="hint" id="tx-note" style="margin:0 0 12px;"></p>
            <div class="okw-kpi-row" id="tx-kpis"></div>
            <div id="tx-report">Loading report...</div>`;

        api('/api/branches').then(r => {
            (Array.isArray(r.data) ? r.data : []).forEach(b => {
                if (!b.name) return;
                const o = document.createElement('option'); o.value = b.name; o.textContent = b.name;
                ctx.toolbar.querySelector('#tx-branch').appendChild(o);
            });
        }).catch(() => { });
        ctx.toolbar.querySelector('#tx-branch').addEventListener('change', (e) => { branch = e.target.value; report(); });
        OkwUI.dateRangePicker('#tx-date-picker', (r) => { range = r; report(); });

        async function rules() {
            const host = panel.querySelector('#tx-rules');
            try {
                const [t, s] = await Promise.all([api('/api/taxes'), api('/api/settings')]);
                if (!t.ok) throw new Error(t.data.message || 'Could not load tax rules');
                const vat = s.data && s.data.vat_rate !== undefined && s.data.vat_rate !== null ? parseFloat(s.data.vat_rate) : 15;
                const list = (Array.isArray(t.data) ? t.data : []);
                const rows = [];
                if (vat > 0) rows.push({ name: 'VAT (system)', rate: vat, del: 'vat' });
                list.forEach(x => rows.push({ name: x.name, rate: x.rate, del: String(x.id) }));
                if (!rows.length) { host.innerHTML = '<div class="okw-empty">No active tax rules.</div>'; return; }
                OkwUI.dataTable('#tx-rules', {
                    columns: [
                        { key: 'name', label: 'Tax' },
                        { key: 'rate', label: 'Rate', numeric: true, render: (val) => esc(val) + '%' },
                        { key: 'del', label: '', render: (id) => `<button type="button" class="okw-btn okw-btn-danger" data-tax-del="${esc(id)}">Remove</button>` }
                    ],
                    rows, exportFilename: 'okwesiwa-tax-rules.xlsx', printTitle: 'Tax rules'
                });
            } catch (err) {
                host.innerHTML = '<div class="okw-empty">Tax rules could not be loaded.</div>';
                OkwUI.toast(err.message, 'danger');
            }
        }

        panel.querySelector('#tx-add').addEventListener('click', async () => {
            const name = panel.querySelector('#tx-name').value.trim();
            const rate = panel.querySelector('#tx-rate').value;
            if (!name || rate === '') return OkwUI.toast('Enter a tax name and rate', 'warning');
            try {
                const r = await api('/api/taxes', { method: 'POST', body: JSON.stringify({ name, rate }) });
                if (!r.ok) throw new Error(r.data.message || 'Failed to add tax rule');
                panel.querySelector('#tx-name').value = ''; panel.querySelector('#tx-rate').value = '';
                OkwUI.toast('Tax rule added', 'success');
                rules(); report();
            } catch (err) { OkwUI.toast(err.message, 'danger'); }
        });
        panel.querySelector('#tx-rules').addEventListener('click', async (e) => {
            const b = e.target.closest('[data-tax-del]');
            if (!b) return;
            const id = b.dataset.taxDel;
            const isVat = id === 'vat';
            const ok = await OkwUI.confirm(isVat ? 'Remove system VAT?' : 'Remove tax rule?', isVat ? 'This sets the global VAT rate to 0.00%.' : 'This removes the tax rule permanently.', { confirmText: 'Remove' });
            if (!ok) return;
            try {
                const r = await api(isVat ? '/api/settings/vat' : '/api/taxes/' + encodeURIComponent(id), { method: 'DELETE' });
                if (!r.ok) throw new Error(r.data.message || 'Could not remove the tax rule');
                OkwUI.toast(isVat ? 'System VAT removed' : 'Tax rule removed', 'success');
                rules(); report();
            } catch (err) { OkwUI.toast(err.message, 'danger'); }
        });

        async function report() {
            const host = panel.querySelector('#tx-report');
            if (!host) return;
            host.textContent = 'Generating report...';
            try {
                const qs = new URLSearchParams({ startDate: range.from, endDate: range.to, branch });
                const r = await api('/api/ceo/tax-report?' + qs);
                if (r.status === 403) { host.innerHTML = '<div class="okw-empty">The tax liability report is for CEO and admin users.</div>'; panel.querySelector('#tx-kpis').innerHTML = ''; return; }
                if (!r.ok) throw new Error(r.data.message || 'Failed to generate the report');
                const ruleList = r.data.rules || [];
                const data = r.data.report || [];
                panel.querySelector('#tx-note').textContent = r.data.reportNote || '';
                const label = (x) => (x.rate != null && x.rate !== '' && Number.isFinite(Number(x.rate)) ? `${x.name} (${Number(x.rate)}%)` : (x.historical ? `${x.name} (recorded on sale)` : x.name));
                const sum = (f) => data.reduce((s, row) => s + Number(f(row) || 0), 0);
                panel.querySelector('#tx-kpis').innerHTML = [
                    OkwUI.kpiCard({ label: 'Gross sales', value: fmt(sum(x => x.grossRevenue)), tone: 'primary' }),
                    OkwUI.kpiCard({ label: 'Net sales', value: fmt(sum(x => x.netRevenue)), tone: 'info' }),
                    OkwUI.kpiCard({ label: 'Total tax', value: fmt(sum(x => x.totalTax)), tone: 'warning' })
                ].join('');
                if (!data.length) { host.innerHTML = '<div class="okw-empty">No sales data found for this period.</div>'; return; }
                const amountFor = (row, rule) => { const b = (row.breakdown || []).find(z => z.name === rule.name); return b ? b.amount : 0; };
                const tableRows = data.map(row => {
                    const o = { branch: row.branch, gross: row.grossRevenue, net: row.netRevenue, tax: row.totalTax };
                    ruleList.forEach((rule, i) => { o['r' + i] = amountFor(row, rule); });
                    return o;
                });
                const total = { branch: 'TOTAL', gross: sum(x => x.grossRevenue), net: sum(x => x.netRevenue), tax: sum(x => x.totalTax) };
                ruleList.forEach((rule, i) => { total['r' + i] = data.reduce((s, row) => s + Number(amountFor(row, rule) || 0), 0); });
                tableRows.push(total);
                OkwUI.dataTable('#tx-report', {
                    columns: [
                        { key: 'branch', label: 'Branch' },
                        { key: 'gross', label: 'Gross sales', numeric: true, render: fmt },
                        { key: 'net', label: 'Net sales', numeric: true, render: fmt },
                        { key: 'tax', label: 'Total tax', numeric: true, render: fmt },
                        ...ruleList.map((rule, i) => ({ key: 'r' + i, label: label(rule), numeric: true, render: fmt }))
                    ],
                    rows: tableRows, exportFilename: 'okwesiwa-tax-liability.xlsx', printTitle: 'Tax liability report'
                });
            } catch (err) {
                host.innerHTML = '<div class="okw-empty">The report could not be generated.</div>';
                OkwUI.toast(err.message, 'danger');
            }
        }
        rules();
        report();
    }

        lastFocusedInput = document.getElementById('nt-email-body');
        panel.querySelectorAll('.nt-field').forEach(el => {
            el.addEventListener('focus', () => { lastFocusedInput = el; });
            el.addEventListener('input', updatePreview);
        });
        const sendTestBtn = document.getElementById('nt-send-test');
        if (sendTestBtn) {
            sendTestBtn.addEventListener('click', async () => {
                const to = document.getElementById('nt-test-to')?.value.trim();
                if (!to) return OkwUI.toast('Enter a recipient email address first', 'warning');
                sendTestBtn.disabled = true;
                try {
                    const res = await fetch('/api/notification-templates/test-email', {
                        method: 'POST',
                        headers,
                        credentials: 'include',
                        body: JSON.stringify({
                            to,
                            subject: renderSample(document.getElementById('nt-subject')?.value || ''),
                            body: renderSample(document.getElementById('nt-email-body')?.value || '')
                        })
                    });
                    const d = await res.json().catch(() => ({}));
                    OkwUI.toast(d.message || (res.ok ? 'Test email sent' : 'Failed to send'), res.ok ? 'success' : 'danger');
                } finally {
                    sendTestBtn.disabled = false;
                }
            });
        }
        const emailArea = document.getElementById('nt-email-body');
        if (emailArea) {
            emailArea.addEventListener('input', () => {
                const wc = document.getElementById('nt-word-count');
                if (wc) wc.textContent = `${countWords(emailArea.value)} WORDS`;
            });
        }
        panel.querySelectorAll('.tag-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = lastFocusedInput || document.getElementById('nt-email-body');
                if (!target) return;
                const tag = btn.getAttribute('data-tag') || '';
                const start = target.selectionStart ?? target.value.length;
                const end = target.selectionEnd ?? target.value.length;
                target.value = target.value.slice(0, start) + tag + target.value.slice(end);
                target.focus();
                target.selectionStart = target.selectionEnd = start + tag.length;
                target.dispatchEvent(new Event('input'));
            });
        });
    }

    document.getElementById('nt-save').addEventListener('click', async () => {
        const payload = {
            email_subject: document.getElementById('nt-subject')?.value || '',
            cc: document.getElementById('nt-cc')?.value || '',
            bcc: document.getElementById('nt-bcc')?.value || '',
            email_body: document.getElementById('nt-email-body')?.value || '',
            sms_body: document.getElementById('nt-sms')?.value || '',
            whatsapp_text: '',
            auto_send_email: Boolean(document.getElementById('nt-auto-email')?.checked),
            auto_send_sms: Boolean(document.getElementById('nt-auto-sms')?.checked),
            auto_send_whatsapp: false
        };
        const res = await fetch(`/api/notification-templates/${encodeURIComponent(activeKey)}`, {
            method: 'PUT',
            headers,
            credentials: 'include',
            body: JSON.stringify(payload)
        });
        const d = await res.json().catch(() => ({}));
        if (res.ok) {
            const idx = templates.findIndex(t => t.template_key === activeKey);
            if (idx >= 0) templates[idx] = { ...templates[idx], ...payload };
            else templates.push({ template_key: activeKey, ...payload });
            OkwUI.toast('Notification template saved', 'success');
        } else {
            OkwUI.toast(d.message || 'Failed to save template', 'danger');
        }
    });

    load();
    }

    /* ====================================================================
       Activity log (full audit trail — Buy, Sell, Amend, Delete, Quotes, Drafts)
       ==================================================================== */
    function mountActivity(panel, ctx) {
        const fmtMoney = (n) => 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        let allLogs = [];
        let dateRange = { from: '', to: '' };

        ctx.kpis.innerHTML = `<div class="okw-kpi-row" id="al-kpis"></div>`;
        ctx.toolbar.innerHTML = OkwUI.filterDropdown({
            label: 'Filters',
            contentHtml: `
                <div class="okw-filter-field">
                    <label for="al-role">Staff Role</label>
                    <select id="al-role" class="okw-select" aria-label="Filter by role">
                        <option value="">All Roles</option>
                        <option value="ceo">CEO</option>
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="store_manager">Store Manager</option>
                        <option value="cashier">Cashier</option>
                        <option value="teller">Teller</option>
                    </select>
                </div>
                <div class="okw-filter-field">
                    <label for="al-cat">Action Category</label>
                    <select id="al-cat" class="okw-select" aria-label="Filter by category">
                        <option value="">All Actions</option>
                        <option value="sell">Sell / POS Sales</option>
                        <option value="buy">Buy / Purchases &amp; Receiving</option>
                        <option value="quotes">Quotes / Quotations</option>
                        <option value="drafts">Drafts / Held Sales</option>
                        <option value="amend">Amendments / Edits &amp; Stock</option>
                        <option value="delete">Deletes &amp; Returns</option>
                        <option value="finance">Expenses &amp; Finance</option>
                        <option value="auth">Staff, Shifts &amp; Security</option>
                    </select>
                </div>
                <div class="okw-filter-field">
                    <label>Date Range</label>
                    <div id="al-date-picker"></div>
                </div>
                <div class="okw-filter-actions">
                    <button type="button" class="okw-btn okw-btn-outline" id="al-reset">Reset</button>
                </div>`
        }) + `<button type="button" class="okw-btn okw-btn-outline" id="al-refresh">Refresh</button>`;
        panel.innerHTML = '<div id="audit-table-host">Loading activity log...</div>';

        const roleSel = ctx.toolbar.querySelector('#al-role');
        const catSel = ctx.toolbar.querySelector('#al-cat');
        const resetBtn = ctx.toolbar.querySelector('#al-reset');

        OkwUI.dateRangePicker('#al-date-picker', (r) => {
            dateRange = r;
            load();
        });

        function classifyAction(action) {
            const a = String(action || '').toUpperCase();
            if (/QUOTATION|QUOTE/.test(a)) return 'quotes';
            if (/DRAFT|HOLD/.test(a)) return 'drafts';
            if (/DELETE|RETURN|VOID|REJECT|REMOV/.test(a)) return 'delete';
            if (/PO|RECEIVE_GOODS|BUY|PURCHASE|SUPPLIER/.test(a)) return 'buy';
            if (/SALE|CHECKOUT|FINALIZE_TRANSACTION/.test(a)) return 'sell';
            if (/AMEND|UPDATE|ADJUSTMENT|STOCK_TAKE|TRANSFER|RESTORE|EDIT/.test(a)) return 'amend';
            if (/EXPENSE|GL_|PAYROLL|JOURNAL|RECONCIL/.test(a)) return 'finance';
            return 'auth';
        }

        function actionBadgeTone(cat) {
            if (cat === 'sell') return 'success';
            if (cat === 'buy') return 'info';
            if (cat === 'delete') return 'danger';
            if (cat === 'amend' || cat === 'drafts') return 'warning';
            return 'neutral';
        }

        function summarizeDetails(action, raw) {
            const d = (raw && typeof raw === 'object') ? raw : {};
            const parts = [];
            if (d.receipt_number || d.receiptNumber) parts.push(`#${d.receipt_number || d.receiptNumber}`);
            if (d.return_receipt) parts.push(`Return #${d.return_receipt}`);
            if (d.original_receipt) parts.push(`Orig #${d.original_receipt}`);
            if (d.quote_number) parts.push(d.quote_number);
            if (d.po_id || d.poId) parts.push(`PO #${d.po_id || d.poId}`);
            if (d.label) parts.push(d.label);
            if (d.customer_name) parts.push(d.customer_name);
            if (d.name && !d.customer_name) parts.push(d.name);
            if (d.category && !d.changes) parts.push(d.category);
            if (d.total !== undefined) parts.push(fmtMoney(d.total));
            else if (d.total_amount !== undefined) parts.push(fmtMoney(d.total_amount));
            else if (d.refund_total !== undefined) parts.push(`Refund ${fmtMoney(d.refund_total)}`);
            else if (d.amount !== undefined) parts.push(fmtMoney(d.amount));
            if (Array.isArray(d.items) && d.items.length) {
                const preview = d.items.slice(0, 2).map(it => `${it.name || it.barcode} ×${it.qty}`).join(', ');
                parts.push(`+${d.items.length} item${d.items.length === 1 ? '' : 's'} (${preview}${d.items.length > 2 ? ', …' : ''})`);
            }
            if (Array.isArray(d.items_removed) && d.items_removed.length) {
                const preview = d.items_removed.slice(0, 2).map(it => `${it.name || it.barcode} ×${it.qty}`).join(', ');
                parts.push(`Removed ${d.items_removed.length} (${preview}${d.items_removed.length > 2 ? ', …' : ''})`);
            }
            if (d.changes && typeof d.changes === 'object' && Object.keys(d.changes).length) {
                const diffStr = Object.entries(d.changes).slice(0, 3).map(([k, v]) => `${k}: ${v.from} → ${v.to}`).join(', ');
                parts.push(`Amended (${diffStr})`);
            }
            if (d.quantity_adjusted !== undefined) {
                parts.push(`${d.product_barcode || ''} (${Number(d.quantity_adjusted) >= 0 ? '+' : ''}${d.quantity_adjusted})`);
            }
            if (d.reason) parts.push(`Reason: ${d.reason}`);
            if (parts.length) return parts.join(' · ');
            return typeof raw === 'object' ? JSON.stringify(raw) : String(raw || '');
        }

        function openDetailModal(log) {
            const prev = document.getElementById('okw-audit-detail-modal');
            if (prev) prev.remove();
            const d = (log.rawDetails && typeof log.rawDetails === 'object') ? log.rawDetails : {};
            const itemsAdded = Array.isArray(d.items) ? d.items : [];
            const itemsRemoved = Array.isArray(d.items_removed) ? d.items_removed : [];
            const changes = (d.changes && typeof d.changes === 'object') ? Object.entries(d.changes) : [];
            const payments = Array.isArray(d.payments) ? d.payments : [];

            const renderItemsTable = (title, list, tone) => !list.length ? '' : `
                <div style="margin-top:14px;">
                    <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:${tone};margin-bottom:6px;">${title} (${list.length})</div>
                    <table class="okw-table" style="width:100%;font-size:12.5px;">
                        <thead><tr><th>Item</th><th>Barcode</th><th class="okw-num">Qty</th><th class="okw-num">Price</th><th class="okw-num">Total</th></tr></thead>
                        <tbody>
                            ${list.map(it => `<tr>
                                <td><strong>${esc(it.name || it.barcode || 'Item')}</strong></td>
                                <td>${esc(it.barcode || '—')}</td>
                                <td class="okw-num">${esc(it.qty ?? '')}</td>
                                <td class="okw-num">${it.price !== undefined ? fmtMoney(it.price) : '—'}</td>
                                <td class="okw-num"><strong>${it.line_total !== undefined ? fmtMoney(it.line_total) : (it.price !== undefined ? fmtMoney(Number(it.price) * Number(it.qty || 1)) : '—')}</strong></td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;

            const changesHtml = !changes.length ? '' : `
                <div style="margin-top:14px;">
                    <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#b45309;margin-bottom:6px;">Amended Fields (Before → After)</div>
                    <table class="okw-table" style="width:100%;font-size:12.5px;">
                        <thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead>
                        <tbody>${changes.map(([k, v]) => `<tr><td><strong>${esc(k)}</strong></td><td>${esc(v.from ?? '—')}</td><td><strong>${esc(v.to ?? '—')}</strong></td></tr>`).join('')}</tbody>
                    </table>
                </div>`;

            const paymentsHtml = !payments.length ? '' : `
                <div style="margin-top:10px;font-size:12.5px;">
                    <strong>Payments:</strong> ${payments.map(p => `${esc(p.method)}: ${fmtMoney(p.amount)}`).join(' · ')}
                </div>`;

            const backdrop = document.createElement('div');
            backdrop.id = 'okw-audit-detail-modal';
            backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(11,16,23,0.62);z-index:10050;display:flex;align-items:center;justify-content:center;padding:16px;';
            backdrop.innerHTML = `
                <div class="okw-card" style="width:100%;max-width:760px;max-height:88vh;overflow-y:auto;padding:20px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.3);">
                    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge,#e2e8f0);padding-bottom:10px;margin-bottom:14px;">
                        <div>
                            <h2 style="margin:0;font-size:17px;">${esc(log.action)}</h2>
                            <div style="font-size:12px;color:var(--muted,#64748b);margin-top:2px;">${esc(log.time)} · ${esc(log.user)} (${esc(log.role)}) · IP ${esc(log.ip || '—')}</div>
                        </div>
                        <button type="button" id="al-modal-close" class="okw-btn okw-btn-outline">Close</button>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;font-size:12.5px;padding:10px 12px;border-radius:8px;background:var(--frame,#f8fafc);border:1px solid var(--edge,#e2e8f0);">
                        <div><span style="color:var(--muted);">Branch:</span> <strong>${esc(d.store_location || d.branch || '—')}</strong></div>
                        ${d.customer_name ? `<div><span style="color:var(--muted);">Customer:</span> <strong>${esc(d.customer_name)}</strong></div>` : ''}
                        ${(d.receipt_number || d.receiptNumber || d.quote_number || d.po_id) ? `<div><span style="color:var(--muted);">Ref #:</span> <strong>${esc(d.receipt_number || d.receiptNumber || d.quote_number || ('PO-' + d.po_id))}</strong></div>` : ''}
                        ${d.subtotal !== undefined ? `<div><span style="color:var(--muted);">Subtotal:</span> <strong>${fmtMoney(d.subtotal)}</strong></div>` : ''}
                        ${d.discount_amount ? `<div><span style="color:var(--muted);">Discount:</span> <strong>-${fmtMoney(d.discount_amount)}</strong></div>` : ''}
                        ${(d.total !== undefined || d.total_amount !== undefined || d.refund_total !== undefined || d.amount !== undefined) ? `<div><span style="color:var(--muted);">Total:</span> <strong>${fmtMoney(d.total ?? d.total_amount ?? d.refund_total ?? d.amount)}</strong></div>` : ''}
                    </div>
                    ${paymentsHtml}
                    ${renderItemsTable('Items Added / Sold / Purchased', itemsAdded, '#15803d')}
                    ${renderItemsTable('Items Removed / Returned / Deleted', itemsRemoved, '#b91c1c')}
                    ${changesHtml}
                    <details style="margin-top:14px;">
                        <summary style="font-size:12px;color:var(--muted);cursor:pointer;">Raw audit payload</summary>
                        <pre style="margin:8px 0 0;padding:10px;border-radius:8px;background:var(--frame,#f8fafc);font-size:11.5px;overflow:auto;">${esc(JSON.stringify(d, null, 2))}</pre>
                    </details>
                </div>`;
            document.body.appendChild(backdrop);
            backdrop.querySelector('#al-modal-close').onclick = () => backdrop.remove();
            backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
        }

        function renderFiltered() {
            const roleVal = (roleSel.value || '').trim().toLowerCase();
            const catVal = (catSel.value || '').trim().toLowerCase();
            const filtered = allLogs.filter(l => {
                if (roleVal && l.roleKey !== roleVal) return false;
                if (catVal && l.category !== catVal) return false;
                return true;
            });

            const kpiEl = ctx.kpis.querySelector('#al-kpis');
            if (kpiEl) {
                const salesBuys = filtered.filter(l => l.category === 'sell' || l.category === 'buy').length;
                const quotesDrafts = filtered.filter(l => l.category === 'quotes' || l.category === 'drafts').length;
                const amendsDeletes = filtered.filter(l => l.category === 'amend' || l.category === 'delete').length;
                kpiEl.innerHTML = [
                    OkwUI.kpiCard({ label: 'Total Events', value: filtered.length, tone: 'primary' }),
                    OkwUI.kpiCard({ label: 'Buy & Sell', value: salesBuys, tone: 'success' }),
                    OkwUI.kpiCard({ label: 'Quotes & Drafts', value: quotesDrafts, tone: 'info' }),
                    OkwUI.kpiCard({ label: 'Amends, Returns & Deletes', value: amendsDeletes, tone: amendsDeletes > 0 ? 'warning' : 'neutral' })
                ].join('');
            }

            OkwUI.dataTable('#audit-table-host', {
                columns: [
                    { key: 'time', label: 'Timestamp' },
                    { key: 'user', label: 'Staff' },
                    { key: 'role', label: 'Role', render: (val) => OkwUI.badge(val, 'info') },
                    { key: 'action', label: 'Action', render: (val, row) => OkwUI.badge(val, actionBadgeTone(row.category)) },
                    { key: 'details', label: 'Summary' },
                    {
                        key: 'id',
                        label: 'Inspect',
                        render: (id) => `<button type="button" class="okw-btn okw-btn-outline" data-al-view="${esc(id)}" style="height:28px;padding:0 10px;font-size:12px;">View</button>`
                    }
                ],
                rows: filtered,
                searchPlaceholder: 'Search staff, role, action, item, or receipt...',
                exportFilename: 'okwesiwa-activity-log.xlsx',
                printTitle: 'Activity Log',
                pageSize: 25
            });

            panel.querySelectorAll('[data-al-view]').forEach(btn => {
                btn.onclick = () => {
                    const hit = allLogs.find(x => String(x.id) === String(btn.dataset.alView));
                    if (hit) openDetailModal(hit);
                };
            });
        }

        async function load() {
            const host = panel.querySelector('#audit-table-host');
            const qs = new URLSearchParams({ limit: '500' });
            if (dateRange.from) qs.set('from', dateRange.from);
            if (dateRange.to) qs.set('to', dateRange.to);
            const r = await api('/api/audit-logs?' + qs.toString());
            if (!r.ok) {
                host.innerHTML = '<div class="okw-empty">Unable to load the activity log (CEO or manager access required).</div>';
                if (r.status === 0) OkwUI.toast(r.data.message, 'danger');
                return;
            }
            const list = Array.isArray(r.data) ? r.data : (r.data.logs || []);
            allLogs = list.map((l, idx) => {
                const roleRaw = String(l.user_role || (l.details && l.details.actor_role) || 'system');
                return {
                    id: l.id || idx,
                    time: new Date(l.created_at).toLocaleString(),
                    user: l.user_name || l.user_email || (l.details && l.details.actor_name) || 'System',
                    role: roleRaw.replace(/_/g, ' ').toUpperCase(),
                    roleKey: roleRaw.toLowerCase().replace(/[\s-]+/g, '_'),
                    action: l.action,
                    category: classifyAction(l.action),
                    details: summarizeDetails(l.action, l.details),
                    rawDetails: l.details,
                    ip: l.ip_address || ''
                };
            });
            renderFiltered();
        }

        roleSel.addEventListener('change', renderFiltered);
        catSel.addEventListener('change', renderFiltered);
        resetBtn.addEventListener('click', () => {
            roleSel.value = '';
            catSel.value = '';
            dateRange = { from: '', to: '' };
            load();
        });
        ctx.toolbar.querySelector('#al-refresh').onclick = load;
        load();
    }

    /* ====================================================================
       Backups and data export (CEO and admin only)
       ==================================================================== */
    function mountBackups(panel, ctx) {
        ctx.toolbar.innerHTML = `
            <button type="button" class="okw-btn okw-btn-outline" id="bk-excel">Export all data to Excel</button>
            <button type="button" class="okw-btn okw-btn-outline" id="bk-pdf">Export all data to PDF</button>
            <button type="button" class="okw-btn okw-btn-primary" id="bk-create">Create backup now</button>`;
        panel.innerHTML = `
            <div class="okw-kpi-row" id="bk-kpis"></div>
            <h2 class="okw-chart-title">Backup history (30-day retention)</h2>
            <div id="bk-table">Loading backups...</div>`;

        const download = async (url, filename, okMsg, failMsg) => {
            try {
                const res = await fetch(url, { headers, credentials: 'include' });
                if (!res.ok) throw new Error(failMsg);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = filename; a.click();
                if (okMsg) OkwUI.toast(okMsg, 'success');
            } catch (err) { OkwUI.toast(err.message || failMsg, 'danger'); }
        };

        async function load() {
            const host = panel.querySelector('#bk-table');
            const r = await api('/api/backups');
            if (!r.ok) { host.innerHTML = '<div class="okw-empty">CEO or admin access is required to manage backups.</div>'; if (r.status === 0) OkwUI.toast(r.data.message, 'danger'); return; }
            const list = r.data.backups || [];
            const latest = list[0];
            panel.querySelector('#bk-kpis').innerHTML = [
                OkwUI.kpiCard({ label: 'Stored backups', value: String(list.length), subtext: '30-day rolling retention', tone: 'primary' }),
                OkwUI.kpiCard({ label: 'Latest backup', value: latest ? new Date(latest.created_at).toLocaleDateString() : 'None', subtext: latest ? String(latest.backup_type || '').toUpperCase() : 'Run one manually', tone: latest ? 'success' : 'warning' }),
                OkwUI.kpiCard({ label: 'Auto schedule', value: 'Nightly', subtext: 'Runs automatically every night', tone: 'info' })
            ].join('');
            if (!list.length) { host.innerHTML = '<div class="okw-empty">No backups yet.</div>'; return; }
            OkwUI.dataTable('#bk-table', {
                columns: [
                    { key: 'created', label: 'Created at' },
                    { key: 'type', label: 'Type', render: (val) => OkwUI.badge(val, val === 'auto' ? 'info' : 'success') },
                    { key: 'filename', label: 'Snapshot file' },
                    { key: 'summary', label: 'Contents' },
                    { key: 'size', label: 'Size', numeric: true },
                    {
                        key: 'id', label: 'Actions', render: (id) => `<div class="okw-filter-bar">
                            <button type="button" class="okw-btn okw-btn-outline" data-bk-dl="${Number(id)}" data-fmt="json">JSON</button>
                            <button type="button" class="okw-btn okw-btn-outline" data-bk-dl="${Number(id)}" data-fmt="docx">DOCX</button>
                            <button type="button" class="okw-btn okw-btn-accent" data-bk-restore="${Number(id)}">Restore</button></div>`
                    }
                ],
                rows: list.map(b => ({
                    id: b.id,
                    created: new Date(b.created_at).toLocaleString(),
                    type: b.backup_type,
                    filename: b.filename,
                    summary: b.summary ? `${b.summary.products || 0} products · ${b.summary.customers || 0} customers · ${b.summary.transactions || 0} sales` : '',
                    size: `${Math.max(1, Math.round((b.size_bytes || 0) / 1024))} KB`
                })),
                searchPlaceholder: 'Filter backups...', exportFilename: 'okwesiwa-backup-log.xlsx', printTitle: 'Backup log'
            });
        }

        panel.querySelector('#bk-table').addEventListener('click', async (e) => {
            const dl = e.target.closest('[data-bk-dl]');
            const rs = e.target.closest('[data-bk-restore]');
            if (dl) {
                const id = dl.dataset.bkDl, f = dl.dataset.fmt;
                download(`/api/backups/${id}/download${f === 'docx' ? '?format=docx' : ''}`, `okwesiwa-backup-${id}.${f === 'docx' ? 'docx' : 'json'}`, '', 'Download failed');
            } else if (rs) {
                const ok = await OkwUI.confirm('Restore backup', 'Verify and stage this backup snapshot for restore?', { confirmText: 'Restore' });
                if (!ok) return;
                const r = await api(`/api/backups/${rs.dataset.bkRestore}/restore`, { method: 'POST' });
                OkwUI.toast(r.data.message || (r.ok ? 'Restore completed' : 'Restore failed'), r.ok ? 'success' : 'danger');
            }
        });
        ctx.toolbar.querySelector('#bk-create').onclick = async () => {
            const r = await api('/api/backups/create', { method: 'POST' });
            if (r.ok) { OkwUI.toast('Manual backup created successfully', 'success'); load(); }
            else OkwUI.toast(r.data.message || 'Backup failed', 'danger');
        };
        const day = new Date().toISOString().slice(0, 10);
        ctx.toolbar.querySelector('#bk-excel').onclick = () => download('/api/backups/export-excel', `OKWESIWA-LTD-Full-Export-${day}.xlsx`, 'Full Excel workbook downloaded', 'Excel export failed');
        ctx.toolbar.querySelector('#bk-pdf').onclick = () => download('/api/backups/export-pdf', `OKWESIWA-LTD-Full-Export-${day}.pdf`, 'Full PDF report downloaded', 'PDF export failed');
        load();
    }

    OkwUI.sectionPage({
        mount: '#hub',
        title: 'Settings',
        subtitle: 'Store profile, business configuration, locations, taxes, messages and security.',
        defaultId: 'store',
        sections: [
            { id: 'store', label: 'Store profile', group: 'Business', render: mountStore },
            businessSection('business', 'Business'),
            businessSection('tax', 'Tax defaults'),
            businessSection('product', 'Product'),
            businessSection('invoice', 'Invoice'),
            businessSection('barcode', 'Barcode'),
            businessSection('printers', 'Receipt printers'),
            { id: 'locations', label: 'Locations', group: 'Locations and tax', roles: MANAGERS, render: mountLocations },
            { id: 'taxrates', label: 'Tax rates and report', group: 'Locations and tax', roles: MANAGERS, render: mountTax },
            { id: 'notifications', label: 'Notification templates', group: 'Messages', roles: MANAGERS, render: mountNotifications },
            { id: 'activity', label: 'Activity log', group: 'Security', roles: MANAGERS, render: mountActivity },
            { id: 'backups', label: 'Backups and export', group: 'Security', roles: CEO_ADMIN, render: mountBackups }
        ]
    });
})();
</script>
</body>
</html>
