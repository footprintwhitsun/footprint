<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" data-media-swap>
    <script src="auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" data-media-swap>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKWESIWA CO LTD | Transaction History</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" data-media-swap>
    <style>
        :root {
            --primary-color: #273990; --accent-color: #f9a51a;
            --secondary-color: #1c2b70;
            --gray-light: #f6f6f7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        header {
            background: #1F3A60;
            padding: 0 25px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .brand { font-size: 24px; font-weight: 700; letter-spacing: 1px; font-family: 'Montserrat', sans-serif; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; opacity: 0.9; }
        .back-btn:hover { opacity: 1; }

        /* Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            width: 90%;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 { color: var(--primary-color); margin-bottom: 20px; font-weight: 600; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; background: #f8f9fa; color: #666; font-weight: 600; font-size: 14px; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        tr:hover { background: #f9f9f9; }

        .badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: 500; text-transform: uppercase; }
        .badge-cash { background: #e8f5e9; color: #27ae60; }
        .badge-momo { background: #fff3e0; color: #f39c12; }
        .badge-card { background: #e3f2fd; color: #1565c0; }

        .btn-reprint {
            padding: 6px 12px; border: 1px solid var(--primary-color); color: var(--primary-color);
            background: white; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .btn-reprint:hover { background: var(--primary-color); color: white; }

        .empty-state { text-align: center; padding: 40px; color: #888; }

        /* Footer */
        footer {
            background: #1F3A60;
            padding: 8px 25px;
            display: flex;
            justify-content: center;
            font-size: 12px;
            color: white;
            margin-top: auto;
        }

        /* Pagination */
        .pagination-controls { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .btn-page { padding: 8px 16px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-page:hover:not(:disabled) { background: #f5f5f5; border-color: #ccc; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info { font-size: 14px; color: #666; }
        .limit-select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 14px; cursor: pointer; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header { padding: 0 15px; height: 60px; }
            .brand { font-size: 14px; gap: 8px; white-space: nowrap; }
            .brand img {
            width: auto;
            max-width: 140px;
            height: 36px;
            aspect-ratio: auto;
            border-radius: 6px;
            object-fit: contain;
            background: #ffffff;
            padding: 3px 10px;
            border: 1.5px solid rgba(249, 165, 26, 0.7);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }
            .back-btn { font-size: 0; }
            .back-btn i { font-size: 18px; }

            .container { margin: 20px auto; padding: 20px; }
            .pagination-controls { flex-direction: column; align-items: stretch; gap: 10px; }
            .pagination-controls > div { justify-content: space-between; }
            .page-info { text-align: center; }

            .transactions-table thead { display: none; }
            .transactions-table tbody tr {
                display: block;
                border: 1px solid #e2e8f0;
                border-radius: 10px;
                margin-bottom: 12px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.05);
                background: white;
            }
            .transactions-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 9px 14px;
                border-bottom: 1px solid #f1f5f9;
                font-size: 13px;
                text-align: right;
            }
            .transactions-table td:last-child { border-bottom: none; }
            .transactions-table td::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 11px;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                flex-shrink: 0;
                min-width: 100px;
                margin-right: 10px;
                text-align: left;
            }
        }
    </style>
    <script src="currency.js"></script>
    <script src="telemetry-guard.js"></script>
    <script src="instant-nav.js"></script>
    <link rel="stylesheet" href="sidebar.css">
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <link rel="stylesheet" href="/portal-skin.css">
    <style>
        header.okw-sub-header {
            height: 62px;
            background: #ffffff !important;
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg, #273990 0%, #273990 72%, #F9A51A 100%) 1;
            border-bottom: 1px solid #e1e5eb !important;
            color: #273990 !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px !important;
            position: relative;
            z-index: 50;
            box-shadow: 0 1px 3px rgba(17, 24, 39, 0.04) !important;
            flex-shrink: 0;
        }
        .okw-sub-header .hdr-left { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .okw-sub-header .hdr-brand { font-size: 14.5px; font-weight: 800; color: #273990; letter-spacing: 0.05em; text-transform: uppercase; }
        .okw-sub-header .hdr-sep { width: 1px; height: 18px; background: #e1e5eb; }
        .okw-sub-header .hdr-badge { background: rgba(39, 57, 144, 0.08); color: #273990; border: 1px solid rgba(39, 57, 144, 0.16); border-left: 3px solid #F9A51A; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 6px; }
        .okw-sub-header .hdr-right { display: flex; align-items: center; gap: 10px; }
        .okw-sub-header .hdr-user { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; background: #f8fafc; border: 1px solid #e1e5eb; font-size: 13px; font-weight: 600; color: #111827; }
        .okw-sub-header .hdr-avatar { width: 26px; height: 26px; border-radius: 50%; background: #273990; color: #ffffff; border: 1.5px solid #F9A51A; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
        .okw-sub-header .hdr-back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; background: #273990; color: #ffffff !important; text-decoration: none; font-size: 12.5px; font-weight: 600; transition: background-color 0.15s ease; }
        .okw-sub-header .hdr-back:hover { background: #1C2B70; }
        footer.okw-sub-footer { display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important; width: 100% !important; max-width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; box-sizing: border-box !important; background: #273990 !important; color: #ffffff !important; border-top: 2px solid #F9A51A !important; padding: 12px 24px; font-size: 12.5px; font-weight: 500; margin-top: auto; }
        @media (max-width: 768px) { header.okw-sub-header { padding: 0 14px !important; } .okw-sub-header .hdr-brand, .okw-sub-header .hdr-sep { display: none; } }
        .main-content { margin-left: var(--sidebar-width); flex: 1; min-width: 0; padding: 24px 28px; box-sizing: border-box; }
        .container { margin: 0 auto; }
        @media (max-width: 992px) { .main-content { margin-left: 0; padding: 16px; } }
    </style>
    <script src="/okw-events.js"></script>
</head>
<body>

    <button class="mobile-menu-btn" data-onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" data-onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand">
            <img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD">
        </div>
        <div class="nav-links"></div>
    </div>

    <div class="main-content">
    <div class="container">
        <h2>Transaction History</h2>
        <div id="shiftInfo" style="margin-bottom: 20px; padding: 10px; background: #f0f8ff; border-radius: 5px; display: none;">
            <strong>Current Shift:</strong> <span id="shiftStatus"></span>
        </div>
        <table class="transactions-table">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Receipt #</th>
                    <th>Payment Method</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="historyTable">
                <tr><td colspan="5" class="empty-state">Loading transactions...</td></tr>
            </tbody>
        </table>

        <!-- Pagination Controls -->
        <div class="pagination-controls">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 14px; color: #666;">Rows per page:</span>
                <select id="rowsPerPage" aria-label="Rows per page" class="limit-select" data-onchange="changeRowsPerPage()">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="100">100</option>
                </select>
            </div>
            <span id="pageInfo" class="page-info">Page 1 of 1</span>
            <button class="btn-page" id="btnPrev" aria-label="Previous page" data-onclick="changePage(-1)" disabled><i class="fas fa-chevron-left"></i></button>
            <button class="btn-page" id="btnNext" aria-label="Next page" data-onclick="changePage(1)" disabled><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <footer class="okw-sub-footer">
        <div>&copy; 2026 OKWESIWA CO LTD</div>
    </footer>
    </div>

    <script>
        let allTransactions = [];
        let currentPage = 1;
        let rowsPerPage = 10;
        let currentShift = null;

        async function loadShiftInfo() {
            try {
                const token = localStorage.getItem('authToken');
                const res = await fetch('/api/shifts/active', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    if (data.active && data.shift) {
                        currentShift = data.shift;
                        const shiftInfo = document.getElementById('shiftInfo');
                        const shiftStatus = document.getElementById('shiftStatus');
                        
                        const rawStart = data.shift.start_time || data.shift.opened_at;
                        const startTime = rawStart && !isNaN(new Date(rawStart)) ? new Date(rawStart).toLocaleString() : 'earlier today';
                        shiftStatus.textContent = `Started at ${startTime}`;
                        shiftInfo.style.display = 'block';
                    }
                }
            } catch (err) {
                console.error('Error loading shift info:', err);
            }
        }

        async function loadHistory() {
            try {
                const token = localStorage.getItem('authToken');
                const res = await fetch('/transactions/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    (window.top || window).location.href = '/login';
                    return;
                }
                
                if (!res.ok) throw new Error("Failed to fetch history");

                allTransactions = await res.json();
                
                // Update empty state message if no active shift
                if (!currentShift && allTransactions.length === 0) {
                    document.getElementById('historyTable').innerHTML = 
                        '<tr><td colspan="5" class="empty-state">No active shift. Start a new shift to begin recording transactions.</td></tr>';
                } else if (currentShift && allTransactions.length === 0) {
                    document.getElementById('historyTable').innerHTML = 
                        '<tr><td colspan="5" class="empty-state">No transactions in current shift yet.</td></tr>';
                } else {
                    renderTable();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('historyTable').innerHTML = '<tr><td colspan="5" class="empty-state">Error loading history.</td></tr>';
            }
        }

        function renderTable() {
            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';

            if (!Array.isArray(allTransactions) || allTransactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No transactions found.</td></tr>';
                updatePaginationInfo();
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = allTransactions.slice(start, end);

            paginatedItems.forEach(trx => {
                const date = new Date(trx.created_at).toLocaleString();
                let badgeClass = 'badge-cash';
                if (trx.payment_method === 'momo') badgeClass = 'badge-momo';
                if (trx.payment_method === 'card') badgeClass = 'badge-card';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="Date & Time">${date}</td>
                    <td data-label="Receipt #">${OkwUI.escapeHtml(trx.receipt_number)}</td>
                    <td data-label="Payment Method"><span class="badge ${badgeClass}">${trx.payment_method}</span></td>
                    <td data-label="Amount" style="font-weight:bold;">${formatCurrency(trx.total_amount)}</td>
                    <td data-label="Action"></td>
                `;
                
                const btn = document.createElement('button');
                btn.className = 'btn-reprint';
                btn.innerHTML = '<i class="fas fa-print"></i> Reprint';
                btn.onclick = () => reprint(trx);
                
                tr.lastElementChild.appendChild(btn);
                tbody.appendChild(tr);
            });
            
            updatePaginationInfo();
        }

        function updatePaginationInfo() {
            const totalItems = allTransactions.length;
            const totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
            
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${totalItems} items)`;
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = currentPage === totalPages || totalPages === 0;
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        function changeRowsPerPage() {
            rowsPerPage = parseInt(document.getElementById('rowsPerPage').value);
            currentPage = 1;
            renderTable();
        }

        function reprint(trx) {
            const receiptUrl = `receipt?id=${trx.receipt_number || trx.id}`;
            // inside a hub frame, open the receipt in its own tab so the frame keeps the list
            if (window.self !== window.top) window.open(receiptUrl, '_blank'); else window.location.href = receiptUrl;
        }

        // Load shift info first, then transaction history
        loadShiftInfo().then(() => {
            loadHistory();
        });

        (function initUnifiedHeader() {
            function applyHeaderUser(u) {
                if (!u) return;
                const rawName = String(u.name || u.username || 'User').replace(/^OKWESIWA\s+(LTD\s+)?(Store\s+)?/i, '').trim();
                const firstName = (rawName || u.username || 'User').split(/[\s_@]+/)[0];
                const el = document.getElementById('userName');
                if (el) el.textContent = firstName;
            }
            try {
                const cached = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('companyUser') || localStorage.getItem('user') || 'null');
                if (cached) applyHeaderUser(cached);
            } catch (_) {}
            (async function () {
                try {
                    const token = localStorage.getItem('authToken');
                    if (!token) return;
                    const r = await fetch('/api/session', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (r.ok) { const d = await r.json(); if (d && d.user) applyHeaderUser(d.user); }
                } catch (_) {}
            })();
        })();
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // 2. Mobile Table Auto-Labeler
    function applyTableDataLabels() {
        document.querySelectorAll('.card-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
            if (headers.length === 0) return;
            table.querySelectorAll('tbody tr').forEach(tr => {
                tr.querySelectorAll('td').forEach((td, index) => {
                    if (headers[index] && !td.hasAttribute('data-label')) {
                        td.setAttribute('data-label', headers[index]);
                    }
                });
            });
        });
    }
    /* Optimized: Global MutationObserver removed to prevent DOM thrashing */
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTableDataLabels);
    } else {
        applyTableDataLabels();
    }
})();
</script>
<!-- ====================================================== -->
</body>
</html>
