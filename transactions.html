<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - OKWESIWA CO LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" data-media-swap>
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/auth-guard.js"></script>
    <script src="/currency.js"></script>
    <script src="/telemetry-guard.js"></script>
    <script src="/instant-nav.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <link rel="stylesheet" href="/portal-skin.css">
    <style>
        .tx-kpis {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .tx-kpi {
            background: var(--sheet, #fff);
            border: 1px solid var(--edge, #e2e8f0);
            border-radius: 12px;
            padding: 16px 18px;
        }
        .tx-kpi-lbl {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted, #64748b);
        }
        .tx-kpi-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--ink, #0f172a);
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }
        .tx-kpi-sub {
            font-size: 12px;
            color: var(--muted, #64748b);
            margin-top: 3px;
        }
        .tx-shift-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            margin-bottom: 14px;
        }
        .tx-shift-pill.none {
            background: #f8fafc;
            color: #64748b;
            border-color: #e2e8f0;
        }
        .tx-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }
        .tx-search {
            flex: 1;
            min-width: 220px;
            height: 40px;
            padding: 0 14px;
            border: 1px solid var(--edge-strong, #cbd5e1);
            border-radius: 9px;
            background: var(--sheet, #fff);
            color: var(--ink, #0f172a);
            font-size: 13.5px;
            outline: none;
            box-sizing: border-box;
        }
        .tx-search:focus, .tx-select:focus {
            border-color: var(--brand, #273990);
            box-shadow: 0 0 0 3px rgba(39, 57, 144, 0.12);
        }
        .tx-select {
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--edge-strong, #cbd5e1);
            border-radius: 9px;
            background: var(--sheet, #fff);
            color: var(--ink, #0f172a);
            font-size: 13px;
            outline: none;
        }
        .tx-card {
            background: var(--sheet, #fff);
            border: 1px solid var(--edge, #e2e8f0);
            border-radius: 12px;
            overflow: hidden;
        }
        .tx-table-wrap { overflow-x: auto; }
        .tx-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        .tx-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted, #64748b);
            background: var(--frame, #f8fafc);
            border-bottom: 1px solid var(--edge, #e2e8f0);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .tx-table th.num, .tx-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .tx-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--edge, #f1f5f9);
            color: var(--ink, #0f172a);
            vertical-align: middle;
        }
        .tx-table tbody tr:hover { background: var(--frame, #f8fafc); }
        .tx-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .tx-badge-cash { background: #dcfce7; color: #15803d; }
        .tx-badge-momo { background: #fef3c7; color: #b45309; }
        .tx-badge-card { background: #dbeafe; color: #1d4ed8; }
        .tx-badge-other { background: #f1f5f9; color: #475569; }
        .tx-pager {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--edge, #e2e8f0);
            font-size: 13px;
            color: var(--muted, #64748b);
        }
        @media (max-width: 900px) { .tx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 560px) { .tx-kpis { grid-template-columns: 1fr; } }
    </style>
    <script src="/okw-events.js"></script>
</head>
<body>
    <button class="mobile-menu-btn" data-onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" data-onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD"></div>
        <div class="nav-links"></div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-info">
                    <div id="userName"></div>
                    <div id="userRole"></div>
                </div>
            </div>
            <button class="sidebar-logout-btn" data-onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <main class="main-content">
        <div class="okw-page-header">
            <div class="okw-page-header-text">
                <h1 class="okw-page-title">Transactions</h1>
                <p class="okw-page-subtitle">Review your shift receipts, filter by payment method, and reprint customer receipts.</p>
            </div>
            <div class="okw-page-header-actions">
                <button type="button" id="btnRefreshTx" class="okw-btn okw-btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button>
                <a href="/pos" class="okw-btn okw-btn-primary" style="text-decoration:none;"><i class="fas fa-cash-register"></i> Open POS</a>
            </div>
        </div>

        <div id="shiftPill" class="tx-shift-pill none" style="display:none;">
            <i class="fas fa-clock"></i>
            <span id="shiftStatusText">Checking shift...</span>
        </div>

        <section class="tx-kpis">
            <div class="tx-kpi">
                <div class="tx-kpi-lbl">Receipts</div>
                <div id="kpiCount" class="tx-kpi-val"><span class="okw-sk-bar" style="width:48px;height:22px;"></span></div>
                <div class="tx-kpi-sub">In current view</div>
            </div>
            <div class="tx-kpi">
                <div class="tx-kpi-lbl">Total Sales</div>
                <div id="kpiTotal" class="tx-kpi-val" style="color:var(--brand,#273990);"><span class="okw-sk-bar" style="width:110px;height:22px;"></span></div>
                <div class="tx-kpi-sub">Gross shift receipts</div>
            </div>
            <div class="tx-kpi">
                <div class="tx-kpi-lbl">Cash Sales</div>
                <div id="kpiCash" class="tx-kpi-val" style="color:#15803d;"><span class="okw-sk-bar" style="width:100px;height:22px;"></span></div>
                <div class="tx-kpi-sub">Cash drawer intake</div>
            </div>
            <div class="tx-kpi">
                <div class="tx-kpi-lbl">MoMo &amp; Card</div>
                <div id="kpiDigital" class="tx-kpi-val"><span class="okw-sk-bar" style="width:100px;height:22px;"></span></div>
                <div class="tx-kpi-sub">Electronic payments</div>
            </div>
        </section>

        <div class="tx-toolbar">
            <input type="search" id="txSearch" class="tx-search" placeholder="Search by receipt number or payment method...">
            <select id="txMethodFilter" class="tx-select" aria-label="Filter by payment method">
                <option value="">All Payment Methods</option>
                <option value="cash">Cash</option>
                <option value="momo">Mobile Money (MoMo)</option>
                <option value="card">Card</option>
                <option value="credit">Credit</option>
            </select>
        </div>

        <div class="tx-card">
            <div class="tx-table-wrap">
                <table class="tx-table" id="txTable" data-no-table-tools="1">
                    <thead>
                        <tr>
                            <th data-tx-sort="created_at">Date &amp; Time <span class="tx-sort-ind"></span></th>
                            <th data-tx-sort="receipt_number">Receipt # <span class="tx-sort-ind"></span></th>
                            <th data-tx-sort="payment_method">Payment Method <span class="tx-sort-ind"></span></th>
                            <th class="num" data-tx-sort="total_amount">Amount <span class="tx-sort-ind"></span></th>
                            <th style="text-align:right;cursor:default;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:130px;"></span></td><td><span class="okw-sk-bar" style="width:96px;"></span></td><td><span class="okw-sk-bar" style="width:68px;"></span></td><td class="num"><span class="okw-sk-bar" style="width:82px;"></span></td><td style="text-align:right;"><span class="okw-sk-bar" style="width:74px;"></span></td></tr>
                        <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:124px;"></span></td><td><span class="okw-sk-bar" style="width:88px;"></span></td><td><span class="okw-sk-bar" style="width:64px;"></span></td><td class="num"><span class="okw-sk-bar" style="width:76px;"></span></td><td style="text-align:right;"><span class="okw-sk-bar" style="width:74px;"></span></td></tr>
                        <tr class="okw-sk-tr" aria-hidden="true"><td><span class="okw-sk-bar" style="width:136px;"></span></td><td><span class="okw-sk-bar" style="width:92px;"></span></td><td><span class="okw-sk-bar" style="width:68px;"></span></td><td class="num"><span class="okw-sk-bar" style="width:86px;"></span></td><td style="text-align:right;"><span class="okw-sk-bar" style="width:74px;"></span></td></tr>
                    </tbody>
                </table>
            </div>
            <div id="txPager" class="tx-pager"></div>
        </div>
    </main>

    <script>
    (function () {
        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = (n) => (typeof formatCurrency === 'function' ? formatCurrency(Number(n) || 0) : 'GH₵ ' + (Number(n) || 0).toFixed(2));
        function authHeaders() {
            const t = localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
            return (t && t !== 'null' && t !== 'undefined') ? { Authorization: `Bearer ${t}` } : {};
        }

        let allTransactions = [];
        let currentShift = null;
        let currentPage = 1;
        let rowsPerPage = 25;
        let sortKey = 'created_at';
        let sortDir = -1;

        async function loadShiftInfo() {
            const pill = document.getElementById('shiftPill');
            const text = document.getElementById('shiftStatusText');
            try {
                const res = await fetch('/api/shifts/active', { headers: authHeaders(), credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.active && data.shift) {
                        currentShift = data.shift;
                        const rawStart = data.shift.start_time || data.shift.opened_at;
                        const startTime = rawStart && !isNaN(new Date(rawStart)) ? new Date(rawStart).toLocaleString() : 'earlier today';
                        text.textContent = `Active Shift · Started ${startTime}`;
                        pill.className = 'tx-shift-pill';
                        pill.style.display = 'inline-flex';
                        return;
                    }
                }
                currentShift = null;
                text.textContent = 'No active shift open';
                pill.className = 'tx-shift-pill none';
                pill.style.display = 'inline-flex';
            } catch (_) {}
        }

        function getFiltered() {
            const q = (document.getElementById('txSearch').value || '').trim().toLowerCase();
            const method = (document.getElementById('txMethodFilter').value || '').toLowerCase();
            const list = allTransactions.filter((t) => {
                if (method && String(t.payment_method || '').toLowerCase() !== method) return false;
                if (q) {
                    const hay = `${t.receipt_number || ''} ${t.payment_method || ''} ${t.customer_name || ''}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
            list.sort((a, b) => {
                if (sortKey === 'total_amount') return ((Number(a.total_amount) || 0) - (Number(b.total_amount) || 0)) * sortDir;
                if (sortKey === 'created_at') return (new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime()) * sortDir;
                return String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), undefined, { numeric: true, sensitivity: 'base' }) * sortDir;
            });
            return list;
        }

        function renderTable() {
            const list = getFiltered();
            const tbody = document.getElementById('historyTable');
            const pager = document.getElementById('txPager');

            document.querySelectorAll('#txTable thead th[data-tx-sort]').forEach((th) => {
                const k = th.getAttribute('data-tx-sort');
                const ind = th.querySelector('.tx-sort-ind');
                if (ind) ind.textContent = sortKey === k ? (sortDir === 1 ? '▲' : '▼') : '';
            });

            let totalAmt = 0, cashAmt = 0, digitalAmt = 0;
            list.forEach((t) => {
                const amt = Number(t.total_amount || 0);
                const pm = String(t.payment_method || '').toLowerCase();
                totalAmt += amt;
                if (pm === 'cash') cashAmt += amt;
                else if (pm === 'momo' || pm === 'card') digitalAmt += amt;
            });
            document.getElementById('kpiCount').textContent = String(list.length);
            document.getElementById('kpiTotal').textContent = money(totalAmt);
            document.getElementById('kpiCash').textContent = money(cashAmt);
            document.getElementById('kpiDigital').textContent = money(digitalAmt);

            if (!list.length) {
                const msg = !allTransactions.length
                    ? (currentShift ? 'No transactions recorded in the current shift yet.' : 'No active shift. Open a shift to begin recording transactions.')
                    : 'No transactions match your search or filter.';
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted,#64748b);">${esc(msg)}</td></tr>`;
                pager.innerHTML = '<span>Showing 0 of 0</span>';
                return;
            }

            const effSize = rowsPerPage === 'all' ? list.length : Number(rowsPerPage || 25);
            const totalPages = Math.max(1, Math.ceil(list.length / effSize));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * effSize;
            const slice = list.slice(start, start + effSize);

            tbody.innerHTML = slice.map((trx) => {
                const dateStr = trx.created_at ? new Date(trx.created_at).toLocaleString() : '—';
                const pm = String(trx.payment_method || 'cash').toLowerCase();
                const badgeCls = pm === 'cash' ? 'tx-badge-cash' : (pm === 'momo' ? 'tx-badge-momo' : (pm === 'card' ? 'tx-badge-card' : 'tx-badge-other'));
                const ref = trx.receipt_number || trx.id;
                return `
                    <tr>
                        <td style="white-space:nowrap;">${esc(dateStr)}</td>
                        <td style="font-family:ui-monospace,monospace;font-weight:600;">${esc(ref)}</td>
                        <td><span class="tx-badge ${badgeCls}">${esc(pm)}</span></td>
                        <td class="num" style="font-weight:700;">${esc(money(trx.total_amount))}</td>
                        <td style="text-align:right;">
                            <button type="button" class="okw-btn okw-btn-outline" data-reprint="${esc(ref)}" style="height:30px;padding:0 12px;font-size:12px;"><i class="fas fa-print"></i> Reprint</button>
                        </td>
                    </tr>`;
            }).join('');

            const fromN = start + 1;
            const toN = start + slice.length;
            pager.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span>Showing ${fromN}–${toN} of ${list.length}</span>
                    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;">
                        Rows:
                        <select id="txPageSize" class="tx-select" style="height:30px;padding:0 8px;font-size:12.5px;">
                            <option value="25"${String(rowsPerPage) === '25' ? ' selected' : ''}>25</option>
                            <option value="50"${String(rowsPerPage) === '50' ? ' selected' : ''}>50</option>
                            <option value="100"${String(rowsPerPage) === '100' ? ' selected' : ''}>100</option>
                            <option value="all"${String(rowsPerPage) === 'all' ? ' selected' : ''}>All</option>
                        </select>
                    </label>
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <button type="button" id="txPrev" class="okw-btn okw-btn-outline" style="height:32px;padding:0 12px;font-size:12.5px;" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>
                    <span style="font-size:12.5px;font-weight:600;color:var(--ink,#0f172a);">Page ${currentPage} / ${totalPages}</span>
                    <button type="button" id="txNext" class="okw-btn okw-btn-outline" style="height:32px;padding:0 12px;font-size:12.5px;" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
                </div>`;
            pager.querySelector('#txPrev').onclick = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
            pager.querySelector('#txNext').onclick = () => { if (currentPage < totalPages) { currentPage++; renderTable(); } };
            pager.querySelector('#txPageSize').onchange = (e) => {
                rowsPerPage = e.target.value === 'all' ? 'all' : Number(e.target.value);
                currentPage = 1;
                renderTable();
            };
        }

        async function loadHistory() {
            try {
                const res = await fetch('/transactions/me', { headers: authHeaders(), credentials: 'include' });
                if (res.status === 401) {
                    (window.top || window).location.href = '/login';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load transactions');
                const data = await res.json();
                allTransactions = Array.isArray(data) ? data : [];
                renderTable();
            } catch (err) {
                document.getElementById('historyTable').innerHTML = `<tr><td colspan="5" style="text-align:center;padding:28px;color:#dc2626;">Could not load transactions.</td></tr>`;
            }
        }

        document.getElementById('historyTable').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-reprint]');
            if (!btn) return;
            const ref = btn.getAttribute('data-reprint');
            const receiptUrl = `/receipt?id=${encodeURIComponent(ref)}`;
            if (window.self !== window.top) window.open(receiptUrl, '_blank');
            else window.location.href = receiptUrl;
        });

        document.querySelectorAll('#txTable thead th[data-tx-sort]').forEach((th) => {
            th.addEventListener('click', () => {
                const k = th.getAttribute('data-tx-sort');
                if (sortKey === k) sortDir *= -1;
                else { sortKey = k; sortDir = 1; }
                currentPage = 1;
                renderTable();
            });
        });

        document.getElementById('txSearch').addEventListener('input', () => { currentPage = 1; renderTable(); });
        document.getElementById('txMethodFilter').addEventListener('change', () => { currentPage = 1; renderTable(); });
        document.getElementById('btnRefreshTx').addEventListener('click', () => loadShiftInfo().then(loadHistory));

        loadShiftInfo().then(loadHistory);
    })();
    </script>
</body>
</html>
