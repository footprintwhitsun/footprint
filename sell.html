<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell - OKWESIWA CO LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/lazy-libs.js"></script>
    <script data-lazy-src="/vendor/xlsx-0.20.2.full.min.js"></script>
    <script src="/auth-guard.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { flex: 1; padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }

        /* Clean Add Sale Form */
        .as-form, .as-form *, .as-form *::before, .as-form *::after { box-sizing: border-box; }
        .as-form { display: flex; flex-direction: column; gap: 18px; max-width: 1200px; }
        .as-card { background: var(--sheet, #ffffff); border: 1px solid var(--edge, #e2e8f0); border-radius: 14px; padding: 20px 22px; }
        .as-title { font-size: 14px; font-weight: 700; color: var(--ink, #0f172a); margin: 0 0 14px 0; padding-bottom: 10px; border-bottom: 1px solid var(--edge, #e2e8f0); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .as-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
        .as-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        .as-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .as-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .as-field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2, #334155); }
        .as-req { color: #dc2626; }
        .as-input, .as-select, .as-textarea { width: 100%; min-width: 0; height: 38px; padding: 0 12px; border: 1px solid var(--edge-strong, #cbd5e1); border-radius: 8px; background: var(--sheet, #ffffff); color: var(--ink, #0f172a); font-family: inherit; font-size: 13.5px; outline: none; }
        .as-textarea { height: auto; min-height: 70px; padding: 10px 12px; resize: vertical; }
        .as-input:focus, .as-select:focus, .as-textarea:focus { border-color: var(--brand, #273990); box-shadow: 0 0 0 3px rgba(39,57,144,0.12); }
        .as-readonly { min-height: 38px; padding: 8px 12px; border: 1px dashed var(--edge-strong, #cbd5e1); border-radius: 8px; background: var(--frame, #f8fafc); color: var(--ink-2, #334155); font-size: 13px; line-height: 1.4; }
        .as-help { font-size: 11.5px; color: var(--muted, #64748b); line-height: 1.4; }
        .as-pill { display: inline-flex; align-items: center; justify-content: space-between; width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; background: var(--frame, #f8fafc); border: 1px solid var(--edge, #e2e8f0); font-size: 13px; font-weight: 600; color: var(--ink-2, #334155); font-variant-numeric: tabular-nums; }
        .as-search-wrap { position: relative; margin-bottom: 14px; }
        .as-search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 260px; overflow-y: auto; background: var(--sheet, #ffffff); border: 1px solid var(--edge-strong, #cbd5e1); border-radius: 10px; box-shadow: 0 12px 28px rgba(15,23,42,0.14); z-index: 60; display: none; }
        .as-search-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--edge, #f1f5f9); cursor: pointer; font-size: 13px; }
        .as-search-item:hover { background: var(--frame-hover, #f8fafc); }
        .as-table { width: 100%; border-collapse: collapse; min-width: 680px; }
        .as-table th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted, #64748b); padding: 10px 10px; border-bottom: 1px solid var(--edge, #e2e8f0); background: var(--frame, #f8fafc); }
        .as-table td { padding: 9px 10px; border-bottom: 1px solid var(--edge, #f1f5f9); font-size: 13px; vertical-align: middle; }
        .as-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .as-cell-in { width: 100%; min-width: 72px; height: 32px; padding: 0 8px; border: 1px solid var(--edge-strong, #cbd5e1); border-radius: 6px; background: var(--sheet, #ffffff); color: var(--ink, #0f172a); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
        .as-strip { display: flex; justify-content: flex-end; gap: 28px; flex-wrap: wrap; padding: 12px 14px; margin-top: 12px; background: var(--frame, #f8fafc); border: 1px solid var(--edge, #e2e8f0); border-radius: 10px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
        .as-payable { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; margin-top: 16px; border-radius: 12px; background: var(--frame, #f8fafc); border: 1px solid var(--edge-strong, #cbd5e1); }
        .as-payable .val { font-size: 20px; font-weight: 800; color: var(--brand, #273990); font-variant-numeric: tabular-nums; }
        .as-pay-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 12px 16px; margin-top: 14px; border-radius: 10px; background: var(--frame, #f8fafc); border: 1px solid var(--edge, #e2e8f0); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .as-footer { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
        @media (max-width: 1040px) { .as-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 760px) { .as-grid-4, .as-grid-3, .as-grid-2 { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap">
            <div class="okw-kpi-row" id="sell-kpis" style="display:none;"></div>
            <div class="okw-action-bar">
                <div id="sell-filter-host"></div>
                <button type="button" class="okw-btn okw-btn-primary" id="sell-quick-add" style="display:none;">+ Add</button>
                <a href="/pos" class="okw-btn okw-btn-accent">Open POS Till</a>
            </div>
            <div id="sell-panel">Loading...</div>
        </div>
        <footer style="text-align:center;padding:16px 24px;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border);">© 2026 OKWESIWA CO LTD</footer>
    </main>
</div>

<script>
(function () {
    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json' };
    if (token && token !== 'null' && token !== 'undefined') headers.Authorization = `Bearer ${token}`;
    const fmt = (n) => 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const urlTab = new URLSearchParams(window.location.search).get('tab');
    const valid = ['all', 'add', 'list_pos', 'add_draft', 'drafts', 'add_quotation', 'quotations', 'returns', 'shipments', 'discounts', 'import'];
    let activeView = valid.includes(urlTab) ? urlTab : 'all';
    let dateRange = { from: new Date().toISOString().slice(0, 8) + '01', to: new Date().toISOString().slice(0, 10) };

    const filterHost = document.getElementById('sell-filter-host');
    const kpiHost = document.getElementById('sell-kpis');
    const quickAddBtn = document.getElementById('sell-quick-add');
    function syncQuickAddButton() {
        if (!quickAddBtn) return;
        const map = {
            all: ['+ Add Sale', 'add'],
            list_pos: ['+ Add Sale', 'add'],
            drafts: ['+ Add Draft', 'add_draft'],
            quotations: ['+ Add Quotation', 'add_quotation']
        };
        const cfg = map[activeView];
        if (!cfg) { quickAddBtn.style.display = 'none'; return; }
        quickAddBtn.style.display = '';
        quickAddBtn.textContent = cfg[0];
        quickAddBtn.onclick = () => {
            activeView = cfg[1];
            window.history.replaceState(null, '', '/sell?tab=' + activeView);
            render();
        };
    }
    filterHost.innerHTML = OkwUI.filterDropdown({
        label: 'Filters',
        contentHtml: `
            <div class="okw-filter-field">
                <label>Date Range</label>
                <div id="sell-date-picker"></div>
            </div>`
    });
    const dateHost = filterHost;

    OkwUI.dateRangePicker('#sell-date-picker', (r) => {
        dateRange = r;
        if (['all', 'list_pos', 'returns'].includes(activeView)) render();
    });

    function inDateRange(iso) {
        const d = String(iso || '').slice(0, 10);
        return (!dateRange.from || d >= dateRange.from) && (!dateRange.to || d <= dateRange.to);
    }

    function closeSaleActionMenu() {
        const m = document.getElementById('sellFloatingActionMenu');
        if (m) m.remove();
    }

    function openSaleViewModal(row) {
        const items = Array.isArray(row._items) ? row._items : [];
        const subtotal = items.reduce((s, it) => s + Number(it.qty || it.quantity || 1) * Number(it.price || it.unit_price || 0), 0) || row.total;
        const metaRows = [];
        if (row.contact) metaRows.push(['Contact Number', row.contact]);
        if (row.method) metaRows.push(['Payment Method', row.method]);
        if (row.shipping_status && row.shipping_status !== '—') metaRows.push(['Shipping Status', row.shipping_status]);
        if (row.added_by) metaRows.push(['Added By', row.added_by]);
        if (row.sell_note && row.sell_note !== '—') metaRows.push(['Sell Note', row.sell_note]);
        if (row.staff_note && row.staff_note !== '—') metaRows.push(['Staff Note', row.staff_note]);
        if (row.shipping_details && row.shipping_details !== '—') metaRows.push(['Shipping Details', row.shipping_details]);

        OkwUI.openPrintableRecord({
            title: 'Sale Invoice',
            refNumber: row.invoice_no,
            date: row.date,
            partyLabel: 'Customer',
            partyName: row.customer,
            branch: row.location,
            status: row.payment_status,
            paymentStatus: row.payment_status,
            metaRows,
            items: items.map(it => ({
                name: it.name || it.product_name || it.barcode || 'Item',
                product_barcode: it.barcode || '',
                quantity: Number(it.qty || it.quantity || 1),
                unit_cost: Number(it.price || it.unit_price || 0)
            })),
            subtotal,
            discount: Number(row._discount || 0),
            netTotal: row.total,
            paidAmount: row.paid,
            balanceDue: row.sell_due,
            notes: row.sell_note !== '—' ? row.sell_note : ''
        });
    }

    function openSaleActionMenu(btn, row) {
        const existing = document.getElementById('sellFloatingActionMenu');
        const same = existing && existing.dataset.forId === String(row.id);
        closeSaleActionMenu();
        if (same) return;

        const menu = document.createElement('div');
        menu.id = 'sellFloatingActionMenu';
        menu.dataset.forId = String(row.id);
        menu.setAttribute('role', 'menu');
        menu.style.cssText = 'position:fixed;min-width:165px;background:#ffffff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 14px 32px rgba(15,23,42,0.18);z-index:9999;padding:5px;display:flex;flex-direction:column;gap:2px;';
        const itemStyle = 'width:100%;text-align:left;background:transparent;border:none;padding:8px 11px;border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;display:block;text-decoration:none;color:#0f172a;box-sizing:border-box;';
        menu.innerHTML = `
            <button type="button" role="menuitem" data-sa="view" style="${itemStyle}">View</button>
            <button type="button" role="menuitem" data-sa="print" style="${itemStyle}color:#334155;">Print Invoice</button>
            <a href="/receipt?id=${encodeURIComponent(row.id)}" target="_blank" role="menuitem" style="${itemStyle}color:#273990;">Open Receipt</a>
            <a href="/transactions" role="menuitem" style="${itemStyle}color:#b45309;">Sell Return</a>
        `;
        document.body.appendChild(menu);

        const rect = btn.getBoundingClientRect();
        const mRect = menu.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom;
        const top = spaceBelow < mRect.height + 12 ? Math.max(8, rect.top - mRect.height - 6) : (rect.bottom + 6);
        const left = Math.min(Math.max(8, rect.left), window.innerWidth - mRect.width - 8);
        menu.style.top = top + 'px';
        menu.style.left = left + 'px';

        menu.addEventListener('click', (ev) => {
            const actBtn = ev.target.closest('[data-sa]');
            if (!actBtn) {
                if (ev.target.closest('a')) closeSaleActionMenu();
                return;
            }
            ev.stopPropagation();
            closeSaleActionMenu();
            openSaleViewModal(row);
        });
    }

    if (!window.__okwSellMenuGlobalBound) {
        window.__okwSellMenuGlobalBound = true;
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#sellFloatingActionMenu, .sell-action-trigger')) closeSaleActionMenu();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSaleActionMenu(); });
        window.addEventListener('scroll', closeSaleActionMenu, true);
    }

    async function renderSalesTable(filterFn, title, filename) {
        syncQuickAddButton();
        dateHost.style.display = 'inline-block';
        const res = await fetch('/api/transactions', { headers, credentials: 'include' });
        const list = await res.json().catch(() => []);
        const rows = (Array.isArray(list) ? list : []).filter(t => inDateRange(t.created_at) && filterFn(t)).map(t => {
            const items = Array.isArray(t.items) ? t.items : (typeof t.items === 'string' ? (() => { try { return JSON.parse(t.items || '[]'); } catch (_) { return []; } })() : []);
            const dInfo = (t.delivery_info && typeof t.delivery_info === 'object') ? t.delivery_info : (typeof t.delivery_info === 'string' ? (() => { try { return JSON.parse(t.delivery_info || '{}'); } catch (_) { return {}; } })() : {});
            const total = Number(t.total_amount || 0);
            const paid = Number(t.paid_amount ?? (Number(t.balance_due || 0) > 0 ? Math.max(0, total - Number(t.balance_due || 0)) : total));
            const sellDue = Math.max(0, Number(t.balance_due ?? Math.max(0, total - paid)));
            const returnDue = t.is_return ? Math.abs(total) : (t.has_returns ? Math.max(0, Number(t.original_total || total) - Number(t.current_total ?? total)) : 0);
            const payStatus = sellDue <= 0.005 ? 'Paid' : (paid > 0 ? 'Partial' : 'Due');
            const totalItemsQty = items.reduce((s, it) => s + Number(it.qty || it.quantity || 1), 0);
            return {
                id: t.id,
                _items: items,
                _discount: Number(t.discount_amount || 0),
                date: t.created_at ? new Date(t.created_at).toLocaleString() : '—',
                invoice_no: dInfo.invoice_no || t.receipt_number || (`#${t.id}`),
                customer: t.customer_name || 'Walk-In Customer',
                contact: t.customer_phone || dInfo.customer_phone || '—',
                location: t.store_location || 'Main Shop',
                payment_status: payStatus,
                method: t.payment_method || 'Cash',
                total,
                paid,
                sell_due: sellDue,
                return_due: returnDue,
                shipping_status: dInfo.shipping_status || '—',
                total_items: Number(totalItemsQty.toFixed(2)),
                added_by: t.added_by_name || (t.cashier_name ? String(t.cashier_name).split(' (@')[0] : 'Staff'),
                sell_note: dInfo.sell_note || '—',
                staff_note: dInfo.payment_note || dInfo.staff_note || '—',
                shipping_details: [dInfo.shipping_details, dInfo.shipping_address, dInfo.delivered_to].filter(Boolean).join(' · ') || '—'
            };
        });
        if (kpiHost) {
            const totalAmt = rows.reduce((s, r) => s + r.total, 0);
            const paidAmt = rows.reduce((s, r) => s + r.paid, 0);
            const dueAmt = rows.reduce((s, r) => s + r.sell_due, 0);
            const retAmt = rows.reduce((s, r) => s + r.return_due, 0);
            kpiHost.style.display = '';
            kpiHost.innerHTML = [
                OkwUI.kpiCard({ label: 'Total Sales', value: fmt(totalAmt), subtext: `${rows.length} sales`, tone: 'primary' }),
                OkwUI.kpiCard({ label: 'Total Paid', value: fmt(paidAmt), tone: 'success' }),
                OkwUI.kpiCard({ label: 'Sell Due', value: fmt(dueAmt), tone: dueAmt > 0 ? 'warning' : 'info' }),
                OkwUI.kpiCard({ label: 'Sell Return Due', value: fmt(retAmt), tone: retAmt > 0 ? 'warning' : 'info' })
            ].join('');
        }
        document.getElementById('sell-panel').innerHTML = `<div id="sell-tbl"></div>`;
        OkwUI.dataTable('#sell-tbl', {
            columns: [
                {
                    key: 'id',
                    label: 'Action',
                    render: (id) => `<button type="button" class="sell-action-trigger" data-sale-menu-id="${id}" style="display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;border:1px solid #cbd5e1;background:#ffffff;color:#0f172a;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">Actions ▾</button>`
                },
                { key: 'date', label: 'Date' },
                { key: 'invoice_no', label: 'Invoice No.' },
                { key: 'customer', label: 'Customer name' },
                { key: 'contact', label: 'Contact Number' },
                { key: 'location', label: 'Location' },
                {
                    key: 'payment_status',
                    label: 'Payment Status',
                    render: (v) => OkwUI.badge(v, v === 'Paid' ? 'success' : (v === 'Partial' ? 'warning' : 'danger'))
                },
                { key: 'method', label: 'Payment Method' },
                { key: 'total', label: 'Total amount', numeric: true, render: fmt },
                { key: 'paid', label: 'Total paid', numeric: true, render: fmt },
                { key: 'sell_due', label: 'Sell Due', numeric: true, render: fmt },
                { key: 'return_due', label: 'Sell Return Due', numeric: true, render: fmt },
                { key: 'shipping_status', label: 'Shipping Status' },
                { key: 'total_items', label: 'Total Items', numeric: true },
                { key: 'added_by', label: 'Added By' },
                { key: 'sell_note', label: 'Sell note' },
                { key: 'staff_note', label: 'Staff note' },
                { key: 'shipping_details', label: 'Shipping Details' }
            ],
            rows,
            onRowClick: openSaleViewModal,
            exportFilename: filename,
            printTitle: title
        });

        const tblHost = document.getElementById('sell-tbl');
        if (tblHost) {
            tblHost.addEventListener('click', (e) => {
                const trigger = e.target.closest('.sell-action-trigger');
                if (!trigger) return;
                e.stopPropagation();
                const row = rows.find(r => String(r.id) === String(trigger.dataset.saleMenuId));
                if (row) openSaleActionMenu(trigger, row);
            });
        }
    }

    function renderItemBuilder(mode, existingDraft = null) {
        const actionBar = document.querySelector('.okw-action-bar');
        if (actionBar) actionBar.style.display = 'none';
        dateHost.style.display = 'none';
        if (kpiHost) kpiHost.style.display = 'none';

        const ALLOWED_DOC_EXT = /\.(pdf|csv|zip|doc|docx|jpeg|jpg|png)$/i;
        const MAX_DOC_BYTES = 5 * 1024 * 1024;
        const localNow = () => {
            const d = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        };

        const isEditDraft = !!(existingDraft && existingDraft.id);
        const existingItems = existingDraft
            ? (Array.isArray(existingDraft.items) ? existingDraft.items : (typeof existingDraft.items === 'string' ? JSON.parse(existingDraft.items || '[]') : []))
            : [];
        let staged = existingItems.map(it => ({
            barcode: it.barcode || '',
            name: it.name || it.barcode || 'Item',
            unit: it.unit || 'Pc(s)',
            stock: Number(it.stock || 0),
            qty: Number(it.qty || 1),
            price: Number(it.price || 0),
            discount: Number(it.discount || 0)
        }));
        let customersList = [];
        let productsList = [];
        let saleDoc = null;
        let shipDoc = null;
        let currentPayable = 0;

        const isDraftOrQuote = mode === 'add_draft' || mode === 'add_quotation';
        const defaultStatus = mode === 'add_draft' ? 'Draft' : (mode === 'add_quotation' ? 'Quotation' : 'Final');
        const heading = mode === 'add_draft' ? (isEditDraft ? `Edit Draft #${existingDraft.id}` : 'Add Draft') : (mode === 'add_quotation' ? 'Add Quotation' : 'Add Sale');
        const saveBtnText = mode === 'add_draft' ? (isEditDraft ? 'Update Draft' : 'Save Draft') : (mode === 'add_quotation' ? 'Save Quotation' : 'Save Sale');
        const backHref = mode === 'add_draft' ? '/sell?tab=drafts' : (mode === 'add_quotation' ? '/sell?tab=quotations' : '/sell?tab=all');
        const backLabel = mode === 'add_draft' ? 'List Drafts' : (mode === 'add_quotation' ? 'List Quotations' : 'All Sales');

        const panel = document.getElementById('sell-panel');
        panel.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                <h1 style="margin:0;font-size:22px;font-weight:700;color:var(--ink,#0f172a);">${heading}</h1>
                <div style="display:flex;gap:8px;">
                    <a href="${backHref}" class="okw-btn okw-btn-outline" style="text-decoration:none;">${backLabel}</a>
                    <a href="/pos" class="okw-btn okw-btn-accent" style="text-decoration:none;">Open POS</a>
                </div>
            </div>

            <form id="addSaleForm" class="as-form" novalidate>
                <!-- 1. SALE DETAILS -->
                <section class="as-card">
                    <h2 class="as-title">1. Sale Details</h2>
                    <div class="as-grid-4">
                        <div class="as-field">
                            <label for="asCustomer">Customer <span class="as-req">*</span></label>
                            <select id="asCustomer" class="as-select" required>
                                <option value="">Walk-In Customer</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label>Billing Address</label>
                            <div id="asBillAddr" class="as-readonly">Walk-In Customer</div>
                        </div>
                        <div class="as-field">
                            <label>Shipping Address</label>
                            <div id="asShipAddrPreview" class="as-readonly">Walk-In Customer</div>
                        </div>
                        <div class="as-field">
                            <label for="asPayTermNum">Pay term</label>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                                <input type="number" id="asPayTermNum" class="as-input" min="0" step="1" placeholder="e.g. 30">
                                <select id="asPayTermUnit" class="as-select">
                                    <option value="">Select</option>
                                    <option value="Days">Days</option>
                                    <option value="Months">Months</option>
                                </select>
                            </div>
                        </div>

                        <div class="as-field">
                            <label for="asSaleDate">Sale Date <span class="as-req">*</span></label>
                            <input type="datetime-local" id="asSaleDate" class="as-input" value="${localNow()}" required>

                        <div class="as-field" style="${isDraftOrQuote ? 'display:none;' : ''}">
                            <label for="asStatus">Status <span class="as-req">*</span></label>
                            <select id="asStatus" class="as-select" required>
                                <option value="Final"${defaultStatus === 'Final' ? ' selected' : ''}>Final</option>
                                <option value="Draft"${defaultStatus === 'Draft' ? ' selected' : ''}>Draft</option>
                                <option value="Quotation"${defaultStatus === 'Quotation' ? ' selected' : ''}>Quotation</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label for="asInvScheme">Invoice scheme</label>
                            <select id="asInvScheme" class="as-select">
                                <option value="Default">Default</option>
                                <option value="Custom">Custom</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label for="asInvNo">Invoice No.</label>
                            <input type="text" id="asInvNo" class="as-input" placeholder="Keep blank to auto generate">
                        </div>

                        <div class="as-field" style="grid-column:span 2;">
                            <label for="asDoc">Attach Document</label>
                            <input type="file" id="asDoc" class="as-input" style="padding:6px 10px;height:auto;" accept=".pdf,.csv,.zip,.doc,.docx,.jpeg,.jpg,.png">
                            <span class="as-help">Max File size: 5MB · Allowed File: .pdf, .csv, .zip, .doc, .docx, .jpeg, .jpg, .png</span>
                        </div>
                    </div>
                </section>

                <!-- 2. PRODUCTS -->
                <section class="as-card">
                    <h2 class="as-title">
                        <span>2. Products</span>
                        <button type="button" id="asDeleteAll" class="okw-btn okw-btn-outline" style="height:30px;padding:0 11px;font-size:12px;color:#b91c1c;border-color:#fecaca;" disabled>Delete All</button>
                    </h2>
                    <div class="as-search-wrap">
                        <input type="search" id="asProductSearch" class="as-input" placeholder="Search product by name, SKU, or barcode..." autocomplete="off">
                        <div id="asSearchResults" class="as-search-results"></div>
                    </div>
                    <div style="overflow-x:auto;border:1px solid var(--edge,#e2e8f0);border-radius:10px;">
                        <table class="as-table" data-no-table-tools="1">
                            <thead>
                                <tr>
                                    <th style="width:40px;">#</th>
                                    <th>Product</th>
                                    <th class="num" style="width:110px;">Quantity</th>
                                    <th class="num" style="width:130px;">Unit Price</th>
                                    <th class="num" style="width:120px;">Discount</th>
                                    <th class="num" style="width:130px;">Subtotal</th>
                                    <th style="width:48px;text-align:center;"></th>
                                </tr>
                            </thead>
                            <tbody id="asItemsBody">
                                <tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted,#64748b);">No products added yet. Search above to add items.</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="as-strip">
                        <div>Items: <strong id="asSumItems">0.00</strong></div>
                        <div>Total: <strong id="asSumTotal">GH₵ 0.00</strong></div>
                    </div>
                </section>

                <!-- 3. DISCOUNT, TAX, NOTES & SHIPPING -->
                <section class="as-card">
                    <h2 class="as-title">3. Discount, Tax &amp; Shipping</h2>
                    <div class="as-grid-3">
                        <div class="as-field">
                            <label for="asDiscType">Discount Type <span class="as-req">*</span></label>
                            <select id="asDiscType" class="as-select">
                                <option value="none">None</option>
                                <option value="fixed">Fixed</option>
                                <option value="percentage">Percentage (%)</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label for="asDiscAmt">Discount Amount <span class="as-req">*</span></label>
                            <input type="number" id="asDiscAmt" class="as-input" step="0.01" min="0" value="0">
                        </div>
                        <div class="as-field">
                            <label>Discount Amount: (-)</label>
                            <div class="as-pill"><span>Discount: (-)</span><span id="asDiscCalc">GH₵ 0.00</span></div>
                        </div>

                        <div class="as-field">
                            <label for="asOrderTax">Order Tax <span class="as-req">*</span></label>
                            <select id="asOrderTax" class="as-select">
                                <option value="" data-rate="0">None (0%)</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label>Order Tax: (+)</label>
                            <div class="as-pill"><span>Order Tax: (+)</span><span id="asTaxCalc">GH₵ 0.00</span></div>
                        </div>
                        <div class="as-field">
                            <label for="asShipCharges">Shipping Charges</label>
                            <input type="number" id="asShipCharges" class="as-input" step="0.01" min="0" value="0">
                        </div>
                    </div>

                    <div class="as-grid-2" style="margin-top:16px;">
                        <div class="as-field">
                            <label for="asSellNote">Sell note</label>
                            <textarea id="asSellNote" class="as-textarea" placeholder="Optional sale note..."></textarea>
                        </div>
                        <div class="as-field">
                            <label for="asShipDetails">Shipping Details</label>
                            <textarea id="asShipDetails" class="as-textarea" placeholder="Carrier, waybill, or instructions..."></textarea>
                        </div>
                    </div>

                    <div class="as-grid-4" style="margin-top:16px;">
                        <div class="as-field">
                            <label for="asShipAddress">Shipping Address</label>
                            <input type="text" id="asShipAddress" class="as-input" placeholder="Delivery address">
                        </div>
                        <div class="as-field">
                            <label for="asShipStatus">Shipping Status</label>
                            <select id="asShipStatus" class="as-select">
                                <option value="">Select</option>
                                <option value="Ordered">Ordered</option>
                                <option value="Packed">Packed</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="as-field">
                            <label for="asDeliveredTo">Delivered To</label>
                            <input type="text" id="asDeliveredTo" class="as-input" placeholder="Recipient name">
                        </div>
                        <div class="as-field">
                            <label for="asDeliveryPerson">Delivery Person</label>
                            <input type="text" id="asDeliveryPerson" class="as-input" placeholder="Driver / courier">
                        </div>
                    </div>

                    <div class="as-field" style="margin-top:16px;max-width:520px;">
                        <label for="asShipDoc">Shipping Documents</label>
                        <input type="file" id="asShipDoc" class="as-input" style="padding:6px 10px;height:auto;" accept=".pdf,.csv,.zip,.doc,.docx,.jpeg,.jpg,.png">
                        <span class="as-help">Max File size: 5MB · Allowed File: .pdf, .csv, .zip, .doc, .docx, .jpeg, .jpg, .png</span>
                    </div>

                    <div class="as-payable">
                        <span style="font-size:14px;font-weight:700;color:var(--ink,#0f172a);">Total Payable</span>
                        <span class="val" id="asTotalPayable">GH₵ 0.00</span>
                    </div>
                </section>

                <!-- 4. ADD PAYMENT -->
                <section class="as-card" id="asPaymentCard" style="${isDraftOrQuote ? 'display:none;' : ''}">
                    <h2 class="as-title">
                        <span>4. Add Payment</span>
                        <span style="font-size:12.5px;font-weight:600;color:var(--ink-2,#334155);">Advance Balance: <strong id="asAdvanceBal">GH₵ 0.00</strong></span>
                    </h2>
                    <div class="as-grid-3">
                        <div class="as-field">
                            <label for="asPayAmt">Amount <span class="as-req">*</span></label>
                            <div style="display:flex;gap:8px;">
                                <input type="number" id="asPayAmt" class="as-input" step="0.01" min="0" value="0">
                                <button type="button" id="asPayFull" class="okw-btn okw-btn-outline" style="height:38px;white-space:nowrap;padding:0 12px;">Pay Full</button>
                            </div>
                        </div>
                        <div class="as-field">
                            <label for="asPaidOn">Paid on <span class="as-req">*</span></label>
                            <input type="datetime-local" id="asPaidOn" class="as-input" value="${localNow()}">
                        </div>
                        <div class="as-field">
                            <label for="asPayMethod">Payment Method <span class="as-req">*</span></label>
                            <select id="asPayMethod" class="as-select">
                                <option value="cash">Cash</option>
                                <option value="momo">Mobile Money (MoMo)</option>
                                <option value="card">Card</option>
                                <option value="bank">Bank Transfer</option>
                                <option value="cheque">Cheque</option>
                                <option value="credit">Credit</option>
                            </select>
                        </div>
                    </div>
                    <div class="as-field" style="margin-top:16px;">
                        <label for="asPayNote">Payment note</label>
                        <textarea id="asPayNote" class="as-textarea" placeholder="Payment reference or remarks..."></textarea>
                    </div>
                    <div class="as-pay-foot">
                        <span>Change Return: <strong id="asChangeReturn" style="color:#15803d;">GH₵ 0.00</strong></span>
                        <span>Balance: <strong id="asBalanceDue" style="color:#b91c1c;">GH₵ 0.00</strong></span>
                    </div>
                </section>

                <div class="as-footer">
                    <a href="${backHref}" class="okw-btn okw-btn-outline" style="text-decoration:none;">Cancel</a>
                    <button type="submit" id="asSaveBtn" class="okw-btn okw-btn-primary">${saveBtnText}</button>
                </div>
            </form>
        `;

        const validateFile = (input, onOk) => {
            const f = input.files && input.files[0];
            if (!f) { onOk(null); return; }
            if (!ALLOWED_DOC_EXT.test(f.name)) {
                OkwUI.toast('Unsupported file type. Allowed: .pdf, .csv, .zip, .doc, .docx, .jpeg, .jpg, .png', 'warning');
                input.value = '';
                onOk(null);
                return;
            }
            if (f.size > MAX_DOC_BYTES) {
                OkwUI.toast('File exceeds the 5MB maximum size', 'warning');
                input.value = '';
                onOk(null);
                return;
            }
            const r = new FileReader();
            r.onload = () => onOk({ name: f.name, mime: f.type || '', data: String(r.result || '') });
            r.readAsDataURL(f);
        };
        document.getElementById('asDoc').addEventListener('change', (e) => validateFile(e.target, (d) => { saleDoc = d; }));
        document.getElementById('asShipDoc').addEventListener('change', (e) => validateFile(e.target, (d) => { shipDoc = d; }));

        function recalc() {
            const totalQty = staged.reduce((s, it) => s + Math.max(0, Number(it.qty || 0)), 0);
            const itemsTotal = staged.reduce((s, it) => s + Math.max(0, Number(it.qty || 0) * Number(it.price || 0) - Number(it.discount || 0)), 0);

            const dType = document.getElementById('asDiscType').value;
            const dIn = Math.max(0, Number(document.getElementById('asDiscAmt').value || 0));
            const discVal = dType === 'percentage' ? itemsTotal * (Math.min(100, dIn) / 100) : (dType === 'fixed' ? Math.min(itemsTotal, dIn) : 0);

            const afterDisc = Math.max(0, itemsTotal - discVal);
            const taxSel = document.getElementById('asOrderTax');
            const taxRate = taxSel.options[taxSel.selectedIndex] ? Number(taxSel.options[taxSel.selectedIndex].getAttribute('data-rate') || 0) : 0;
            const taxVal = afterDisc * (taxRate / 100);
            const ship = Math.max(0, Number(document.getElementById('asShipCharges').value || 0));
            currentPayable = Number(Math.max(0, afterDisc + taxVal + ship).toFixed(2));

            const paid = Math.max(0, Number(document.getElementById('asPayAmt').value || 0));
            const change = Math.max(0, paid - currentPayable);
            const balance = Math.max(0, currentPayable - paid);

            document.getElementById('asSumItems').textContent = totalQty.toFixed(2);
            document.getElementById('asSumTotal').textContent = fmt(itemsTotal);
            document.getElementById('asDiscCalc').textContent = fmt(discVal);
            document.getElementById('asTaxCalc').textContent = fmt(taxVal);
            document.getElementById('asTotalPayable').textContent = fmt(currentPayable);
            document.getElementById('asChangeReturn').textContent = fmt(change);
            document.getElementById('asBalanceDue').textContent = fmt(balance);
        }

        function drawRows() {
            const tbody = document.getElementById('asItemsBody');
            const delAll = document.getElementById('asDeleteAll');
            if (delAll) delAll.disabled = !staged.length;
            if (!staged.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted,#64748b);">No products added yet. Search above to add items.</td></tr>';
                recalc();
                return;
            }
            tbody.innerHTML = staged.map((it, idx) => {
                const sub = Math.max(0, Number(it.qty || 0) * Number(it.price || 0) - Number(it.discount || 0));
                return `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>
                            <strong>${OkwUI.escapeHtml(it.name)}</strong>
                            <div style="font-size:11px;color:var(--muted,#64748b);font-family:ui-monospace,monospace;">${OkwUI.escapeHtml(it.barcode)}</div>
                            <div style="font-size:11.5px;color:${Number(it.stock || 0) <= 0 ? '#b91c1c' : '#475569'};">Current stock: <strong>${Number(it.stock || 0)} ${OkwUI.escapeHtml(it.unit || 'Pc(s)')}</strong></div>
                        </td>
                        <td class="num"><input type="number" class="as-cell-in" step="any" min="0.001" value="${it.qty}" data-as-f="qty" data-as-i="${idx}"></td>
                        <td class="num"><input type="number" class="as-cell-in" step="0.01" min="0" value="${Number(it.price).toFixed(2)}" data-as-f="price" data-as-i="${idx}"></td>
                        <td class="num"><input type="number" class="as-cell-in" step="0.01" min="0" value="${Number(it.discount || 0).toFixed(2)}" data-as-f="discount" data-as-i="${idx}"></td>
                        <td class="num" style="font-weight:700;" data-as-sub="${idx}">${fmt(sub)}</td>
                        <td style="text-align:center;"><button type="button" class="okw-btn okw-btn-outline" style="height:28px;padding:0 8px;color:#b91c1c;border-color:#fecaca;" data-as-del="${idx}">&times;</button></td>
                    </tr>`;
            }).join('');
            recalc();
        }
        drawRows();

        const itemsBody = document.getElementById('asItemsBody');
        itemsBody.addEventListener('input', (e) => {
            const f = e.target.getAttribute('data-as-f');
            const idx = e.target.getAttribute('data-as-i');
            if (!f || idx === null) return;
            const i = Number(idx);
            staged[i][f] = Math.max(0, Number(e.target.value || 0));
            const sub = Math.max(0, staged[i].qty * staged[i].price - (staged[i].discount || 0));
            const cell = itemsBody.querySelector(`[data-as-sub="${i}"]`);
            if (cell) cell.textContent = fmt(sub);
            recalc();
        });
        itemsBody.addEventListener('click', (e) => {
            const del = e.target.closest('[data-as-del]');
            if (!del) return;
            staged.splice(Number(del.getAttribute('data-as-del')), 1);
            drawRows();
        });
        document.getElementById('asDeleteAll').addEventListener('click', () => {
            staged = [];
            drawRows();
        });

        // Product search dropdown
        const sIn = document.getElementById('asProductSearch');
        const sBox = document.getElementById('asSearchResults');
        sIn.addEventListener('input', () => {
            const q = sIn.value.trim().toLowerCase();
            if (!q) { sBox.style.display = 'none'; return; }
            const hits = productsList.filter(p => `${p.name || ''} ${p.barcode || ''} ${p.brand || ''}`.toLowerCase().includes(q)).slice(0, 12);
            sBox.innerHTML = hits.length ? hits.map(p => `
                <div class="as-search-item" data-pick-bc="${OkwUI.escapeHtml(p.barcode)}">
                    <div><strong>${OkwUI.escapeHtml(p.name)}</strong><div style="font-size:11.5px;color:#64748b;">${OkwUI.escapeHtml(p.barcode)}</div></div>
                    <div style="text-align:right;font-size:12.5px;"><div style="font-weight:700;color:#273990;">${fmt(p.price || 0)}</div><div style="font-size:11px;color:${Number(p.stock || 0) <= 0 ? '#b91c1c' : '#64748b'};">Stock: ${Number(p.stock || 0)}</div></div>
                </div>`).join('') : '<div style="padding:12px;color:#64748b;font-size:13px;">No matching products</div>';
            sBox.style.display = 'block';
        });
        sBox.addEventListener('click', (e) => {
            const row = e.target.closest('[data-pick-bc]');
            if (!row) return;
            const prod = productsList.find(p => String(p.barcode) === String(row.getAttribute('data-pick-bc')));
            if (prod) {
                const ex = staged.find(it => it.barcode === prod.barcode);
                if (ex) ex.qty = Number((ex.qty + 1).toFixed(3));
                else staged.push({ barcode: prod.barcode, name: prod.name, unit: prod.selling_unit || 'Pc(s)', stock: Number(prod.stock || 0), qty: 1, price: Number(prod.price || 0), discount: 0 });
                drawRows();
            }
            sIn.value = '';
            sBox.style.display = 'none';
            sIn.focus();
        });
        document.addEventListener('click', (e) => { if (!e.target.closest('.as-search-wrap')) sBox.style.display = 'none'; });

        document.getElementById('asCustomer').addEventListener('change', () => {
            const cid = Number(document.getElementById('asCustomer').value || 0);
            const c = customersList.find(x => Number(x.id) === cid);
            const label = c ? [c.name, c.address, c.phone].filter(Boolean).join(', ') : 'Walk-In Customer';
            document.getElementById('asBillAddr').textContent = label;
            document.getElementById('asShipAddrPreview').textContent = label;
            document.getElementById('asShipAddress').value = c && c.address ? c.address : '';
            document.getElementById('asAdvanceBal').textContent = fmt(c ? Number(c.store_credit || 0) : 0);
        });
        document.getElementById('asPayFull').addEventListener('click', () => {
            document.getElementById('asPayAmt').value = currentPayable.toFixed(2);
            recalc();
        });
        ['asDiscType', 'asDiscAmt', 'asOrderTax', 'asShipCharges', 'asPayAmt'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.addEventListener('input', recalc); el.addEventListener('change', recalc); }
        });

        // Load customers, taxes, and products
        Promise.all([
            fetch('/api/customers', { headers, credentials: 'include' }).then(r => r.ok ? r.json() : []).catch(() => []),
            fetch('/api/taxes/active', { headers, credentials: 'include' }).then(r => r.ok ? r.json() : []).catch(() => []),
            fetch('/api/products?limit=all', { headers, credentials: 'include' }).then(r => r.ok ? r.json() : []).catch(() => [])
        ]).then(([cData, tData, pData]) => {
            customersList = Array.isArray(cData) ? cData : (cData.customers || []);
            const cSel = document.getElementById('asCustomer');
            if (cSel) {
                cSel.innerHTML = '<option value="">Walk-In Customer</option>' + customersList.map(c => `<option value="${Number(c.id)}">${OkwUI.escapeHtml(c.name)}${c.phone ? ' (' + OkwUI.escapeHtml(c.phone) + ')' : ''}</option>`).join('');
            }
            const tSel = document.getElementById('asOrderTax');
            if (tSel && Array.isArray(tData)) {
                tSel.innerHTML = '<option value="" data-rate="0">None (0%)</option>' + tData.map(t => `<option value="${OkwUI.escapeHtml(t.id)}" data-rate="${Number(t.rate || 0)}">${OkwUI.escapeHtml(t.name)} (${Number(t.rate || 0)}%)</option>`).join('');
            }
            productsList = Array.isArray(pData) ? pData : (pData.products || pData.data || []);
        });

        document.getElementById('addSaleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const validItems = staged.filter(it => Number(it.qty) > 0);
            if (!validItems.length) return OkwUI.toast('Add at least one product', 'warning');

            const status = document.getElementById('asStatus').value || 'Final';
            const cid = document.getElementById('asCustomer').value ? Number(document.getElementById('asCustomer').value) : null;
            const custObj = cid ? customersList.find(c => Number(c.id) === cid) : null;
            const customerName = custObj ? custObj.name : 'Walk-In Customer';

            const lineDisc = validItems.reduce((s, it) => s + Number(it.discount || 0), 0);
            const itemsTotal = validItems.reduce((s, it) => s + Math.max(0, it.qty * it.price - (it.discount || 0)), 0);
            const dType = document.getElementById('asDiscType').value;
            const dIn = Math.max(0, Number(document.getElementById('asDiscAmt').value || 0));
            const orderDisc = dType === 'percentage' ? itemsTotal * (Math.min(100, dIn) / 100) : (dType === 'fixed' ? Math.min(itemsTotal, dIn) : 0);
            const totalDiscount = Number((lineDisc + orderDisc).toFixed(2));

            const paidAmt = Math.max(0, Number(document.getElementById('asPayAmt').value || 0));
            const payMethod = document.getElementById('asPayMethod').value || 'cash';
            const payNote = document.getElementById('asPayNote').value.trim();

            const saveBtn = document.getElementById('asSaveBtn');
            saveBtn.disabled = true;
            try {
                let url = '/api/pos/checkout';
                let method = 'POST';
                let body;

                const customerPhone = custObj ? (custObj.phone || '') : '';
                const invNoVal = document.getElementById('asInvNo').value.trim();
                const userObj = (() => { try { return JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('user') || '{}'); } catch (_) { return {}; } })();
                const currentLoc = userObj.store_location || 'Main Shop';
                const extraMeta = {
                    reference_no: invNoVal,
                    customer_phone: customerPhone,
                    sale_date: document.getElementById('asSaleDate').value || null,
                    pay_term: document.getElementById('asPayTermNum').value ? `${document.getElementById('asPayTermNum').value} ${document.getElementById('asPayTermUnit').value || 'Days'}` : '',
                    invoice_scheme: document.getElementById('asInvScheme').value,
                    shipping_details: document.getElementById('asShipDetails').value.trim(),
                    shipping_address: document.getElementById('asShipAddress').value.trim(),
                    shipping_charges: Number(document.getElementById('asShipCharges').value || 0),
                    shipping_status: document.getElementById('asShipStatus').value,
                    delivered_to: document.getElementById('asDeliveredTo').value.trim(),
                    delivery_person: document.getElementById('asDeliveryPerson').value.trim(),
                    document_name: saleDoc ? saleDoc.name : '',
                    shipping_document_name: shipDoc ? shipDoc.name : ''
                };

                if (status === 'Draft') {
                    url = isEditDraft ? `/api/pos/holds/${existingDraft.id}` : '/api/pos/holds';
                    method = isEditDraft ? 'PUT' : 'POST';
                    body = {
                        label: invNoVal || `${customerName} (${validItems.length} items)`,
                        customer_id: cid,
                        customer_name: customerName,
                        store_location: currentLoc,
                        items: validItems,
                        discount_amount: totalDiscount,
                        total_amount: currentPayable,
                        notes: document.getElementById('asSellNote').value.trim(),
                        meta: extraMeta
                    };
                } else if (status === 'Quotation') {
                    url = '/api/pos/quotations';
                    body = {
                        quote_number: invNoVal,
                        customer_id: cid,
                        customer_name: customerName,
                        customer_phone: customerPhone,
                        store_location: currentLoc,
                        items: validItems,
                        discount_amount: totalDiscount,
                        notes: document.getElementById('asSellNote').value.trim()
                    };
                } else {
                    body = {
                        customer_id: cid,
                        customer_name: customerName,
                        items: validItems.map(it => ({ barcode: it.barcode, name: it.name, qty: Number(it.qty), price: Number(it.price) })),
                        discount_amount: totalDiscount,
                        payments: paidAmt > 0 ? [{ method: payMethod, amount: paidAmt, reference: payNote }] : [],

                            paid_on: paidAmt > 0 ? (document.getElementById('asPaidOn').value || null) : null,
                            payment_note: payNote,
                            document_name: saleDoc ? saleDoc.name : '',
                            shipping_document_name: shipDoc ? shipDoc.name : ''
                        }
                    };
                }

                const r = await fetch(url, { method, headers, credentials: 'include', body: JSON.stringify(body) });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) {
                    OkwUI.toast(d.message || 'Failed to save sale', 'danger');
                    return;
                }
                OkwUI.toast(status === 'Draft' ? 'Draft saved' : (status === 'Quotation' ? 'Quotation saved' : 'Sale completed'), 'success');

                window.history.replaceState(null, '', '/sell?tab=' + activeView);
                if (actionBar) actionBar.style.display = '';
                render();
            } catch (_) {
                OkwUI.toast('Network error saving sale', 'danger');
            } finally {
                saveBtn.disabled = false;
            }
        });
    }

                });
                if (sr.ok) { backdrop.remove(); OkwUI.toast('Shipment recorded', 'success'); renderShipments(); }
                else { const e = await sr.json().catch(() => ({})); OkwUI.toast(e.message || 'Failed to save shipment', 'danger'); }
            };
        };
    }

    async function renderDiscounts() {
        syncQuickAddButton();
        dateHost.style.display = 'none';
        if (kpiHost) kpiHost.style.display = 'none';
        const [histRes, promoRes] = await Promise.all([
            fetch('/api/pos/discounts-history', { headers, credentials: 'include' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
            fetch('/api/promotions', { headers, credentials: 'include' }).then(r => r.ok ? r.json() : []).catch(() => [])
        ]);
        const discounts = histRes.discounts || [];
        const promos = Array.isArray(promoRes) ? promoRes : (promoRes.promotions || []);

        const panel = document.getElementById('sell-panel');
        panel.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button type="button" id="discTabRules" class="okw-btn okw-btn-primary">Active Discount / Promo Rules (${promos.length})</button>
                    <button type="button" id="discTabHist" class="okw-btn okw-btn-outline">Applied Discounts History (${discounts.length})</button>
                </div>
                <a href="/promotions" class="okw-btn okw-btn-primary" style="text-decoration:none;">+ Add Discount / Promotion</a>
            </div>
            <div id="sell-tbl"></div>
        `;

        const showRules = () => {
            document.getElementById('discTabRules').className = 'okw-btn okw-btn-primary';
            document.getElementById('discTabHist').className = 'okw-btn okw-btn-outline';
            OkwUI.dataTable('#sell-tbl', {
                columns: [
                    { key: 'code', label: 'Promo / Discount Code' },
                    { key: 'name', label: 'Name / Description', render: (v, r) => OkwUI.escapeHtml(v || r.description || '—') },
                    { key: 'discount_type', label: 'Type', render: (v, r) => OkwUI.escapeHtml(v || (r.discount_percent ? 'Percentage' : 'Fixed')) },
                    { key: 'discount_value', label: 'Value', numeric: true, render: (v, r) => r.discount_percent != null ? `${Number(r.discount_percent)}%` : fmt(v ?? r.value ?? 0) },
                    { key: 'status', label: 'Status', render: (v, r) => OkwUI.badge(v || (r.is_active === false ? 'Inactive' : 'Active'), (v === 'Inactive' || r.is_active === false) ? 'neutral' : 'success') }
                ],
                rows: promos,
                emptyText: 'No discount or promotion rules yet. Click "+ Add Discount / Promotion" to create one.',
                exportFilename: 'okwesiwa-discount-rules.xlsx',
                printTitle: 'Active Discount & Promotion Rules'
            });
        };

        const showHistory = () => {
            document.getElementById('discTabRules').className = 'okw-btn okw-btn-outline';
            document.getElementById('discTabHist').className = 'okw-btn okw-btn-primary';
            OkwUI.dataTable('#sell-tbl', {
                columns: [
                    { key: 'created_at', label: 'Date', render: v => v ? new Date(v).toLocaleString() : '' },
                    { key: 'receipt_number', label: 'Receipt #' },
                    { key: 'customer_name', label: 'Customer' },
                    { key: 'discount_amount', label: 'Discount', numeric: true, render: fmt },
                    { key: 'total_amount', label: 'Total', numeric: true, render: fmt },
                    { key: 'seller_name', label: 'Staff' }
                ],
                rows: discounts,
                emptyText: 'No discounts applied on sales yet.',
                exportFilename: 'okwesiwa-discounts-history.xlsx',
                printTitle: 'Applied Discounts History'
            });
        };

        document.getElementById('discTabRules').onclick = showRules;
        document.getElementById('discTabHist').onclick = showHistory;
        showRules();
    }

    function renderImport() {
        syncQuickAddButton();
        dateHost.style.display = 'none';
        if (kpiHost) kpiHost.style.display = 'none';
        const panel = document.getElementById('sell-panel');
        let batch = [];
        let catalogMap = new Map();

        panel.innerHTML = `
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;">
                <div>
                    <h2 style="margin:0;font-size:18px;">Sales Import &amp; Batch Entry</h2>
                    <p style="margin:4px 0 0;color:var(--color-text-muted);font-size:13px;">Add multiple sales below or upload an Excel/CSV file. Rows sharing the same <strong>Invoice Group</strong> combine into one receipt.</p>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <input type="file" id="imp-sales-file" accept=".xlsx,.xls,.csv" style="display:none;">
                    <button type="button" class="okw-btn okw-btn-outline" id="imp-pick-file">Import Excel / CSV</button>
                    <button type="button" class="okw-btn okw-btn-outline" id="imp-sample">Download Sample (.xlsx)</button>
                    <button type="button" class="okw-btn okw-btn-outline" id="imp-clear" style="color:#b91c1c;border-color:#fecaca;" disabled>Clear All</button>
                </div>
            </div>
            <div class="okw-filter-bar" style="margin-bottom:14px;">
                <input type="text" id="imp-group" class="okw-input" placeholder="Invoice Group (optional)" style="max-width:170px;">
                <input type="text" id="imp-cust" class="okw-input" placeholder="Customer (Walk-in)">
                <input type="text" id="imp-q" class="okw-input" placeholder="Scan barcode or item name...">
                <input type="number" step="any" id="imp-qty" class="okw-input" placeholder="Qty" value="1" style="max-width:95px;">
                <select id="imp-method" class="okw-select"><option value="cash">Cash</option><option value="momo">MoMo</option><option value="card">Card</option><option value="credit">Credit</option></select>
                <button type="button" class="okw-btn okw-btn-outline" id="imp-add-row">Add Row</button>
                <button type="button" class="okw-btn okw-btn-primary" id="imp-run">Save All Sales</button>
            </div>
            <div id="imp-summary" style="display:none;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 14px;margin-bottom:12px;background:var(--frame,#f8fafc);border:1px solid var(--edge,#e2e8f0);border-radius:10px;font-size:13px;"></div>
            <div id="imp-preview"></div>
        `;

        const validateRow = (r) => {
            if (r._saved) return;
            const prod = catalogMap.get(String(r.barcode || '').trim().toLowerCase());
            if (!prod) {
                r.status = 'Not found in catalog';
                r._tone = 'danger';
                r._valid = false;
                return;
            }
            r.name = prod.name;
            r.barcode = prod.barcode;
            r.unitPrice = Number(prod.price || 0);
            r.total = Number((Number(r.qty || 0) * r.unitPrice).toFixed(2));
            const avail = Number(prod.stock || 0);
            if (avail <= 0 || Number(r.qty) > avail) {
                r.status = `Insufficient stock (avail: ${avail})`;
                r._tone = 'danger';
                r._valid = false;
            } else {
                r.status = 'Ready';
                r._tone = 'success';
                r._valid = true;
            }
        };

        const drawBatch = () => {
            const clearBtn = document.getElementById('imp-clear');
            if (clearBtn) clearBtn.disabled = !batch.length;
            const sumEl = document.getElementById('imp-summary');
            if (sumEl) {
                if (!batch.length) {
                    sumEl.style.display = 'none';
                } else {
                    const readyCnt = batch.filter(r => r._valid && !r._saved).length;
                    const errCnt = batch.filter(r => !r._valid && !r._saved).length;
                    const totalVal = batch.reduce((s, r) => s + Number(r.total || 0), 0);
                    sumEl.style.display = 'flex';
                    sumEl.innerHTML = `
                        <div style="display:flex;gap:16px;flex-wrap:wrap;">
                            <span>Rows: <strong>${batch.length}</strong></span>
                            <span style="color:#15803d;">Ready: <strong>${readyCnt}</strong></span>
                            ${errCnt > 0 ? `<span style="color:#b91c1c;">Issues: <strong>${errCnt}</strong></span>` : ''}
                        </div>
                        <div>Batch Total: <strong style="color:var(--brand,#273990);">${fmt(totalVal)}</strong></div>
                    `;
                }
            }

            OkwUI.dataTable('#imp-preview', {
                columns: [
                    { key: 'group', label: 'Invoice Group', render: v => OkwUI.escapeHtml(v || '—') },
                    { key: 'name', label: 'Product' },
                    { key: 'barcode', label: 'Barcode' },
                    { key: 'qty', label: 'Qty', numeric: true },
                    { key: 'customer', label: 'Customer' },
                    { key: 'method', label: 'Payment Method' },
                    { key: 'total', label: 'Total', numeric: true, render: fmt },
                    { key: 'status', label: 'Status', render: (v, r) => OkwUI.badge(v || 'Ready', r._tone || 'info') },
                    {
                        key: '_idx',
                        label: 'Action',
                        render: (_v, r) => `<button type="button" class="okw-btn okw-btn-outline" data-imp-rm="${r._idx}" style="height:26px;padding:0 9px;font-size:12px;color:#b91c1c;border-color:#fecaca;">Remove</button>`
                    }
                ],
                rows: batch.map((r, idx) => ({ ...r, _idx: idx })),
                emptyText: 'No sales queued yet. Add a row above or import an Excel / CSV file.',
                exportFilename: 'okwesiwa-sales-import-batch.xlsx',
                printTitle: 'Sales Import Batch'
            });

            document.getElementById('imp-preview').querySelectorAll('[data-imp-rm]').forEach(btn => {
                btn.onclick = () => {
                    batch.splice(Number(btn.dataset.impRm), 1);
                    drawBatch();
                };
            });
        };

        // Preload catalog for instant validation & pricing preview
        fetch('/api/products?limit=all', { headers, credentials: 'include' })
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                const prods = Array.isArray(data) ? data : (data.products || data.data || []);
                catalogMap = new Map(prods.map(p => [String(p.barcode || '').trim().toLowerCase(), p]));
                if (batch.length) { batch.forEach(validateRow); drawBatch(); }
            })
            .catch(() => {});

        drawBatch();

        const queueProduct = (prod, qty) => {
            const group = document.getElementById('imp-group').value.trim();
            const customer = document.getElementById('imp-cust').value.trim() || 'Walk-in';
            const method = document.getElementById('imp-method').value || 'cash';
            if (prod && prod.barcode) catalogMap.set(String(prod.barcode).trim().toLowerCase(), prod);
            const row = {
                group,
                name: prod.name,
                barcode: prod.barcode,
                qty,
                customer,
                method,
                unitPrice: Number(prod.price || 0),
                total: Number((qty * Number(prod.price || 0)).toFixed(2)),
                status: 'Ready',
                _tone: 'success',
                _valid: true,
                _saved: false
            };
            validateRow(row);
            batch.push(row);
            document.getElementById('imp-q').value = '';
            drawBatch();
        };

        OkwUI.productTypeahead('#imp-q', (prod) => {
            const qty = Math.max(0.001, Number(document.getElementById('imp-qty').value || 1));
            queueProduct(prod, qty);
        });

        document.getElementById('imp-add-row').onclick = async () => {
            const q = document.getElementById('imp-q').value.trim();
            const qty = Number(document.getElementById('imp-qty').value || 1);
            if (!q || qty <= 0) return OkwUI.toast('Enter product and positive qty', 'warning');
            const sr = await fetch(`/api/pos/search?q=${encodeURIComponent(q)}&limit=1`, { headers, credentials: 'include' });
            const sd = await sr.json().catch(() => ({}));
            const prod = (sd.products || [])[0];
            if (!prod) return OkwUI.toast('Product not found', 'danger');
            queueProduct(prod, qty);
        };

        document.getElementById('imp-clear').onclick = () => {
            batch = [];
            drawBatch();
        };

        document.getElementById('imp-sample').onclick = async () => {
            if (typeof window.__libsReady === 'function') await window.__libsReady();
            const sample = [
                { 'Invoice Group': 'INV-001', Barcode: 'TOOL-001', Qty: 2, 'Customer Name': 'Walk-in', 'Payment Method': 'cash' },
                { 'Invoice Group': 'INV-001', Barcode: 'TOOL-002', Qty: 1, 'Customer Name': 'Walk-in', 'Payment Method': 'cash' },
                { 'Invoice Group': 'INV-002', Barcode: 'TOOL-003', Qty: 3, 'Customer Name': 'Ama Mensah', 'Payment Method': 'momo' }
            ];
            if (window.XLSX) {
                const ws = window.XLSX.utils.json_to_sheet(sample);
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, 'Sales_Sample');
                window.XLSX.writeFile(wb, 'okwesiwa-sales-import-sample.xlsx');
            } else {
                const csv = 'Invoice Group,Barcode,Qty,Customer Name,Payment Method\nINV-001,TOOL-001,2,Walk-in,cash\n';
                const blob = new Blob([csv], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'okwesiwa-sales-import-sample.csv';
                a.click();
            }
        };

        document.getElementById('imp-pick-file').onclick = () => document.getElementById('imp-sales-file').click();
        document.getElementById('imp-sales-file').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (typeof window.__libsReady === 'function') await window.__libsReady();
            if (!window.XLSX) {
                OkwUI.toast('Spreadsheet library is still loading. Please try again.', 'warning');
                return;
            }
            try {
                const buf = await file.arrayBuffer();
                const wb = window.XLSX.read(buf);
                const parsed = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                let added = 0;
                for (const row of parsed) {
                    const barcode = String(row.Barcode || row.barcode || row.SKU || row.sku || '').trim();
                    const qty = Number(row.Qty || row.qty || row.Quantity || row.quantity || 1);
                    if (!barcode || qty <= 0) continue;
                    const item = {
                        group: String(row['Invoice Group'] || row['Invoice No'] || row.Group || row.group || '').trim(),
                        name: row['Product Name'] || barcode,
                        barcode,
                        qty,
                        customer: String(row['Customer Name'] || row.Customer || 'Walk-in').trim() || 'Walk-in',
                        method: String(row['Payment Method'] || row.Method || 'cash').trim().toLowerCase(),
                        unitPrice: 0,
                        total: Number(row.Total || 0),
                        status: 'Ready',
                        _tone: 'success',
                        _valid: true,
                        _saved: false
                    };
                    validateRow(item);
                    batch.push(item);
                    added++;
                }
                e.target.value = '';
                drawBatch();
                OkwUI.toast(`Loaded ${added} row(s) from ${file.name}`, added ? 'success' : 'warning');
            } catch (err) {
                OkwUI.toast('Could not parse file. Check format and try again.', 'danger');
            }
        };

        const impRunBtn = document.getElementById('imp-run');
        impRunBtn.onclick = async () => {
            if (impRunBtn.disabled) return;
            const pending = batch.filter(r => !r._saved);
            if (!pending.length) return OkwUI.toast('Add at least one unsaved sale row first', 'warning');

            // Group rows that share an Invoice Group into a single multi-item receipt
            const groups = [];
            const groupIdxMap = new Map();
            for (const row of pending) {
                if (row.group) {
                    const key = row.group.toLowerCase();
                    if (!groupIdxMap.has(key)) {
                        groupIdxMap.set(key, groups.length);
                        groups.push({ key: row.group, customer: row.customer, method: row.method, rows: [] });
                    }
                    groups[groupIdxMap.get(key)].rows.push(row);
                } else {
                    groups.push({ key: null, customer: row.customer, method: row.method, rows: [row] });
                }
            }

            impRunBtn.disabled = true;
            const origText = impRunBtn.textContent;
            impRunBtn.textContent = 'Importing...';
            let okGroups = 0;
            let failGroups = 0;
            try {
                for (const g of groups) {
                    const groupTotal = Number(g.rows.reduce((s, r) => s + Number(r.total || 0), 0).toFixed(2));
                    const payMethod = String(g.method || 'cash').toLowerCase();
                    const payments = (payMethod !== 'credit' && groupTotal > 0)
                        ? [{ method: payMethod, amount: groupTotal, reference: g.key ? `Import ${g.key}` : 'Batch Import' }]
                        : [];
                    const r = await fetch('/api/pos/checkout', {
                        method: 'POST',
                        headers,
                        credentials: 'include',
                        body: JSON.stringify({
                            items: g.rows.map(row => ({ barcode: String(row.barcode), qty: Number(row.qty) })),
                            customer_name: g.customer || 'Walk-in',
                            payments,
                            delivery: g.key ? { invoice_no: g.key } : null
                        })
                    });
                    const out = await r.json().catch(() => ({}));
                    if (r.ok) {
                        okGroups++;
                        g.rows.forEach(row => {
                            row._saved = true;
                            row._valid = true;
                            row._tone = 'success';
                            row.status = out.receipt_number ? `Saved (${out.receipt_number})` : 'Saved';
                        });
                    } else {
                        failGroups++;
                        g.rows.forEach(row => {
                            row._valid = false;
                            row._tone = 'danger';
                            row.status = 'Failed: ' + (out.message || `HTTP ${r.status}`);
                        });
                    }
                }
                drawBatch();
                if (failGroups === 0) {
                    OkwUI.toast(`Saved all ${okGroups} sale(s) successfully`, 'success');
                    activeView = 'all';
                    window.history.replaceState(null, '', '/sell?tab=all');
                    render();
                } else {
                    OkwUI.toast(`Saved ${okGroups} sale(s), ${failGroups} failed — check Status column for details`, 'warning');
                }
            } finally {
                impRunBtn.disabled = false;
                impRunBtn.textContent = origText;
            }
        };
    }

    function render() {
        const actionBar = document.querySelector('.okw-action-bar');
        if (actionBar) actionBar.style.display = ['add', 'add_draft', 'add_quotation'].includes(activeView) ? 'none' : '';
        if (activeView === 'all') return renderSalesTable(() => true, 'All Sales', 'okwesiwa-all-sales.xlsx');
        if (activeView === 'list_pos') return renderSalesTable(t => !t.is_return, 'POS Sales List', 'okwesiwa-pos-sales.xlsx');
        if (activeView === 'returns') return renderSalesTable(t => Boolean(t.is_return), 'Sell Returns', 'okwesiwa-sell-returns.xlsx');
        if (['add', 'add_draft', 'add_quotation'].includes(activeView)) return renderItemBuilder(activeView);
        if (activeView === 'drafts') return renderDrafts();
        if (activeView === 'quotations') return renderQuotations();
        if (activeView === 'shipments') return renderShipments();
        if (activeView === 'discounts') return renderDiscounts();
        if (activeView === 'import') return renderImport();
    }

    render();
})();
</script>
</body>
</html>
