<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - OKWESIWA LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/auth-guard.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { flex: 1; padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap" id="hub"></div>
        <footer style="text-align:center;padding:16px 24px;color:var(--color-text-muted);font-size:13px;border-top:1px solid var(--color-border);">© 2026 OKWESIWA LTD</footer>
    </main>
</div>

<script>
(function () {
    // Each section shows the existing, working page for that job inside the hub.
    // The server also refuses these pages to anyone without the right role.
    OkwUI.sectionPage({
        mount: '#hub',
        title: 'Sales',
        subtitle: 'Sales, drafts, quotations, returns, shipments, discounts and transactions.',
        defaultId: 'all',
        sections: [
            { id: 'all', label: 'All sales', group: 'Sales', embed: '/sell?tab=all' },
            { id: 'add', label: 'Add sale', group: 'Sales', embed: '/sell?tab=add' },
            { id: 'list_pos', label: 'POS sales', group: 'Sales', embed: '/sell?tab=list_pos' },
            { id: 'returns', label: 'Sale returns', group: 'Sales', embed: '/sell?tab=returns' },
            { id: 'shipments', label: 'Shipments', group: 'Sales', embed: '/sell?tab=shipments' },
            { id: 'transactions', label: 'Transactions', group: 'Sales', embed: '/transactions' },
            { id: 'layaway', label: 'Lay-away', group: 'Sales', embed: '/extras?tab=layaway' },
            { id: 'add_draft', label: 'Add draft', group: 'Drafts and quotations', embed: '/sell?tab=add_draft' },
            { id: 'drafts', label: 'Drafts', group: 'Drafts and quotations', embed: '/sell?tab=drafts' },
            { id: 'add_quotation', label: 'Add quotation', group: 'Drafts and quotations', embed: '/sell?tab=add_quotation' },
            { id: 'quotations', label: 'Quotations', group: 'Drafts and quotations', embed: '/sell?tab=quotations' },
            { id: 'discounts', label: 'Discounts', group: 'Pricing', embed: '/sell?tab=discounts' },
            { id: 'promotions', label: 'Promotions', group: 'Pricing', embed: '/promotions' },
            { id: 'import', label: 'Import sales', group: 'Pricing', embed: '/sell?tab=import' }
        ]
    });
})();
</script>
</body>
</html>
