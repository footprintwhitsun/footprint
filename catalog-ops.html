<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands, Units, Prices & Groups - OKWESIWA CO LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/auth-guard.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <script src="/vendor/xlsx-0.20.2.full.min.js" defer></script>
    <style>
        .app-shell { display: flex; min-height: 100vh; }
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; }
        body.sidebar-collapsed .main-content { margin-left: var(--sidebar-collapsed-width); }
        .page-wrap { padding: 24px; max-width: 1400px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .tabs-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        @media (max-width: 900px) { .main-content { margin-left: 0; } }
    </style>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD">
            <span class="sidebar-role-badge">Catalog & Prices</span>
        </div>
        <nav class="nav-links">
            <div class="nav-section">Products & Contacts</div>
            <a href="/inventory"><span>Products & Inventory</span></a>
            <a href="/catalog-ops" class="active"><span>Brands, Units & Prices</span></a>
            <a href="/operations"><span>Deliveries, Transfers & Reorder</span></a>
            <a href="/customers"><span>Customers</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap">
            <div class="okw-page-header">
                <div class="okw-page-header-text">
                    <h1 class="okw-page-title" id="cat-page-title">Brands, Units, Bulk Prices &amp; Customer Groups</h1>
                    <p class="okw-page-subtitle" id="cat-page-subtitle">Manage building-material brands, unit conversions, bulk price updates with history, customer groups, and project sites.</p>
                </div>
                <div class="okw-page-header-actions" id="cat-page-actions"></div>
            </div>

            <div class="tabs-row" id="cat-tabs">
                <button type="button" class="okw-btn okw-btn-primary" data-ctab="brands">Brands</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="units">Units &amp; Conversions</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="prices">Update Price</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="variations">Variations</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="price_groups">Selling Price Groups</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="warranties">Warranties</button>
                <button type="button" class="okw-btn okw-btn-outline" data-ctab="groups">Customer Groups &amp; Sites</button>
            </div>

            <div class="okw-card" id="cat-panel">
                <div class="okw-sk-stack" aria-hidden="true" style="padding:8px 4px;">
                    <span class="okw-sk-bar" style="width:100%;height:38px;border-radius:8px;"></span>
                    <span class="okw-sk-bar" style="width:100%;height:14px;"></span>
                    <span class="okw-sk-bar" style="width:96%;height:14px;"></span>
                    <span class="okw-sk-bar" style="width:92%;height:14px;"></span>
                    <span class="okw-sk-bar" style="width:94%;height:14px;"></span>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
(function () {
    const token = localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
    const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
    const fmt = (n) => 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    let activeTab = 'brands';

    function openSimpleModal({ title, fields, onSave, saveLabel = 'Save' }) {
        const prev = document.getElementById('okw-cat-modal');
        if (prev) prev.remove();
        const esc = (v) => OkwUI.escapeHtml(v == null ? '' : String(v));
        const backdrop = document.createElement('div');
        backdrop.id = 'okw-cat-modal';
        backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(11,16,23,0.6);backdrop-filter:blur(2px);z-index:10060;display:flex;align-items:center;justify-content:center;padding:16px;';
        backdrop.innerHTML = `
            <div role="dialog" aria-modal="true" style="background:var(--sheet,#fff);color:var(--ink,#0f172a);border:1px solid var(--edge,#e2e8f0);border-radius:12px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,0.25);overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--edge,#e2e8f0);background:var(--frame,#f8fafc);">
                    <h3 style="margin:0;font-size:16px;font-weight:700;">${esc(title)}</h3>
                    <button type="button" id="cm-close" aria-label="Close" style="border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted,#64748b);cursor:pointer;">&times;</button>
                </div>
                <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px;">
                    ${fields.map((f) => `
                        <div style="display:flex;flex-direction:column;gap:5px;">
                            <label for="cm-${esc(f.id)}" style="font-size:12.5px;font-weight:600;">${esc(f.label)}${f.required ? ':*' : ':'}</label>
                            ${f.type === 'select'
                                ? `<select id="cm-${esc(f.id)}" class="okw-select">${(f.options || []).map((o) => `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
                                : `<input type="${esc(f.type || 'text')}" id="cm-${esc(f.id)}" class="okw-input" placeholder="${esc(f.placeholder || '')}" value="${esc(f.value ?? '')}"${f.step ? ` step="${esc(f.step)}"` : ''}${f.min != null ? ` min="${esc(f.min)}"` : ''}>`
                            }
                        </div>
                    `).join('')}
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--edge,#e2e8f0);background:var(--frame,#f8fafc);">
                    <button type="button" class="okw-btn okw-btn-outline" id="cm-cancel">Close</button>
                    <button type="button" class="okw-btn okw-btn-primary" id="cm-save">${esc(saveLabel)}</button>
                </div>
            </div>`;
        document.body.appendChild(backdrop);
        const close = () => backdrop.remove();
        backdrop.querySelector('#cm-close').onclick = close;
        backdrop.querySelector('#cm-cancel').onclick = close;
        backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) close(); });
        backdrop.querySelector('#cm-save').onclick = async () => {
            const values = {};
            for (const f of fields) {
                const el = backdrop.querySelector(`#cm-${f.id}`);
                values[f.id] = el ? el.value.trim() : '';
                if (f.required && !values[f.id]) {
                    return OkwUI.toast(`${f.label} is required`, 'warning');
                }
            }
            const ok = await onSave(values);
            if (ok !== false) close();
        };
    }

    async function renderBrands() {
        const res = await fetch('/api/brands', { headers });
        const d = await res.json().catch(() => ({}));
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="b-open-add">+ Add Brand</button>`;
        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `<div id="brands-tbl"></div>`;
        OkwUI.dataTable('#brands-tbl', {
            columns: [
                { key: 'name', label: 'Brand' },
                { key: 'product_count', label: 'Products', numeric: true },
                { key: 'total_stock', label: 'Stock Qty', numeric: true },
                { key: 'stock_value', label: 'Stock Value', numeric: true, render: v => fmt(v) }
            ],
            rows: d.brands || [],
            exportFilename: 'okwesiwa-brands.xlsx'
        });
        const addBtn = document.getElementById('b-open-add');
        if (addBtn) addBtn.onclick = () => openSimpleModal({
            title: 'Add Brand',
            fields: [{ id: 'name', label: 'Brand Name', placeholder: 'e.g. Ghacem, Dangote, Coral', required: true }],
            onSave: async (v) => {
                const r = await fetch('/api/brands', { method: 'POST', headers, body: JSON.stringify({ name: v.name }) });
                if (r.ok) { OkwUI.toast('Brand saved', 'success'); renderBrands(); return true; }
                OkwUI.toast('Failed to save brand', 'danger');
                return false;
            }
        });
    }

    async function renderUnits() {
        const res = await fetch('/api/units', { headers });
        const d = await res.json().catch(() => ({}));
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="u-open-add">+ Add Unit</button>`;
        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `<div id="units-tbl"></div>`;
        OkwUI.dataTable('#units-tbl', {
            columns: [
                { key: 'alt_unit', label: 'Pack / Sell Unit' },
                { key: 'factor', label: 'Equals Base Qty', numeric: true },
                { key: 'base_unit', label: 'Base Unit' },
                { key: 'notes', label: 'Notes' }
            ],
            rows: d.units || [],
            exportFilename: 'okwesiwa-units.xlsx'
        });
        const addBtn = document.getElementById('u-open-add');
        if (addBtn) addBtn.onclick = () => openSimpleModal({
            title: 'Add Unit Conversion',
            fields: [
                { id: 'base_unit', label: 'Base Unit', placeholder: 'e.g. Bag', required: true },
                { id: 'alt_unit', label: 'Pack / Sell Unit', placeholder: 'e.g. Pallet', required: true },
                { id: 'factor', label: 'Conversion Factor', type: 'number', step: 'any', placeholder: 'e.g. 50', required: true },
                { id: 'notes', label: 'Notes', placeholder: 'Optional description' }
            ],
            onSave: async (v) => {
                const r = await fetch('/api/units', { method: 'POST', headers, body: JSON.stringify(v) });
                if (r.ok) { OkwUI.toast('Unit conversion added', 'success'); renderUnits(); return true; }
                OkwUI.toast('Failed to add unit', 'danger');
                return false;
            }
        });
    }

    async function renderPrices() {
        const prodRes = await fetch('/api/products?limit=all', { headers, credentials: 'include' });
        const prodRaw = await prodRes.json().catch(() => ([]));
        const products = (Array.isArray(prodRaw) ? prodRaw : (prodRaw.products || prodRaw.data || [])).map((p) => ({
            id: p.id,
            barcode: String(p.barcode || ''),
            name: String(p.name || ''),
            brand: String(p.brand || ''),
            category: String(p.category || ''),
            cost_price: Number(p.cost_price || 0),
            old_price: Number(p.price || 0),
            new_price: Number(p.price || 0)
        }));
        const categories = [...new Set(products.map((p) => p.category).filter(Boolean))].sort();
        const brands = [...new Set(products.map((p) => p.brand).filter(Boolean))].sort();
        const esc = (v) => OkwUI.escapeHtml(v == null ? '' : String(v));
        let changedOnly = false;
        let bpPage = 1;
        let bpPageSize = 25;
        let bpSortKey = 'name';
        let bpSortDir = 1;
        const bpHiddenCols = new Set();
        const selectedBarcodes = new Set();
        const BP_COLS = [
            { key: 'barcode', label: 'SKU', align: 'left' },
            { key: 'name', label: 'Product', align: 'left' },
            { key: 'category', label: 'Category', align: 'left' },
            { key: 'cost_price', label: 'Cost', align: 'right', numeric: true },
            { key: 'margin', label: 'Margin', align: 'right', numeric: true },
            { key: 'old_price', label: 'Current', align: 'right', numeric: true },
            { key: 'new_price', label: 'New Price', align: 'right', numeric: true, width: '155px' },
            { key: 'change', label: 'Change', align: 'right', numeric: true }
        ];

        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) {
            actionsHost.innerHTML = `
                <div class="bp-dd" style="position:relative;display:inline-block;">
                    <button type="button" class="okw-btn okw-btn-outline" id="bp-actions-dd-btn">Export / Print ▾</button>
                    <div id="bp-actions-dd-menu" class="bp-dd-menu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,0.12);padding:6px;z-index:60;">
                        <button type="button" id="bp-export-xlsx" style="width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink,#0f172a);cursor:pointer;display:flex;align-items:center;gap:8px;">Export Excel (.xlsx)</button>
                        <button type="button" id="bp-import-btn" style="width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink,#0f172a);cursor:pointer;display:flex;align-items:center;gap:8px;">Import (.xlsx / .csv)</button>
                        <button type="button" id="bp-print" style="width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink,#0f172a);cursor:pointer;display:flex;align-items:center;gap:8px;">Print / PDF (Portrait)</button>
                        <button type="button" id="bp-print-land" style="width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink,#0f172a);cursor:pointer;display:flex;align-items:center;gap:8px;">Print / PDF (Landscape)</button>
                        <div style="height:1px;background:var(--edge,#e2e8f0);margin:5px 4px;"></div>
                        <a href="/reports?tab=detailed&report=price_history" style="width:100%;box-sizing:border-box;text-align:left;text-decoration:none;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--brand,#273990);display:flex;align-items:center;gap:8px;">Price History Report</a>
                    </div>
                </div>
                <input type="file" id="bp-import-file" accept=".xlsx,.xls,.csv" style="display:none;">
                <button type="button" class="okw-btn okw-btn-primary" id="bp-apply" disabled>Save Changes (0)</button>
            `;
        }

        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `
            <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;box-sizing:border-box;">
                <div style="background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:10px;padding:14px 16px;">
                    <div style="font-size:11.5px;font-weight:600;color:var(--muted,#64748b);text-transform:uppercase;letter-spacing:0.04em;">Catalog Products</div>
                    <div id="bp-kpi-total" style="font-size:22px;font-weight:800;color:var(--ink,#0f172a);margin-top:4px;font-variant-numeric:tabular-nums;">${products.length}</div>
                    <div id="bp-kpi-showing" style="font-size:12px;color:var(--muted,#64748b);margin-top:2px;">Showing all</div>
                </div>
                <div id="bp-kpi-chg-card" style="background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:10px;padding:14px 16px;">
                    <div style="font-size:11.5px;font-weight:600;color:var(--muted,#64748b);text-transform:uppercase;letter-spacing:0.04em;">Pending Edits</div>
                    <div id="bp-kpi-changed" style="font-size:22px;font-weight:800;color:var(--brand,#273990);margin-top:4px;font-variant-numeric:tabular-nums;">0</div>
                    <div style="font-size:12px;color:var(--muted,#64748b);margin-top:2px;">Unsaved changes</div>
                </div>
                <div style="background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:10px;padding:14px 16px;">
                    <div style="font-size:11.5px;font-weight:600;color:var(--muted,#64748b);text-transform:uppercase;letter-spacing:0.04em;">Avg. Selling Price</div>
                    <div id="bp-kpi-avg" style="font-size:22px;font-weight:800;color:var(--ink,#0f172a);margin-top:4px;font-variant-numeric:tabular-nums;">—</div>
                    <div style="font-size:12px;color:var(--muted,#64748b);margin-top:2px;">Across filtered items</div>
                </div>
                <div style="background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:10px;padding:14px 16px;">
                    <div style="font-size:11.5px;font-weight:600;color:var(--muted,#64748b);text-transform:uppercase;letter-spacing:0.04em;">Net Price Impact</div>
                    <div id="bp-kpi-impact" style="font-size:22px;font-weight:800;color:#15803d;margin-top:4px;font-variant-numeric:tabular-nums;">${esc(fmt(0))}</div>
                    <div style="font-size:12px;color:var(--muted,#64748b);margin-top:2px;">Sum of pending diffs</div>
                </div>
            </div>

            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;box-sizing:border-box;">
                <input type="search" id="bp-search" class="okw-input" placeholder="Search by product name or SKU..." style="flex:1;min-width:220px;height:40px;box-sizing:border-box;">

                <div class="bp-dd" style="position:relative;">
                    <button type="button" id="bp-filter-dd-btn" class="okw-btn okw-btn-outline" style="height:40px;white-space:nowrap;">Filters ▾</button>
                    <div id="bp-filter-dd-menu" class="bp-dd-menu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:290px;background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,0.14);padding:14px;z-index:60;box-sizing:border-box;">
                        <div style="font-size:12px;font-weight:700;color:var(--brand,#273990);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;">Filter Products</div>
                        <div style="display:flex;flex-direction:column;gap:10px;">
                            <div>
                                <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Category</label>
                                <select id="bp-cat" class="okw-select" style="width:100%;height:36px;box-sizing:border-box;">
                                    <option value="">All Categories</option>
                                    ${categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Brand</label>
                                <select id="bp-brand" class="okw-select" style="width:100%;height:36px;box-sizing:border-box;">
                                    <option value="">All Brands</option>
                                    ${brands.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join('')}
                                </select>
                            </div>
                            <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink,#0f172a);cursor:pointer;padding-top:4px;">
                                <input type="checkbox" id="bp-toggle-changed" style="width:16px;height:16px;accent-color:var(--brand,#273990);">
                                <span id="bp-toggle-changed-lbl">Changed Only (0)</span>
                            </label>
                            <button type="button" id="bp-clear-filters" class="okw-btn okw-btn-outline" style="height:34px;width:100%;">Clear Filters</button>
                        </div>
                    </div>
                </div>

                <div class="bp-dd" style="position:relative;">
                    <button type="button" id="bp-bulk-dd-btn" class="okw-btn okw-btn-outline" style="height:40px;white-space:nowrap;">Bulk Adjust ▾</button>
                    <div id="bp-bulk-dd-menu" class="bp-dd-menu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:320px;background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,0.14);padding:14px;z-index:60;box-sizing:border-box;">
                        <div style="font-size:12px;font-weight:700;color:var(--brand,#273990);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;">Bulk Price Adjustment</div>
                        <div style="display:flex;flex-direction:column;gap:10px;">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                                <div>
                                    <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Adjustment Type</label>
                                    <select id="bp-mode" class="okw-select" style="width:100%;height:36px;box-sizing:border-box;">
                                        <option value="percent">% Change</option>
                                        <option value="amount">Fixed GH₵</option>
                                    </select>
                                </div>
                                <div>
                                    <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Value</label>
                                    <input type="number" id="bp-val" class="okw-input" placeholder="e.g. 5 or -10" step="0.01" style="width:100%;height:36px;box-sizing:border-box;">
                                </div>
                            </div>
                            <div>
                                <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Rounding</label>
                                <select id="bp-round" class="okw-select" style="width:100%;height:36px;box-sizing:border-box;">
                                    <option value="0.01">Exact (0.01)</option>
                                    <option value="0.5">Nearest 0.50</option>
                                    <option value="1">Nearest 1.00</option>
                                </select>
                            </div>
                            <div>
                                <label style="display:block;font-size:12px;font-weight:600;color:var(--muted,#64748b);margin-bottom:4px;">Audit Reason</label>
                                <input type="text" id="bp-reason" class="okw-input" placeholder="e.g. Supplier cost review" style="width:100%;height:36px;box-sizing:border-box;">
                            </div>
                            <div style="display:flex;gap:8px;padding-top:4px;">
                                <button type="button" class="okw-btn okw-btn-primary" id="bp-bulk-calc" style="flex:1;height:36px;">Apply to Filtered</button>
                                <button type="button" class="okw-btn okw-btn-outline" id="bp-reset" style="height:36px;">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bp-dd" style="position:relative;">
                    <button type="button" id="bp-cols-dd-btn" class="okw-btn okw-btn-outline" style="height:40px;white-space:nowrap;">Columns ▾</button>
                    <div id="bp-cols-dd-menu" class="bp-dd-menu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:190px;background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,0.14);padding:10px 12px;z-index:60;box-sizing:border-box;">
                        ${BP_COLS.map((c) => `
                            <label style="display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;color:var(--ink,#0f172a);cursor:pointer;">
                                <input type="checkbox" class="bp-col-toggle" data-col-key="${c.key}" checked style="width:15px;height:15px;accent-color:var(--brand,#273990);">
                                <span>${esc(c.label)}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>

                <button type="button" class="okw-btn okw-btn-outline" id="bp-clear-sel" style="height:40px;display:none;white-space:nowrap;">Clear Selection</button>
            </div>

            <div style="background:var(--sheet,#fff);border:1px solid var(--edge,#e2e8f0);border-radius:12px;overflow-x:auto;">
                <table data-no-table-tools="1" style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead id="bp-prod-head">
                        <tr style="background:var(--frame,#f8fafc);border-bottom:1px solid var(--edge,#e2e8f0);">
                            <th style="width:42px;text-align:center;padding:11px 10px;">
                                <input type="checkbox" id="bp-select-all" title="Select all visible products" aria-label="Select all visible products" style="width:16px;height:16px;accent-color:var(--brand,#273990);cursor:pointer;">
                            </th>
                            ${BP_COLS.map((c) => `<th data-bp-sort="${c.key}" data-bp-col="${c.key}" title="Click to sort" style="text-align:${c.align};padding:11px 14px;${c.width ? 'width:' + c.width + ';' : ''}font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted,#64748b);cursor:pointer;user-select:none;white-space:nowrap;">${esc(c.label)} <span class="bp-sort-ind" style="font-size:10px;opacity:0.7;"></span></th>`).join('')}
                        </tr>
                    </thead>
                    <tbody id="bp-prod-body"></tbody>
                </table>
                <div id="bp-pager" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--edge,#e2e8f0);font-size:13px;color:var(--muted,#64748b);background:var(--sheet,#fff);"></div>
            </div>
        `;

        function getSortMetric(p, key) {
            if (key === 'margin') return p.cost_price > 0 ? ((p.new_price - p.cost_price) / p.cost_price) * 100 : -Infinity;
            if (key === 'change') return Number((p.new_price - p.old_price).toFixed(2));
            return p[key];
        }

        function getFiltered() {
            const q = document.getElementById('bp-search').value.trim().toLowerCase();
            const cat = document.getElementById('bp-cat').value;
            const brand = document.getElementById('bp-brand').value;
            const list = products.filter((p) => {
                if (changedOnly && Math.abs(Number(p.new_price) - Number(p.old_price)) <= 0.004) return false;
                if (cat && p.category !== cat) return false;
                if (brand && p.brand !== brand) return false;
                if (q && !p.name.toLowerCase().includes(q) && !p.barcode.toLowerCase().includes(q)) return false;
                return true;
            });
            if (bpSortKey) {
                const colMeta = BP_COLS.find((c) => c.key === bpSortKey);
                list.sort((a, b) => {
                    const va = getSortMetric(a, bpSortKey);
                    const vb = getSortMetric(b, bpSortKey);
                    if (colMeta && colMeta.numeric) return ((Number(va) || 0) - (Number(vb) || 0)) * bpSortDir;
                    return String(va || '').localeCompare(String(vb || ''), undefined, { numeric: true, sensitivity: 'base' }) * bpSortDir;
                });
            }
            return list;
        }

        function getChangedItems() {
            return products.filter((p) => Math.abs(Number(p.new_price) - Number(p.old_price)) > 0.004);
        }

        function syncStats(visibleList) {
            const changed = getChangedItems();
            const btn = document.getElementById('bp-apply');
            if (btn) {
                btn.disabled = changed.length === 0;
                btn.textContent = `Save Changes (${changed.length})`;
            }
            const tgl = document.getElementById('bp-toggle-changed');
            if (tgl) tgl.checked = changedOnly;
            const tglLbl = document.getElementById('bp-toggle-changed-lbl');
            if (tglLbl) tglLbl.textContent = `Changed Only (${changed.length})`;

            const activeFilterCount = (document.getElementById('bp-cat')?.value ? 1 : 0)
                + (document.getElementById('bp-brand')?.value ? 1 : 0)
                + (changedOnly ? 1 : 0);
            const fBtn = document.getElementById('bp-filter-dd-btn');
            if (fBtn) fBtn.textContent = activeFilterCount > 0 ? `Filters (${activeFilterCount}) ▾` : 'Filters ▾';
            const kpiChanged = document.getElementById('bp-kpi-changed');
            const kpiChgCard = document.getElementById('bp-kpi-chg-card');
            if (kpiChanged) kpiChanged.textContent = String(changed.length);
            if (kpiChgCard) kpiChgCard.style.borderColor = changed.length > 0 ? '#f59e0b' : 'var(--edge,#e2e8f0)';

            const showingEl = document.getElementById('bp-kpi-showing');
            if (showingEl) showingEl.textContent = `Showing ${visibleList.length} of ${products.length}`;

            const avg = visibleList.length
                ? visibleList.reduce((s, p) => s + Number(p.new_price || 0), 0) / visibleList.length
                : 0;
            const avgEl = document.getElementById('bp-kpi-avg');
            if (avgEl) avgEl.textContent = fmt(avg);

            const netImpact = changed.reduce((s, p) => s + (Number(p.new_price) - Number(p.old_price)), 0);
            const impEl = document.getElementById('bp-kpi-impact');
            if (impEl) {
                impEl.textContent = `${netImpact > 0 ? '+' : ''}${fmt(netImpact)}`;
                impEl.style.color = netImpact > 0 ? '#15803d' : (netImpact < 0 ? '#dc2626' : 'var(--ink,#0f172a)');
            }

            const selCount = selectedBarcodes.size;
            const bulkBtn = document.getElementById('bp-bulk-calc');
            if (bulkBtn) bulkBtn.textContent = selCount > 0 ? `Apply to Selected (${selCount})` : 'Apply to Filtered';
            const bulkDdBtn = document.getElementById('bp-bulk-dd-btn');
            if (bulkDdBtn) bulkDdBtn.textContent = selCount > 0 ? `Bulk Adjust (${selCount}) ▾` : 'Bulk Adjust ▾';
            const clearSelBtn = document.getElementById('bp-clear-sel');
            if (clearSelBtn) {
                clearSelBtn.style.display = selCount > 0 ? 'inline-flex' : 'none';
                clearSelBtn.textContent = `Clear Selection (${selCount})`;
            }

            const selAll = document.getElementById('bp-select-all');
            if (selAll) {
                const visibleSelected = visibleList.filter((p) => selectedBarcodes.has(p.barcode)).length;
                selAll.checked = visibleList.length > 0 && visibleSelected === visibleList.length;
                selAll.indeterminate = visibleSelected > 0 && visibleSelected < visibleList.length;
            }
        }

        function drawProducts() {
            const list = getFiltered();
            const tbody = document.getElementById('bp-prod-body');
            const pager = document.getElementById('bp-pager');
            document.querySelectorAll('#bp-prod-head th[data-bp-col]').forEach((th) => {
                const k = th.getAttribute('data-bp-col');
                th.style.display = bpHiddenCols.has(k) ? 'none' : '';
                const ind = th.querySelector('.bp-sort-ind');
                if (ind) ind.textContent = bpSortKey === k ? (bpSortDir === 1 ? '▲' : '▼') : '';
            });
            const visColSpan = 1 + BP_COLS.filter((c) => !bpHiddenCols.has(c.key)).length;
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="${visColSpan}" style="text-align:center;padding:28px;color:var(--muted,#64748b);">${changedOnly ? 'No pending price changes yet.' : 'No products match your filter.'}</td></tr>`;
                if (pager) pager.innerHTML = '<span>Showing 0 of 0</span>';
                syncStats(list);
                return;
            }
            const effSize = bpPageSize === 'all' ? list.length : Number(bpPageSize || 25);
            const totalPages = Math.max(1, Math.ceil(list.length / effSize));
            if (bpPage > totalPages) bpPage = totalPages;
            const startIdx = (bpPage - 1) * effSize;
            const pageSlice = list.slice(startIdx, startIdx + effSize);

            tbody.innerHTML = pageSlice.map((p) => {
                const diff = Number((p.new_price - p.old_price).toFixed(2));
                const isChanged = Math.abs(diff) > 0.004;
                const isSelected = selectedBarcodes.has(p.barcode);
                const pctChange = p.old_price > 0 ? ((diff / p.old_price) * 100).toFixed(1) : '0.0';
                const marginPct = p.cost_price > 0 ? (((p.new_price - p.cost_price) / p.cost_price) * 100).toFixed(1) : null;
                const marginColor = marginPct !== null ? (Number(marginPct) < 0 ? '#dc2626' : '#15803d') : 'var(--muted,#64748b)';
                const diffHtml = isChanged
                    ? `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:${diff > 0 ? '#dcfce7' : '#fee2e2'};color:${diff > 0 ? '#15803d' : '#dc2626'};">${diff > 0 ? '+' : ''}${esc(fmt(diff))} (${diff > 0 ? '+' : ''}${pctChange}%)</span>`
                    : `<span style="color:var(--muted,#64748b);">—</span>`;
                const rowBg = isChanged ? '#fffbeb' : (isSelected ? '#eff6ff' : '');
                const hide = (k) => (bpHiddenCols.has(k) ? 'display:none;' : '');
                return `
                    <tr data-bp-bc="${esc(p.barcode)}" style="border-bottom:1px solid var(--edge,#f1f5f9);${rowBg ? 'background:' + rowBg + ';' : ''}">
                        <td style="text-align:center;padding:10px;">
                            <input type="checkbox" class="bp-row-chk" data-bp-bc="${esc(p.barcode)}" ${isSelected ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--brand,#273990);cursor:pointer;">
                        </td>
                        <td style="${hide('barcode')}padding:10px 14px;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted,#64748b);">${esc(p.barcode)}</td>
                        <td style="${hide('name')}padding:10px 14px;">
                            <div style="font-weight:600;color:var(--ink,#0f172a);">${esc(p.name)}</div>
                            ${p.brand ? `<div style="font-size:11.5px;color:var(--muted,#64748b);">${esc(p.brand)}</div>` : ''}
                        </td>
                        <td style="${hide('category')}padding:10px 14px;color:var(--ink-2,#334155);">${esc(p.category || '—')}</td>
                        <td style="${hide('cost_price')}padding:10px 14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted,#64748b);">${esc(fmt(p.cost_price))}</td>
                        <td style="${hide('margin')}padding:10px 14px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${marginColor};">${marginPct !== null ? marginPct + '%' : '—'}</td>
                        <td style="${hide('old_price')}padding:10px 14px;text-align:right;font-variant-numeric:tabular-nums;">${esc(fmt(p.old_price))}</td>
                        <td style="${hide('new_price')}padding:10px 14px;text-align:right;">
                            <input type="number" step="0.01" min="0" class="okw-input bp-row-price" data-bp-bc="${esc(p.barcode)}" value="${p.new_price.toFixed(2)}" style="width:128px;height:34px;text-align:right;font-weight:700;box-sizing:border-box;">
                        </td>
                        <td style="${hide('change')}padding:10px 14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;">${diffHtml}</td>
                    </tr>`;
            }).join('');

            if (pager) {
                const fromN = startIdx + 1;
                const toN = startIdx + pageSlice.length;
                pager.innerHTML = `
                    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span>Showing ${fromN}–${toN} of ${list.length}</span>
                        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;">
                            Rows:
                            <select id="bp-page-size" class="okw-select" style="height:30px;padding:0 8px;font-size:12.5px;width:auto;">
                                <option value="25"${String(bpPageSize) === '25' ? ' selected' : ''}>25</option>
                                <option value="50"${String(bpPageSize) === '50' ? ' selected' : ''}>50</option>
                                <option value="100"${String(bpPageSize) === '100' ? ' selected' : ''}>100</option>
                                <option value="all"${String(bpPageSize) === 'all' ? ' selected' : ''}>All</option>
                            </select>
                        </label>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <button type="button" id="bp-prev-page" class="okw-btn okw-btn-outline" style="height:32px;padding:0 12px;font-size:12.5px;" ${bpPage <= 1 ? 'disabled' : ''}>Prev</button>
                        <span style="font-size:12.5px;font-weight:600;color:var(--ink,#0f172a);">Page ${bpPage} / ${totalPages}</span>
                        <button type="button" id="bp-next-page" class="okw-btn okw-btn-outline" style="height:32px;padding:0 12px;font-size:12.5px;" ${bpPage >= totalPages ? 'disabled' : ''}>Next</button>
                    </div>
                `;
                pager.querySelector('#bp-prev-page').onclick = () => { if (bpPage > 1) { bpPage--; drawProducts(); } };
                pager.querySelector('#bp-next-page').onclick = () => { if (bpPage < totalPages) { bpPage++; drawProducts(); } };
                pager.querySelector('#bp-page-size').onchange = (ev) => {
                    bpPageSize = ev.target.value === 'all' ? 'all' : Number(ev.target.value);
                    bpPage = 1;
                    drawProducts();
                };
            }
            syncStats(list);
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.bp-dd-menu').forEach((m) => { m.style.display = 'none'; });
        }
        function wireDropdown(btnId, menuId) {
            const btn = document.getElementById(btnId);
            const menu = document.getElementById(menuId);
            if (!btn || !menu) return;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const open = menu.style.display === 'block';
                closeAllDropdowns();
                menu.style.display = open ? 'none' : 'block';
            });
            menu.addEventListener('click', (e) => e.stopPropagation());
        }
        wireDropdown('bp-actions-dd-btn', 'bp-actions-dd-menu');
        wireDropdown('bp-filter-dd-btn', 'bp-filter-dd-menu');
        wireDropdown('bp-bulk-dd-btn', 'bp-bulk-dd-menu');
        wireDropdown('bp-cols-dd-btn', 'bp-cols-dd-menu');
        document.querySelectorAll('.bp-col-toggle').forEach((cb) => {
            cb.addEventListener('change', () => {
                const k = cb.getAttribute('data-col-key');
                if (cb.checked) bpHiddenCols.delete(k);
                else bpHiddenCols.add(k);
                drawProducts();
            });
        });
        document.querySelectorAll('#bp-prod-head th[data-bp-sort]').forEach((th) => {
            th.addEventListener('click', () => {
                const k = th.getAttribute('data-bp-sort');
                if (bpSortKey === k) bpSortDir *= -1;
                else { bpSortKey = k; bpSortDir = 1; }
                bpPage = 1;
                drawProducts();
            });
        });
        const actMenu = document.getElementById('bp-actions-dd-menu');
        if (actMenu) actMenu.addEventListener('click', (e) => {
            if (e.target.closest('button, a')) closeAllDropdowns();
        });
        if (window._bpDocClick) document.removeEventListener('click', window._bpDocClick);
        window._bpDocClick = () => closeAllDropdowns();
        document.addEventListener('click', window._bpDocClick);

        document.getElementById('bp-search').addEventListener('input', drawProducts);
        document.getElementById('bp-cat').addEventListener('change', drawProducts);
        document.getElementById('bp-brand').addEventListener('change', drawProducts);
        document.getElementById('bp-toggle-changed').addEventListener('change', (e) => {
            changedOnly = e.target.checked;
            drawProducts();
        });
        document.getElementById('bp-clear-filters').addEventListener('click', () => {
            document.getElementById('bp-cat').value = '';
            document.getElementById('bp-brand').value = '';
            changedOnly = false;
            drawProducts();
            closeAllDropdowns();
        });

        document.getElementById('bp-select-all').addEventListener('change', (e) => {
            const checked = e.target.checked;
            getFiltered().forEach((p) => {
                if (checked) selectedBarcodes.add(p.barcode);
                else selectedBarcodes.delete(p.barcode);
            });
            drawProducts();
        });

        document.getElementById('bp-clear-sel').onclick = () => {
            selectedBarcodes.clear();
            drawProducts();
        };

        document.getElementById('bp-prod-body').addEventListener('change', (e) => {
            const chk = e.target.closest('.bp-row-chk');
            if (chk) {
                const bc = chk.getAttribute('data-bp-bc');
                if (chk.checked) selectedBarcodes.add(bc);
                else selectedBarcodes.delete(bc);
                drawProducts();
                return;
            }
            const inp = e.target.closest('.bp-row-price');
            if (!inp) return;
            const bc = inp.getAttribute('data-bp-bc');
            const prod = products.find((p) => p.barcode === bc);
            const val = parseFloat(inp.value);
            if (prod && Number.isFinite(val) && val >= 0) {
                prod.new_price = Number(val.toFixed(2));
                drawProducts();
            }
        });

        function getTargetItems() {
            if (selectedBarcodes.size > 0) {
                return products.filter((p) => selectedBarcodes.has(p.barcode));
            }
            return getFiltered();
        }

        document.getElementById('bp-bulk-calc').onclick = () => {
            const val = parseFloat(document.getElementById('bp-val').value);
            if (!Number.isFinite(val) || val === 0) {
                return OkwUI.toast('Enter a non-zero percentage or amount', 'warning');
            }
            const mode = document.getElementById('bp-mode').value;
            const step = parseFloat(document.getElementById('bp-round').value) || 0.01;
            const targets = getTargetItems();
            targets.forEach((p) => {
                const raw = mode === 'percent' ? p.old_price * (1 + val / 100) : p.old_price + val;
                const rounded = step > 0.01 ? Math.round(raw / step) * step : raw;
                p.new_price = Number(Math.max(0, rounded).toFixed(2));
            });
            drawProducts();
            closeAllDropdowns();
            OkwUI.toast(`Previewed update for ${targets.length} ${selectedBarcodes.size > 0 ? 'selected' : 'filtered'} product(s). Click Save Changes to apply.`, 'success');
        };

        document.getElementById('bp-reset').onclick = () => {
            products.forEach((p) => { p.new_price = p.old_price; });
            selectedBarcodes.clear();
            document.getElementById('bp-val').value = '';
            changedOnly = false;
            drawProducts();
        };

        function printUpdatePriceSheet(orientation) {
            const items = getTargetItems();
            if (!items.length) return OkwUI.toast('No products to print', 'warning');
            const visCols = BP_COLS.filter((c) => !bpHiddenCols.has(c.key)).map((c) => ({
                key: c.key,
                label: c.label,
                numeric: Boolean(c.numeric)
            }));
            const rows = items.map((p) => {
                const diff = Number((p.new_price - p.old_price).toFixed(2));
                const marginPct = p.cost_price > 0 ? (((p.new_price - p.cost_price) / p.cost_price) * 100).toFixed(1) + '%' : '—';
                return {
                    barcode: p.barcode,
                    name: p.brand ? `${p.name} (${p.brand})` : p.name,
                    category: p.category || '—',
                    cost_price: fmt(p.cost_price),
                    margin: marginPct,
                    old_price: fmt(p.old_price),
                    new_price: fmt(p.new_price),
                    change: Math.abs(diff) > 0.004 ? `${diff > 0 ? '+' : ''}${fmt(diff)}` : '—'
                };
            });
            const title = selectedBarcodes.size > 0
                ? `Product Price Sheet (${items.length} Selected)`
                : 'Product Price Sheet';
            if (window.OkwUI && typeof OkwUI.printRowsList === 'function') {
                OkwUI.printRowsList(visCols, rows, title, orientation || 'portrait');
            } else {
                window.print();
            }
        }
        document.getElementById('bp-print').onclick = () => printUpdatePriceSheet('portrait');
        const bpPrintLand = document.getElementById('bp-print-land');
        if (bpPrintLand) bpPrintLand.onclick = () => printUpdatePriceSheet('landscape');

        document.getElementById('bp-export-xlsx').onclick = () => {
            const rows = getTargetItems().map((p) => ({
                'SKU': p.barcode,
                'Product Name': p.name,
                'Category': p.category,
                'Brand': p.brand,
                'Cost Price': p.cost_price,
                'Current Price': p.old_price,
                'New Price': p.new_price
            }));
            if (typeof XLSX !== 'undefined') {
                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Product Prices');
                XLSX.writeFile(wb, `product-prices-${new Date().toISOString().slice(0, 10)}.xlsx`);
            } else {
                const cols = Object.keys(rows[0] || {});
                const csv = [cols.join(',')].concat(rows.map((r) => cols.map((c) => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(','))).join('\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
                a.download = `product-prices-${new Date().toISOString().slice(0, 10)}.csv`;
                a.click();
            }
        };

        const importInput = document.getElementById('bp-import-file');
        document.getElementById('bp-import-btn').onclick = () => importInput.click();
        importInput.onchange = async () => {
            const file = importInput.files && importInput.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') {
                return OkwUI.toast('Excel parser is still loading, try again in a second', 'warning');
            }
            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const imported = XLSX.utils.sheet_to_json(sheet);
                let matched = 0;
                for (const row of imported) {
                    const sku = String(row['SKU'] || row['Barcode'] || row['barcode'] || row['sku'] || '').trim();
                    const np = parseFloat(row['New Price'] ?? row['Selling Price'] ?? row['Price'] ?? row['price']);
                    if (!sku || !Number.isFinite(np) || np < 0) continue;
                    const prod = products.find((p) => p.barcode === sku);
                    if (prod) {
                        prod.new_price = Number(np.toFixed(2));
                        matched++;
                    }
                }
                drawProducts();
                OkwUI.toast(`Loaded ${matched} updated price(s) from file. Review and click Save Changes.`, 'success');
            } catch (err) {
                OkwUI.toast('Failed to read spreadsheet file', 'danger');
            } finally {
                importInput.value = '';
            }
        };

        document.getElementById('bp-apply').onclick = async () => {
            const changed = getChangedItems();
            if (!changed.length) return;
            const btn = document.getElementById('bp-apply');
            btn.disabled = true;
            const reason = document.getElementById('bp-reason').value.trim() || 'Price update';
            try {
                const r = await fetch('/api/prices/bulk-apply', {
                    method: 'POST', headers, credentials: 'include',
                    body: JSON.stringify({ items: changed, reason })
                });
                if (!r.ok) {
                    const err = await r.json().catch(() => ({}));
                    throw new Error(err.message || 'Price update failed');
                }
                OkwUI.toast(`Updated ${changed.length} product price(s)`, 'success');
                renderPrices();
            } catch (err) {
                OkwUI.toast(err.message || 'Failed to save price changes', 'danger');
                syncStats(getFiltered());
            }
        };

        drawProducts();
    }

    async function renderGroups() {
        const [gRes, spgRes] = await Promise.all([
            fetch('/api/customer-groups', { headers }),
            fetch('/api/selling-price-groups', { headers })
        ]);
        const gData = await gRes.json().catch(() => ({}));
        const spgData = await spgRes.json().catch(() => ({}));
        const allGroups = gData.groups || [];
        const priceGroups = spgData.price_groups || [];
        const panel = document.getElementById('cat-panel');
        const actionsHost = document.getElementById('cat-page-actions');
        const esc = (v) => OkwUI.escapeHtml(v == null ? '' : String(v));

        if (actionsHost) {
            actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="btnAddCustomerGroup">+ Add Customer Group</button>`;
        }

        panel.innerHTML = `
            <div style="margin-bottom:16px;">
                <input type="search" id="cg-search" class="okw-input" placeholder="Search customer groups..." style="width:100%;height:42px;padding:0 14px;border-radius:8px;font-size:14px;">
            </div>
            <div style="overflow-x:auto;">
                <table data-no-table-tools="1" style="width:100%;border-collapse:collapse;font-size:13.5px;">
                    <thead>
                        <tr>
                            <th style="text-align:left;padding:10px 12px;">Customer Group Name</th>
                            <th style="text-align:right;padding:10px 12px;">Calculation Percentage (%)</th>
                            <th style="text-align:left;padding:10px 12px;">Selling Price Group</th>
                            <th style="text-align:right;padding:10px 12px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cg-tbody"></tbody>
                </table>
            </div>
            <div id="cg-footer" style="margin-top:12px;font-size:13px;color:var(--muted,#64748b);"></div>
        `;

        function drawRows(query = '') {
            const q = String(query || '').trim().toLowerCase();
            const list = q
                ? allGroups.filter((g) =>
                    String(g.name || '').toLowerCase().includes(q) ||
                    String(g.selling_price_group_name || g.price_group || '').toLowerCase().includes(q))
                : allGroups;
            const tbody = document.getElementById('cg-tbody');
            const footer = document.getElementById('cg-footer');
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:28px;color:var(--muted,#64748b);">No data available in table</td></tr>`;
                footer.textContent = 'Showing 0 to 0 of 0 entries';
                return;
            }
            tbody.innerHTML = list.map((g) => {
                const isSpg = g.price_calculation_type === 'selling_price_group';
                const pctDisplay = isSpg ? '—' : `${Number(g.discount_pct || 0)}%`;
                const spgDisplay = isSpg
                    ? (g.selling_price_group_name || '—')
                    : (g.selling_price_group_name || '—');
                return `
                    <tr>
                        <td style="padding:11px 12px;font-weight:600;">${esc(g.name)}</td>
                        <td style="padding:11px 12px;text-align:right;font-variant-numeric:tabular-nums;">${esc(pctDisplay)}</td>
                        <td style="padding:11px 12px;">${esc(spgDisplay)}</td>
                        <td style="padding:11px 12px;text-align:right;white-space:nowrap;">
                            <button type="button" class="okw-btn okw-btn-outline" data-cg-edit="${g.id}" style="height:30px;padding:0 10px;font-size:12px;margin-right:6px;">Edit</button>
                            <button type="button" class="okw-btn okw-btn-outline" data-cg-del="${g.id}" style="height:30px;padding:0 10px;font-size:12px;color:#dc2626;border-color:#fecaca;">Delete</button>
                        </td>
                    </tr>`;
            }).join('');
            footer.textContent = `Showing 1 to ${list.length} of ${list.length} ${list.length === 1 ? 'entry' : 'entries'}`;
        }

        function openCustomerGroupModal(existing = null) {
            const prev = document.getElementById('okw-cg-modal');
            if (prev) prev.remove();
            const isEdit = Boolean(existing);
            const initType = (existing && existing.price_calculation_type === 'selling_price_group') ? 'selling_price_group' : 'percentage';

            const backdrop = document.createElement('div');
            backdrop.id = 'okw-cg-modal';
            backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(11,16,23,0.6);backdrop-filter:blur(2px);z-index:10060;display:flex;align-items:center;justify-content:center;padding:16px;';
            backdrop.innerHTML = `
                <div role="dialog" aria-modal="true" style="background:var(--sheet,#fff);color:var(--ink,#0f172a);border:1px solid var(--edge,#e2e8f0);border-radius:12px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(0,0,0,0.25);overflow:hidden;">
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--edge,#e2e8f0);background:var(--frame,#f8fafc);">
                        <h3 style="margin:0;font-size:16px;font-weight:700;">${isEdit ? 'Edit Customer Group' : 'Add Customer Group'}</h3>
                        <button type="button" id="cgm-close" aria-label="Close" style="border:0;background:transparent;font-size:20px;line-height:1;color:var(--muted,#64748b);cursor:pointer;">&times;</button>
                    </div>
                    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px;">
                        <div style="display:flex;flex-direction:column;gap:5px;">
                            <label for="cgm-name" style="font-size:12.5px;font-weight:600;">Customer Group Name:*</label>
                            <input type="text" id="cgm-name" class="okw-input" placeholder="e.g. Wholesale, VIP, Contractors" value="${esc(existing ? existing.name : '')}" required>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:5px;">
                            <label for="cgm-type" style="font-size:12.5px;font-weight:600;">Price calculation type:</label>
                            <select id="cgm-type" class="okw-select">
                                <option value="percentage"${initType === 'percentage' ? ' selected' : ''}>Percentage</option>
                                <option value="selling_price_group"${initType === 'selling_price_group' ? ' selected' : ''}>Selling Price Group</option>
                            </select>
                        </div>
                        <div id="cgm-pct-wrap" style="display:${initType === 'percentage' ? 'flex' : 'none'};flex-direction:column;gap:5px;">
                            <label for="cgm-pct" style="font-size:12.5px;font-weight:600;">Calculation Percentage (%):</label>
                            <input type="number" id="cgm-pct" class="okw-input" step="0.01" placeholder="e.g. 5 or -10" value="${esc(existing ? existing.discount_pct : '')}">
                        </div>
                        <div id="cgm-spg-wrap" style="display:${initType === 'selling_price_group' ? 'flex' : 'none'};flex-direction:column;gap:5px;">
                            <label for="cgm-spg" style="font-size:12.5px;font-weight:600;">Selling Price Group:</label>
                            <select id="cgm-spg" class="okw-select">
                                <option value="">-- Select Selling Price Group --</option>
                                ${priceGroups.map((pg) => `<option value="${pg.id}"${existing && String(existing.selling_price_group_id) === String(pg.id) ? ' selected' : ''}>${esc(pg.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--edge,#e2e8f0);background:var(--frame,#f8fafc);">
                        <button type="button" class="okw-btn okw-btn-outline" id="cgm-cancel">Close</button>
                        <button type="button" class="okw-btn okw-btn-primary" id="cgm-save">${isEdit ? 'Update' : 'Save'}</button>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);

            const close = () => backdrop.remove();
            backdrop.querySelector('#cgm-close').onclick = close;
            backdrop.querySelector('#cgm-cancel').onclick = close;
            backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) close(); });

            backdrop.querySelector('#cgm-type').onchange = (e) => {
                const isSpg = e.target.value === 'selling_price_group';
                backdrop.querySelector('#cgm-pct-wrap').style.display = isSpg ? 'none' : 'flex';
                backdrop.querySelector('#cgm-spg-wrap').style.display = isSpg ? 'flex' : 'none';
            };

            backdrop.querySelector('#cgm-save').onclick = async () => {
                const name = backdrop.querySelector('#cgm-name').value.trim();
                if (!name) return OkwUI.toast('Customer Group Name is required', 'warning');
                const calcType = backdrop.querySelector('#cgm-type').value;
                const payload = {
                    name,
                    price_calculation_type: calcType,
                    discount_pct: calcType === 'percentage' ? Number(backdrop.querySelector('#cgm-pct').value || 0) : 0,
                    selling_price_group_id: calcType === 'selling_price_group' ? (backdrop.querySelector('#cgm-spg').value || null) : null
                };
                const url = isEdit ? `/api/customer-groups/${existing.id}` : '/api/customer-groups';
                const method = isEdit ? 'PUT' : 'POST';
                const r = await fetch(url, { method, headers, body: JSON.stringify(payload) });
                if (r.ok) {
                    close();
                    OkwUI.toast(isEdit ? 'Customer group updated' : 'Customer group saved', 'success');
                    renderGroups();
                } else {
                    const err = await r.json().catch(() => ({}));
                    OkwUI.toast(err.message || 'Failed to save customer group', 'danger');
                }
            };
        }

        const addBtn = document.getElementById('btnAddCustomerGroup');
        if (addBtn) addBtn.onclick = () => openCustomerGroupModal(null);

        document.getElementById('cg-search').addEventListener('input', (e) => drawRows(e.target.value));
        document.getElementById('cg-tbody').addEventListener('click', async (e) => {
            const editBtn = e.target.closest('[data-cg-edit]');
            if (editBtn) {
                const grp = allGroups.find((g) => String(g.id) === editBtn.getAttribute('data-cg-edit'));
                if (grp) openCustomerGroupModal(grp);
                return;
            }
            const delBtn = e.target.closest('[data-cg-del]');
            if (delBtn) {
                const id = delBtn.getAttribute('data-cg-del');
                const r = await fetch(`/api/customer-groups/${id}`, { method: 'DELETE', headers });
                if (r.ok) {
                    OkwUI.toast('Customer group deleted', 'success');
                    renderGroups();
                } else {
                    OkwUI.toast('Failed to delete customer group', 'danger');
                }
            }
        });

        drawRows('');
    }

    async function renderVariations() {
        const res = await fetch('/api/variations', { headers });
        const d = await res.json().catch(() => ({}));
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="v-open-add">+ Add Variation</button>`;
        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `<div id="vars-tbl"></div>`;
        OkwUI.dataTable('#vars-tbl', {
            columns: [
                { key: 'name', label: 'Variation Name' },
                { key: 'values_text', label: 'Values' },
                { key: 'id', label: 'Actions', render: (v) => `<button type="button" class="okw-btn okw-btn-outline" data-del-var="${v}" style="height:28px;padding:0 10px;font-size:12px;">Delete</button>` }
            ],
            rows: d.variations || []
        });
        const addBtn = document.getElementById('v-open-add');
        if (addBtn) addBtn.onclick = () => openSimpleModal({
            title: 'Add Variation',
            fields: [
                { id: 'name', label: 'Variation Name', placeholder: 'e.g. Size, Color, Grade', required: true },
                { id: 'values_text', label: 'Values (comma-separated)', placeholder: 'e.g. 1-inch, 2-inch, 3-inch' }
            ],
            onSave: async (v) => {
                const r = await fetch('/api/variations', { method: 'POST', headers, body: JSON.stringify(v) });
                if (r.ok) { OkwUI.toast('Variation saved', 'success'); renderVariations(); return true; }
                OkwUI.toast('Failed to save variation', 'danger');
                return false;
            }
        });
        panel.querySelectorAll('[data-del-var]').forEach(btn => {
            btn.onclick = async () => {
                const r = await fetch(`/api/variations/${btn.dataset.delVar}`, { method: 'DELETE', headers });
                if (r.ok) { OkwUI.toast('Variation deleted', 'success'); renderVariations(); }
            };
        });
    }

    async function renderPriceGroups() {
        const res = await fetch('/api/selling-price-groups', { headers });
        const d = await res.json().catch(() => ({}));
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="spg-open-add">+ Add Selling Price Group</button>`;
        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `<div id="spg-tbl"></div>`;
        OkwUI.dataTable('#spg-tbl', {
            columns: [
                { key: 'name', label: 'Selling Price Group' },
                { key: 'adjustment_pct', label: 'Adjustment %', numeric: true, render: (v) => `${Number(v || 0)}%` },
                { key: 'description', label: 'Description' },
                { key: 'id', label: 'Actions', render: (v) => `<button type="button" class="okw-btn okw-btn-outline" data-del-spg="${v}" style="height:28px;padding:0 10px;font-size:12px;">Delete</button>` }
            ],
            rows: d.price_groups || []
        });
        const addBtn = document.getElementById('spg-open-add');
        if (addBtn) addBtn.onclick = () => openSimpleModal({
            title: 'Add Selling Price Group',
            fields: [
                { id: 'name', label: 'Price Group Name', placeholder: 'e.g. Wholesale, Contractor', required: true },
                { id: 'adjustment_pct', label: 'Adjustment (%)', type: 'number', step: '0.1', placeholder: 'e.g. -5 or 10' },
                { id: 'description', label: 'Description', placeholder: 'Optional description' }
            ],
            onSave: async (v) => {
                const r = await fetch('/api/selling-price-groups', { method: 'POST', headers, body: JSON.stringify(v) });
                if (r.ok) { OkwUI.toast('Price group saved', 'success'); renderPriceGroups(); return true; }
                OkwUI.toast('Failed to save price group', 'danger');
                return false;
            }
        });
        panel.querySelectorAll('[data-del-spg]').forEach(btn => {
            btn.onclick = async () => {
                const r = await fetch(`/api/selling-price-groups/${btn.dataset.delSpg}`, { method: 'DELETE', headers });
                if (r.ok) { OkwUI.toast('Price group deleted', 'success'); renderPriceGroups(); }
            };
        });
    }

    async function renderWarranties() {
        const res = await fetch('/api/warranties', { headers });
        const d = await res.json().catch(() => ({}));
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = `<button type="button" class="okw-btn okw-btn-primary" id="w-open-add">+ Add Warranty</button>`;
        const panel = document.getElementById('cat-panel');
        panel.innerHTML = `<div id="war-tbl"></div>`;
        OkwUI.dataTable('#war-tbl', {
            columns: [
                { key: 'name', label: 'Warranty Name' },
                { key: 'duration', label: 'Duration', render: (v, row) => `${v} ${OkwUI.escapeHtml(row.duration_type || 'Months')}` },
                { key: 'description', label: 'Description' },
                { key: 'id', label: 'Actions', render: (v) => `<button type="button" class="okw-btn okw-btn-outline" data-del-war="${v}" style="height:28px;padding:0 10px;font-size:12px;">Delete</button>` }
            ],
            rows: d.warranties || []
        });
        const addBtn = document.getElementById('w-open-add');
        if (addBtn) addBtn.onclick = () => openSimpleModal({
            title: 'Add Warranty',
            fields: [
                { id: 'name', label: 'Warranty Name', placeholder: 'e.g. 1 Year Manufacturer', required: true },
                { id: 'duration', label: 'Duration', type: 'number', min: 1, value: '12', required: true },
                { id: 'duration_type', label: 'Duration Unit', type: 'select', options: [{ value: 'Days', label: 'Days' }, { value: 'Months', label: 'Months', selected: true }, { value: 'Years', label: 'Years' }] },
                { id: 'description', label: 'Description', placeholder: 'Optional terms' }
            ],
            onSave: async (v) => {
                const r = await fetch('/api/warranties', { method: 'POST', headers, body: JSON.stringify(v) });
                if (r.ok) { OkwUI.toast('Warranty saved', 'success'); renderWarranties(); return true; }
                OkwUI.toast('Failed to save warranty', 'danger');
                return false;
            }
        });
        panel.querySelectorAll('[data-del-war]').forEach(btn => {
            btn.onclick = async () => {
                const r = await fetch(`/api/warranties/${btn.dataset.delWar}`, { method: 'DELETE', headers });
                if (r.ok) { OkwUI.toast('Warranty deleted', 'success'); renderWarranties(); }
            };
        });
    }

    const TAB_META = {
        brands: {
            title: 'Brands',
            subtitle: 'Manage product brands, linked stock counts, and inventory value.'
        },
        units: {
            title: 'Units & Conversions',
            subtitle: 'Configure base units and pack-to-base selling conversions.'
        },
        prices: {
            title: 'Update Price',
            subtitle: 'Edit product prices inline, apply bulk percentage or fixed adjustments, or import/export spreadsheets.'
        },
        variations: {
            title: 'Variations',
            subtitle: 'Define reusable product variation attributes such as size, color, grade, or weight.'
        },
        price_groups: {
            title: 'Selling Price Groups',
            subtitle: 'Configure custom selling price tiers for retail, wholesale, and contractor buyers.'
        },
        warranties: {
            title: 'Warranties',
            subtitle: 'Manage product warranty durations and terms for hardware and equipment.'
        },
        groups: {
            title: 'Customer Groups',
            subtitle: 'Manage customer pricing tiers, default discounts, and project sites.'
        }
    };

    function switchTab(tab) {
        activeTab = tab;
        const meta = TAB_META[tab] || TAB_META.brands;
        const titleEl = document.getElementById('cat-page-title');
        const subEl = document.getElementById('cat-page-subtitle');
        if (titleEl) titleEl.textContent = meta.title;
        if (subEl) subEl.textContent = meta.subtitle;
        const actionsHost = document.getElementById('cat-page-actions');
        if (actionsHost) actionsHost.innerHTML = '';
        const panel = document.getElementById('cat-panel');
        if (panel) {
            panel.innerHTML = '<div class="okw-sk-stack" aria-hidden="true" style="padding:8px 4px;"><span class="okw-sk-bar" style="width:100%;height:38px;border-radius:8px;"></span><span class="okw-sk-bar" style="width:100%;height:14px;"></span><span class="okw-sk-bar" style="width:96%;height:14px;"></span><span class="okw-sk-bar" style="width:92%;height:14px;"></span><span class="okw-sk-bar" style="width:94%;height:14px;"></span></div>';
        }
        document.getElementById('cat-tabs').querySelectorAll('[data-ctab]').forEach(b => {
            b.className = b.dataset.ctab === tab ? 'okw-btn okw-btn-primary' : 'okw-btn okw-btn-outline';
        });
        if (tab === 'brands') renderBrands();
        else if (tab === 'units') renderUnits();
        else if (tab === 'prices') renderPrices();
        else if (tab === 'variations') renderVariations();
        else if (tab === 'price_groups') renderPriceGroups();
        else if (tab === 'warranties') renderWarranties();
        else renderGroups();
    }

    document.getElementById('cat-tabs').querySelectorAll('[data-ctab]').forEach(b => {
        b.onclick = () => switchTab(b.dataset.ctab);
    });
    const initTab = new URLSearchParams(window.location.search).get('tab');
    const validTabs = ['brands', 'units', 'prices', 'variations', 'price_groups', 'warranties', 'groups'];
    if (initTab && validTabs.includes(initTab)) {
        const tabsRow = document.getElementById('cat-tabs');
        if (tabsRow) tabsRow.style.display = 'none';
    }
    switchTab(validTabs.includes(initTab) ? initTab : 'brands');
})();
</script>
</body>
</html>
