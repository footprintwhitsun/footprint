<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money - OKWESIWA LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/vendor/xlsx-0.20.2.full.min.js" defer></script>
    <script src="/auth-guard.js"></script>
    <script src="/currency.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <link rel="stylesheet" href="/portal-skin.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA LTD"></div>
        <nav class="nav-links"></nav>
    </aside>

    <main class="main-content">
        <div class="page-wrap" id="hub"></div>
        <footer class="okw-hub-footer">© 2026 OKWESIWA LTD</footer>
    </main>
</div>

<script>
(function () {
    const token = () => localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
    const authHeaders = () => ({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() });
    const esc = OkwUI.escapeHtml;
    const fmt = (n) => (typeof formatCurrency === 'function' ? formatCurrency(n) : 'GH₵ ' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

    async function api(url, opts = {}) {
        const res = await fetch(url, { credentials: 'include', headers: authHeaders(), ...opts });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
    }

    function normalizeDate(val) {
        if (!val) return new Date().toISOString().slice(0, 10);
        if (typeof val === 'number' && val > 20000 && val < 80000) {
            const d = new Date(Math.round((val - 25569) * 86400 * 1000));
            return d.toISOString().slice(0, 10);
        }
        const s = String(val).trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
        const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        const parsed = new Date(s);
        return Number.isNaN(parsed.getTime()) ? new Date().toISOString().slice(0, 10) : parsed.toISOString().slice(0, 10);
    }

    function parseNum(val) {
        if (typeof val === 'number') return Number.isFinite(val) ? val : 0;
        const cleaned = String(val || '').replace(/[^0-9.\-]/g, '');
        const n = parseFloat(cleaned);
        return Number.isFinite(n) ? n : 0;
    }

    function mountCoa(panel) {
        panel.innerHTML = `
            <div class="okw-card okw-mb-16">
                <h2 class="okw-h2-sm">Add Ledger Account</h2>
                <div class="okw-grid-coa">
                    <input id="coa-code" class="okw-input" placeholder="Code (e.g. 1050)">
                    <input id="coa-name" class="okw-input" placeholder="Account name (e.g. Petty Cash)">
                    <select id="coa-type" class="okw-select">
                        <option value="Asset">Asset</option>
                        <option value="Liability">Liability</option>
                        <option value="Equity">Equity</option>
                        <option value="Revenue">Revenue</option>
                        <option value="Expense">Expense</option>
                    </select>
                    <button id="coa-add" class="okw-btn okw-btn-primary" type="button">+ Add Account</button>
                </div>
            </div>
            <div class="okw-card" id="coa-list"><div class="okw-empty">Loading Chart of Accounts...</div></div>`;

        async function load() {
            const host = panel.querySelector('#coa-list');
            try {
                const { accounts } = await api('/api/gl/accounts');
                host.innerHTML = `
                    <div class="okw-scroll-x">
                        <table class="okw-table okw-w-full">
                            <thead><tr><th>Code</th><th>Account Name</th><th>Type</th><th>Normal</th><th class="okw-num">Debits</th><th class="okw-num">Credits</th><th class="okw-num">Balance</th></tr></thead>
                            <tbody>
                                ${accounts.map(a => `
                                    <tr>
                                        <td><strong>${esc(a.code)}</strong></td>
                                        <td>${esc(a.name)}</td>
                                        <td>${OkwUI.badge(a.type, a.type === 'Asset' ? 'info' : (a.type === 'Revenue' ? 'success' : (a.type === 'Expense' ? 'warning' : 'neutral')))}</td>
                                        <td class="okw-cap-muted">${esc(a.normal_balance)}</td>
                                        <td class="okw-num">${fmt(a.total_debit)}</td>
                                        <td class="okw-num">${fmt(a.total_credit)}</td>
                                        <td class="okw-num"><strong>${fmt(a.balance)}</strong></td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } catch (e) {
                host.innerHTML = `<div class="okw-empty">${esc(e.message)}</div>`;
            }
        }

        panel.querySelector('#coa-add').onclick = async () => {
            try {
                await api('/api/gl/accounts', {
                    method: 'POST',
                    body: JSON.stringify({
                        code: panel.querySelector('#coa-code').value,
                        name: panel.querySelector('#coa-name').value,
                        type: panel.querySelector('#coa-type').value
                    })
                });
                OkwUI.toast('Account added', 'success');
                panel.querySelector('#coa-code').value = '';
                panel.querySelector('#coa-name').value = '';
                load();
            } catch (e) { OkwUI.toast(e.message, 'danger'); }
        };
        load();
    }

    function mountJournal(panel) {
        const today = new Date().toISOString().slice(0, 10);
        panel.innerHTML = `
            <div class="okw-card okw-mb-16">
                <h2 class="okw-h2-sm">Post Double-Entry Journal</h2>
                <div class="okw-grid-je-head">
                    <input id="je-date" type="date" class="okw-input" value="${today}">
                    <input id="je-ref" class="okw-input" placeholder="Reference (optional)">
                    <input id="je-memo" class="okw-input" placeholder="Memo / description">
                </div>
                <div id="je-lines" class="okw-je-lines"></div>
                <div class="okw-flex-between">
                    <button id="je-add-line" class="okw-btn okw-btn-outline" type="button">+ Add Line</button>
                    <div id="je-totals" class="okw-je-totals">Debits: GH₵ 0.00 · Credits: GH₵ 0.00</div>
                    <button id="je-post" class="okw-btn okw-btn-primary" type="button">Post Journal Entry</button>
                </div>
            </div>
            <div class="okw-card" id="je-list"><div class="okw-empty">Loading journal entries...</div></div>`;

        let accounts = [];
        function addLineRow() {
            const wrap = panel.querySelector('#je-lines');
            const row = document.createElement('div');
            row.className = 'je-line-row okw-grid-je-line';
            row.innerHTML = `
                <select class="okw-select je-acc">${accounts.map(a => `<option value="${a.id}">${esc(a.code + ' — ' + a.name)}</option>`).join('')}</select>
                <input class="okw-input je-desc" placeholder="Line memo">
                <input class="okw-input je-deb" type="number" step="0.01" min="0" placeholder="Debit">
                <input class="okw-input je-cred" type="number" step="0.01" min="0" placeholder="Credit">
                <button type="button" class="okw-btn okw-btn-outline je-rm">×</button>`;
            row.querySelector('.je-rm').onclick = () => { if (wrap.children.length > 2) { row.remove(); updateTotals(); } };
            row.querySelectorAll('.je-deb,.je-cred').forEach(inp => inp.addEventListener('input', updateTotals));
            wrap.appendChild(row);
        }

        function updateTotals() {
            let d = 0, c = 0;
            panel.querySelectorAll('.je-line-row').forEach(r => {
                d += Number(r.querySelector('.je-deb').value || 0);
                c += Number(r.querySelector('.je-cred').value || 0);
            });
            const bal = Math.abs(d - c) < 0.01 && d > 0;
            panel.querySelector('#je-totals').innerHTML = `Debits: ${fmt(d)} · Credits: ${fmt(c)} ${bal ? '<span class="okw-text-ok">✓ Balanced</span>' : '<span class="okw-text-bad">Out of balance</span>'}`;
        }

        async function load() {
            try {
                const [accData, jeData] = await Promise.all([api('/api/gl/accounts'), api('/api/gl/journal')]);
                accounts = accData.accounts || [];
                const wrap = panel.querySelector('#je-lines');
                if (!wrap.children.length) { addLineRow(); addLineRow(); }
                const host = panel.querySelector('#je-list');
                const entries = jeData.entries || [];
                if (!entries.length) { host.innerHTML = '<div class="okw-empty">No journal entries posted yet.</div>'; return; }
                host.innerHTML = entries.map(e => `
                    <div class="okw-je-entry">
                        <div class="okw-flex-between">
                            <strong>${esc(e.entry_number)} · ${esc(String(e.entry_date).slice(0, 10))}</strong>
                            <span class="okw-sub-note">${esc(e.reference || '')} ${e.memo ? '— ' + esc(e.memo) : ''} (${esc(e.source)})</span>
                        </div>
                        <table class="okw-table okw-w-full">
                            <tbody>
                                ${(e.lines || []).map(l => `
                                    <tr>
                                        <td>${esc(l.account_code + ' — ' + l.account_name)}</td>
                                        <td class="okw-sub-note">${esc(l.description || '')}</td>
                                        <td class="okw-num okw-w-130">${Number(l.debit) > 0 ? fmt(l.debit) : '—'}</td>
                                        <td class="okw-num okw-w-130">${Number(l.credit) > 0 ? fmt(l.credit) : '—'}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`).join('');
            } catch (e) { panel.querySelector('#je-list').innerHTML = `<div class="okw-empty">${esc(e.message)}</div>`; }
        }

        panel.querySelector('#je-add-line').onclick = addLineRow;
        panel.querySelector('#je-post').onclick = async () => {
            try {
                const lines = [...panel.querySelectorAll('.je-line-row')].map(r => ({
                    account_id: Number(r.querySelector('.je-acc').value),
                    description: r.querySelector('.je-desc').value,
                    debit: Number(r.querySelector('.je-deb').value || 0),
                    credit: Number(r.querySelector('.je-cred').value || 0)
                }));
                await api('/api/gl/journal', {
                    method: 'POST',
                    body: JSON.stringify({
                        entry_date: panel.querySelector('#je-date').value,
                        reference: panel.querySelector('#je-ref').value,
                        memo: panel.querySelector('#je-memo').value,
                        lines
                    })
                });
                OkwUI.toast('Journal entry posted', 'success');
                panel.querySelector('#je-ref').value = '';
                panel.querySelector('#je-memo').value = '';
                panel.querySelector('#je-lines').innerHTML = '';
                load();
                updateTotals();
            } catch (e) { OkwUI.toast(e.message, 'danger'); }
        };
        load();
    }

    function mountTrialBalance(panel) {
        const today = new Date().toISOString().slice(0, 10);
        panel.innerHTML = `
            <div class="okw-card okw-mb-16 okw-flex-row">
                <label class="okw-lbl-sm">As of Date:</label>
                <input id="tb-date" type="date" class="okw-input okw-w-180" value="${today}">
                <button id="tb-run" class="okw-btn okw-btn-primary" type="button">Refresh</button>
            </div>
            <div class="okw-kpi-row okw-mb-16" id="tb-bs-kpis"></div>
            <div class="okw-card" id="tb-table"><div class="okw-empty">Loading Trial Balance...</div></div>`;

        async function load() {
            const asOf = panel.querySelector('#tb-date').value;
            try {
                const d = await api('/api/gl/trial-balance?as_of=' + encodeURIComponent(asOf));
                const bs = d.balance_sheet || {};
                panel.querySelector('#tb-bs-kpis').innerHTML = [
                    OkwUI.kpiCard({ label: 'Total Assets', value: fmt(bs.assets), tone: 'info' }),
                    OkwUI.kpiCard({ label: 'Total Liabilities', value: fmt(bs.liabilities), tone: 'warning' }),
                    OkwUI.kpiCard({ label: 'Equity + Net Income', value: fmt(bs.equity), subtext: `Net Income: ${fmt(bs.net_income)}`, tone: 'success' }),
                    OkwUI.kpiCard({ label: 'Trial Balance', value: d.totals.balanced ? 'Balanced' : 'Unbalanced', subtext: `DR ${fmt(d.totals.debit)} / CR ${fmt(d.totals.credit)}`, tone: d.totals.balanced ? 'success' : 'danger' })
                ].join('');
                panel.querySelector('#tb-table').innerHTML = `
                    <div class="okw-scroll-x">
                        <table class="okw-table okw-w-full">
                            <thead><tr><th>Code</th><th>Account</th><th>Type</th><th class="okw-num">Debits</th><th class="okw-num">Credits</th><th class="okw-num">Net Balance</th></tr></thead>
                            <tbody>
                                ${(d.rows || []).map(r => `
                                    <tr>
                                        <td><strong>${esc(r.code)}</strong></td>
                                        <td>${esc(r.name)}</td>
                                        <td>${esc(r.type)}</td>
                                        <td class="okw-num">${fmt(r.debit)}</td>
                                        <td class="okw-num">${fmt(r.credit)}</td>
                                        <td class="okw-num"><strong>${fmt(r.net_balance)}</strong></td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } catch (e) { panel.querySelector('#tb-table').innerHTML = `<div class="okw-empty">${esc(e.message)}</div>`; }
        }
        panel.querySelector('#tb-run').onclick = load;
        load();
    }

    function mountReconcile(panel) {
        const today = new Date().toISOString().slice(0, 10);
        panel.innerHTML = `
            <div class="okw-card okw-mb-16">
                <div class="okw-flex-row okw-mb-16">
                    <label class="okw-lbl-sm">Bank / MoMo / Cash Account:</label>
                    <select id="rec-acc" class="okw-select okw-min-240"></select>
                </div>
                <div class="okw-grid-rec">
                    <input id="rec-date" type="date" class="okw-input" value="${today}">
                    <input id="rec-desc" class="okw-input" placeholder="Statement description">
                    <input id="rec-ref" class="okw-input" placeholder="Ref">
                    <input id="rec-amt" type="number" step="0.01" class="okw-input" placeholder="Amount (+/-)">
                    <button id="rec-add" class="okw-btn okw-btn-primary" type="button">+ Add Line</button>
                </div>
                <div class="okw-dropzone">
                    <div class="okw-flex-between">
                        <div>
                            <strong>Import Bank / MoMo Statement (CSV or Excel)</strong>
                            <div class="okw-sub-note">Upload a bank or MTN MoMo merchant export (.csv, .xlsx, .xls) and map the columns.</div>
                        </div>
                        <input id="rec-file" type="file" accept=".csv,.xlsx,.xls" class="okw-input">
                    </div>
                    <div id="rec-mapper" class="okw-hidden">
                        <div class="okw-grid-rec-map">
                            <div><label class="okw-lbl-sm">Date column</label><select id="map-date" class="okw-select okw-w-full"></select></div>
                            <div><label class="okw-lbl-sm">Description column</label><select id="map-desc" class="okw-select okw-w-full"></select></div>
                            <div><label class="okw-lbl-sm">Reference column</label><select id="map-ref" class="okw-select okw-w-full"></select></div>
                            <div><label class="okw-lbl-sm">Amount (+/-) column</label><select id="map-amt" class="okw-select okw-w-full"></select></div>
                            <div><label class="okw-lbl-sm">Or Credit (+) column</label><select id="map-credit" class="okw-select okw-w-full"></select></div>
                            <div><label class="okw-lbl-sm">And Debit (-) column</label><select id="map-debit" class="okw-select okw-w-full"></select></div>
                        </div>
                        <div id="rec-preview" class="okw-mt-12"></div>
                        <div class="okw-flex-row okw-mt-12">
                            <button id="rec-import-go" type="button" class="okw-btn okw-btn-primary">Import Statement Lines</button>
                            <button id="rec-import-cancel" type="button" class="okw-btn okw-btn-outline">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="okw-kpi-row okw-mb-16" id="rec-kpis"></div>
            <div class="okw-card" id="rec-list"><div class="okw-empty">Loading reconciliation...</div></div>`;

        let parsedRows = [];
        let parsedHeaders = [];

        function fillSelect(sel, headers, allowNone, matchRegex) {
            sel.innerHTML = (allowNone ? '<option value="">(None)</option>' : '') +
                headers.map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join('');
            const hit = headers.find(h => matchRegex.test(h));
            if (hit) sel.value = hit;
        }

        function buildMappedLines() {
            const dCol = panel.querySelector('#map-date').value;
            const descCol = panel.querySelector('#map-desc').value;
            const refCol = panel.querySelector('#map-ref').value;
            const amtCol = panel.querySelector('#map-amt').value;
            const crCol = panel.querySelector('#map-credit').value;
            const drCol = panel.querySelector('#map-debit').value;
            return parsedRows.map(r => {
                const desc = String(r[descCol] || '').trim();
                let amount = 0;
                if (amtCol && r[amtCol] !== undefined && r[amtCol] !== '') {
                    amount = parseNum(r[amtCol]);
                } else {
                    amount = parseNum(crCol ? r[crCol] : 0) - parseNum(drCol ? r[drCol] : 0);
                }
                return {
                    txn_date: normalizeDate(r[dCol]),
                    description: desc,
                    reference: refCol ? String(r[refCol] || '').trim() : '',
                    amount: Number(amount.toFixed(2))
                };
            }).filter(x => x.description && Number.isFinite(x.amount) && x.amount !== 0);
        }

        function renderPreview() {
            const lines = buildMappedLines();
            const previewEl = panel.querySelector('#rec-preview');
            const goBtn = panel.querySelector('#rec-import-go');
            goBtn.textContent = `Import ${lines.length} Statement Lines`;
            if (!lines.length) {
                previewEl.innerHTML = '<div class="okw-sub-note">No valid non-zero rows matched with the selected columns.</div>';
                return;
            }
            previewEl.innerHTML = `
                <div class="okw-sub-note">Preview (first ${Math.min(5, lines.length)} of ${lines.length} rows):</div>
                <div class="okw-scroll-x">
                    <table class="okw-table okw-w-full">
                        <thead><tr><th>Date</th><th>Description</th><th>Ref</th><th class="okw-num">Amount</th></tr></thead>
                        <tbody>${lines.slice(0, 5).map(l => `<tr><td>${esc(l.txn_date)}</td><td>${esc(l.description)}</td><td>${esc(l.reference || '—')}</td><td class="okw-num">${fmt(l.amount)}</td></tr>`).join('')}</tbody>
                    </table>
                </div>`;
        }

        panel.querySelector('#rec-file').addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') { OkwUI.toast('Spreadsheet parser is still loading, try again in a second', 'warning'); return; }
            try {
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                if (!rows.length) { OkwUI.toast('File has no data rows', 'warning'); return; }
                parsedRows = rows;
                parsedHeaders = Object.keys(rows[0]);
                fillSelect(panel.querySelector('#map-date'), parsedHeaders, false, /date|time/i);
                fillSelect(panel.querySelector('#map-desc'), parsedHeaders, false, /desc|narr|detail|memo|particular/i);
                fillSelect(panel.querySelector('#map-ref'), parsedHeaders, true, /ref|trans|id|cheque/i);
                fillSelect(panel.querySelector('#map-amt'), parsedHeaders, true, /^amount$|net|value/i);
                fillSelect(panel.querySelector('#map-credit'), parsedHeaders, true, /credit|deposit|inflow/i);
                fillSelect(panel.querySelector('#map-debit'), parsedHeaders, true, /debit|withdraw|outflow/i);
                panel.querySelector('#rec-mapper').classList.remove('okw-hidden');
                renderPreview();
            } catch (err) {
                OkwUI.toast('Could not read file: ' + err.message, 'danger');
            }
        });

        ['#map-date', '#map-desc', '#map-ref', '#map-amt', '#map-credit', '#map-debit'].forEach(id => {
            panel.querySelector(id).addEventListener('change', renderPreview);
        });

        panel.querySelector('#rec-import-cancel').onclick = () => {
            parsedRows = [];
            panel.querySelector('#rec-file').value = '';
            panel.querySelector('#rec-mapper').classList.add('okw-hidden');
        };

        panel.querySelector('#rec-import-go').onclick = async () => {
            const lines = buildMappedLines();
            if (!lines.length) { OkwUI.toast('No valid rows to import', 'warning'); return; }
            try {
                const out = await api('/api/gl/reconcile/import', {
                    method: 'POST',
                    body: JSON.stringify({ account_id: Number(panel.querySelector('#rec-acc').value), lines })
                });
                OkwUI.toast(`Imported ${out.inserted || lines.length} statement lines`, 'success');
                panel.querySelector('#rec-file').value = '';
                panel.querySelector('#rec-mapper').classList.add('okw-hidden');
                load();
            } catch (err) { OkwUI.toast(err.message, 'danger'); }
        };

        async function initAccounts() {
            const { accounts } = await api('/api/gl/accounts');
            const assetAccs = accounts.filter(a => a.type === 'Asset');
            const sel = panel.querySelector('#rec-acc');
            sel.innerHTML = assetAccs.map(a => `<option value="${a.id}">${esc(a.code + ' — ' + a.name)}</option>`).join('');
            sel.addEventListener('change', load);
            load();
        }

        async function load() {
            const accId = panel.querySelector('#rec-acc').value;
            if (!accId) return;
            try {
                const d = await api('/api/gl/reconcile?account_id=' + encodeURIComponent(accId));
                const s = d.summary || {};
                panel.querySelector('#rec-kpis').innerHTML = [
                    OkwUI.kpiCard({ label: 'Statement Total', value: fmt(s.statement_total), tone: 'info' }),
                    OkwUI.kpiCard({ label: 'Cleared / Matched', value: fmt(s.cleared_total), tone: 'success' }),
                    OkwUI.kpiCard({ label: 'GL Ledger Balance', value: fmt(s.ledger_balance), tone: 'primary' }),
                    OkwUI.kpiCard({ label: 'Difference', value: fmt(s.difference), tone: Math.abs(s.difference || 0) < 0.01 ? 'success' : 'warning' })
                ].join('');
                const rows = d.statement_lines || [];
                const host = panel.querySelector('#rec-list');
                if (!rows.length) { host.innerHTML = '<div class="okw-empty">No statement lines imported for this account yet.</div>'; return; }
                host.innerHTML = `
                    <div class="okw-scroll-x">
                        <table class="okw-table okw-w-full">
                            <thead><tr><th>Date</th><th>Description</th><th>Ref</th><th class="okw-num">Amount</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>
                                ${rows.map(r => `
                                    <tr>
                                        <td>${esc(String(r.txn_date).slice(0, 10))}</td>
                                        <td>${esc(r.description)}</td>
                                        <td>${esc(r.reference || '—')}</td>
                                        <td class="okw-num"><strong>${fmt(r.amount)}</strong></td>
                                        <td>${OkwUI.badge(r.status, r.status === 'matched' ? 'success' : 'warning')}</td>
                                        <td><button type="button" class="okw-btn okw-btn-outline rec-toggle" data-id="${r.id}">${r.status === 'matched' ? 'Unmatch' : 'Mark Matched'}</button></td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
                host.querySelectorAll('.rec-toggle').forEach(btn => {
                    btn.onclick = async () => {
                        await api(`/api/gl/reconcile/${btn.dataset.id}/toggle`, { method: 'POST' });
                        load();
                    };
                });
            } catch (e) { panel.querySelector('#rec-list').innerHTML = `<div class="okw-empty">${esc(e.message)}</div>`; }
        }

        panel.querySelector('#rec-add').onclick = async () => {
            try {
                await api('/api/gl/reconcile/import', {
                    method: 'POST',
                    body: JSON.stringify({
                        account_id: Number(panel.querySelector('#rec-acc').value),
                        txn_date: panel.querySelector('#rec-date').value,
                        description: panel.querySelector('#rec-desc').value,
                        reference: panel.querySelector('#rec-ref').value,
                        amount: Number(panel.querySelector('#rec-amt').value)
                    })
                });
                OkwUI.toast('Statement line added', 'success');
                panel.querySelector('#rec-desc').value = '';
                panel.querySelector('#rec-ref').value = '';
                panel.querySelector('#rec-amt').value = '';
                load();
            } catch (e) { OkwUI.toast(e.message, 'danger'); }
        };
        initAccounts().catch(() => {});
    }

    OkwUI.sectionPage({
        mount: '#hub',
        title: 'Money',
        subtitle: 'Expenses, cash accounts, and double-entry general ledger.',
        defaultId: 'expenses-list',
        sections: [
            { id: 'expenses-list', label: 'Expenses', group: 'Expenses & Cash', embed: '/expenses?tab=list' },
            { id: 'expenses-add', label: 'Add expense', group: 'Expenses & Cash', embed: '/expenses?tab=add' },
            { id: 'expenses-categories', label: 'Expense categories', group: 'Expenses & Cash', embed: '/expenses?tab=categories' },
            { id: 'cash', label: 'Account and cash', group: 'Expenses & Cash', embed: '/extras?tab=accounts' },
            { id: 'coa', label: 'Chart of Accounts', group: 'General Ledger', render: mountCoa },
            { id: 'journal', label: 'Journal Entries', group: 'General Ledger', render: mountJournal },
            { id: 'trial-balance', label: 'Trial Balance & Balance Sheet', group: 'General Ledger', render: mountTrialBalance },
            { id: 'reconcile', label: 'Bank Reconciliation', group: 'General Ledger', render: mountReconcile }
        ]
    });
})();
</script>
</body>
</html>
