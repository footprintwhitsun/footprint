<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Shift - OKWESIWA CO LTD</title>
    <link rel="icon" type="image/svg+xml" href="/okwesiwa-logo.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" media="print" data-media-swap>
    <link rel="stylesheet" href="/sidebar.css">
    <script src="/auth-guard.js"></script>
    <script src="/currency.js"></script>
    <script src="/telemetry-guard.js"></script>
    <script src="/instant-nav.js"></script>
    <script src="/layout.js"></script>
    <script src="/ui-components.js"></script>
    <link rel="stylesheet" href="/portal-skin.css">
    <style>
        .os-wrap { max-width: 820px; display: flex; flex-direction: column; gap: 18px; }
        .os-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .os-meta-card {
            background: var(--sheet, #fff);
            border: 1px solid var(--edge, #e2e8f0);
            border-radius: 12px;
            padding: 14px 16px;
        }
        .os-meta-lbl {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted, #64748b);
        }
        .os-meta-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink, #0f172a);
            margin-top: 5px;
        }
        .os-card {
            background: var(--sheet, #fff);
            border: 1px solid var(--edge, #e2e8f0);
            border-radius: 14px;
            padding: 24px;
        }
        .os-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
        .os-field label { font-size: 13px; font-weight: 600; color: var(--ink-2, #334155); }
        .os-cash-input {
            width: 100%;
            max-width: 360px;
            height: 58px;
            padding: 0 16px;
            border: 1.5px solid var(--edge-strong, #cbd5e1);
            border-radius: 10px;
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ink, #0f172a);
            background: var(--sheet, #fff);
            outline: none;
            box-sizing: border-box;
        }
        .os-cash-input:focus, .os-textarea:focus {
            border-color: var(--brand, #273990);
            box-shadow: 0 0 0 3px rgba(39, 57, 144, 0.12);
        }
        .os-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .os-chip {
            height: 30px;
            padding: 0 12px;
            border: 1px solid var(--edge-strong, #cbd5e1);
            border-radius: 999px;
            background: var(--frame, #f8fafc);
            color: var(--ink-2, #334155);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .os-chip:hover {
            border-color: var(--brand, #273990);
            color: var(--brand, #273990);
            background: #eff6ff;
        }
        .os-textarea {
            width: 100%;
            min-height: 88px;
            padding: 12px 14px;
            border: 1px solid var(--edge-strong, #cbd5e1);
            border-radius: 10px;
            font-family: var(--font-ui);
            font-size: 13.5px;
            color: var(--ink, #0f172a);
            background: var(--sheet, #fff);
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }
        .os-chk {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-2, #334155);
            cursor: pointer;
            user-select: none;
        }
        .os-chk input { width: 16px; height: 16px; accent-color: var(--brand, #273990); cursor: pointer; }
        .os-actions {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--edge, #e2e8f0);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .os-active-box {
            background: var(--sheet, #fff);
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            padding: 32px 24px;
            text-align: center;
            max-width: 560px;
        }
        @media (max-width: 700px) { .os-meta-grid { grid-template-columns: 1fr; } }
    </style>
    <script src="/okw-events.js"></script>
</head>
<body>
    <button class="mobile-menu-btn" data-onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" data-onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD"></div>
        <div class="nav-links"></div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-info">
                    <div id="userName"></div>
                    <div id="userRole"></div>
                </div>
            </div>
            <button class="sidebar-logout-btn" data-onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <main class="main-content">
        <div class="okw-page-header">
            <div class="okw-page-header-text">
                <h1 class="okw-page-title">Open Shift</h1>
                <p class="okw-page-subtitle">Count your starting cash drawer float and open your register to begin sales.</p>
            </div>
            <div class="okw-page-header-actions">
                <a href="/pos" class="okw-btn okw-btn-outline" style="text-decoration:none;"><i class="fas fa-cash-register"></i> Open POS</a>
            </div>
        </div>

        <div id="osAlreadyOpen" class="os-active-box" style="display:none;">
            <div style="font-size:44px;color:#15803d;margin-bottom:12px;"><i class="fas fa-check-circle"></i></div>
            <h3 style="margin:0 0 6px;font-size:18px;color:var(--ink,#0f172a);">Your Shift is Already Open</h3>
            <p id="osActiveSince" style="margin:0 0 18px;font-size:13.5px;color:var(--muted,#64748b);">You already have an active register shift.</p>
            <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
                <a href="/pos" class="okw-btn okw-btn-primary" style="text-decoration:none;"><i class="fas fa-cash-register"></i> Continue to POS</a>
                <a href="/close-shift" class="okw-btn okw-btn-outline" style="text-decoration:none;"><i class="fas fa-lock"></i> Close Shift</a>
            </div>
        </div>

        <div id="osMain" class="os-wrap">
            <section class="os-meta-grid">
                <div class="os-meta-card">
                    <div class="os-meta-lbl">Cashier / Staff</div>
                    <div id="osStaffName" class="os-meta-val"><span class="okw-sk-bar" style="width:120px;height:16px;"></span></div>
                </div>
                <div class="os-meta-card">
                    <div class="os-meta-lbl">Business Location</div>
                    <div id="osBranchName" class="os-meta-val"><span class="okw-sk-bar" style="width:110px;height:16px;"></span></div>
                </div>
                <div class="os-meta-card">
                    <div class="os-meta-lbl">Shift Date</div>
                    <div id="osDateNow" class="os-meta-val">—</div>
                </div>
            </section>

            <section class="os-card">
                <form id="openShiftForm" novalidate>
                    <div class="os-field">
                        <label for="startCash">Opening Cash Amount</label>
                        <input type="number" id="startCash" class="os-cash-input" step="0.01" min="0" placeholder="0.00" required>
                        <div class="os-presets">
                            <button type="button" class="os-chip" data-preset="0">0.00</button>
                            <button type="button" class="os-chip" data-preset="100">100.00</button>
                            <button type="button" class="os-chip" data-preset="200">200.00</button>
                            <button type="button" class="os-chip" data-preset="500">500.00</button>
                            <button type="button" class="os-chip" data-preset="1000">1,000.00</button>
                        </div>
                    </div>

                    <div class="os-field" style="margin-bottom:0;">
                        <label for="notes">Opening Notes (Optional)</label>
                        <textarea id="notes" class="os-textarea" placeholder="Add float breakdown or handover notes for this shift..."></textarea>
                    </div>

                    <div class="os-actions">
                        <label class="os-chk">
                            <input type="checkbox" id="optCustomerDisplay" checked>
                            Open Customer Display window
                        </label>
                        <button type="submit" id="btnOpenShift" class="okw-btn okw-btn-primary" style="height:44px;padding:0 24px;font-size:14.5px;"><i class="fas fa-play"></i> Start Shift &amp; Open POS</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script>
    (function () {
        function authHeaders(json = false) {
            const t = localStorage.getItem('authToken') || localStorage.getItem('token') || sessionStorage.getItem('token');
            const h = {};
            if (json) h['Content-Type'] = 'application/json';
            if (t && t !== 'null' && t !== 'undefined') h['Authorization'] = `Bearer ${t}`;
            return h;
        }

        let submitting = false;
        document.getElementById('osDateNow').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

        document.querySelectorAll('.os-chip[data-preset]').forEach((chip) => {
            chip.addEventListener('click', () => {
                document.getElementById('startCash').value = Number(chip.getAttribute('data-preset')).toFixed(2);
                document.getElementById('startCash').focus();
            });
        });

        async function bootstrap() {
            try {
                const res = await fetch('/api/session', { headers: authHeaders(), credentials: 'include' });
                if (!res.ok) {
                    (window.top || window).location.href = '/login';
                    return;
                }
                const data = await res.json();
                const user = data.user || {};
                const role = String(user.role || '').toLowerCase();
                if (!['super_admin', 'ceo', 'admin', 'manager', 'store_manager', 'cashier', 'teller'].includes(role)) {
                    (window.top || window).location.href = '/login';
                    return;
                }
                document.getElementById('osStaffName').textContent = user.name || user.username || 'Staff';
                document.getElementById('osBranchName').textContent = user.store_location || 'Main Branch';

                const shiftRes = await fetch('/api/shifts/active', { headers: authHeaders(), credentials: 'include' });
                if (shiftRes.ok) {
                    const sd = await shiftRes.json();
                    if (sd.active && sd.shift) {
                        const rawStart = sd.shift.start_time || sd.shift.opened_at;
                        const since = rawStart && !isNaN(new Date(rawStart)) ? `Started at ${new Date(rawStart).toLocaleString()}.` : 'You already have an active register shift.';
                        document.getElementById('osActiveSince').textContent = since;
                        document.getElementById('osMain').style.display = 'none';
                        document.getElementById('osAlreadyOpen').style.display = 'block';
                        return;
                    }
                }
                document.getElementById('startCash').focus();
            } catch (err) {
                (window.top || window).location.href = '/login';
            }
        }

        document.getElementById('openShiftForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (submitting) return;
            const rawCash = document.getElementById('startCash').value;
            if (rawCash === '' || Number.isNaN(parseFloat(rawCash)) || parseFloat(rawCash) < 0) {
                if (window.OkwUI && OkwUI.toast) OkwUI.toast('Enter a valid opening cash amount (0 or higher)', 'warning');
                document.getElementById('startCash').focus();
                return;
            }

            submitting = true;
            const btn = document.getElementById('btnOpenShift');
            btn.disabled = true;

            const launchDisplay = document.getElementById('optCustomerDisplay').checked;
            const customerWindow = launchDisplay
                ? window.open('/customer-display', 'CustomerDisplay', 'width=800,height=600,menubar=no,toolbar=no')
                : null;

            try {
                const res = await fetch('/api/shifts/open', {
                    method: 'POST',
                    headers: authHeaders(true),
                    credentials: 'include',
                    body: JSON.stringify({
                        startCash: parseFloat(rawCash) || 0,
                        notes: document.getElementById('notes').value.trim()
                    })
                });
                if (!res.ok) {
                    if (customerWindow) customerWindow.close();
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Failed to open shift');
                }
                (window.top || window).location.href = '/pos';
            } catch (err) {
                if (window.OkwUI && OkwUI.toast) OkwUI.toast(err.message || 'Could not open shift', 'danger');
                submitting = false;
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', bootstrap);
    })();
    </script>
</body>
</html>
