<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footprint | Sales Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
    <style>
        :root { 
            --primary-color: #273990; --accent-color: #f9a51a; 
            --secondary-color: #1c2b70; 
            --accent-color: #f9a51a; 
            --text-color: #202223; 
            --text-secondary: #6d7175;
            --gray-light: #f6f6f7; 
            --border-color: #e1e3e5;
            --sidebar-width: 260px; 
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); display: flex; flex-direction: column; min-height: 100vh; color: var(--text-color); }
        
        /* Main Content */
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 28px 36px; }
        
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-card { background: white; padding: 22px 24px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: var(--shadow-card); }
        .chart-card.full-width { grid-column: span 2; }
        h3 { color: var(--text-color); font-size: 16px; font-weight: 600; margin-bottom: 15px; }

        /* Footer */
        footer {
            margin-left: var(--sidebar-width);
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        /* Mobile Responsive Styles */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); z-index: 1000; transition: transform 0.3s ease; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; padding-top: 70px; }
            .mobile-menu-btn { display: block; }
            .overlay.active { display: block; }
            .charts-grid { grid-template-columns: 1fr; }
            .chart-card.full-width { grid-column: span 1; }
            footer { margin-left: 0; }
        }
    .user-profile-row { display: flex; align-items: center; gap: 10px; }
        
        .sidebar-logout-btn { margin-left: auto; flex-shrink: 0; background: none; border: none; color: rgba(255,255,255,0.65); cursor: pointer; padding: 7px; border-radius: 6px; font-size: 16px; line-height: 1; transition: color 0.2s ease, background 0.2s ease; } .sidebar-logout-btn:hover { color: white; background: rgba(220,53,69,0.6); }
        </style>
    <script src="currency.js"></script>
    <script src="telemetry-guard.js"></script>
    <script src="instant-nav.js"></script>
</head>
<body>
    <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand" style="display: flex; flex-direction: column; align-items: center;">
            <img src="logo.png" style="width: auto; max-width: 140px; height: 36px; border-radius: 6px; object-fit: contain; background: #ffffff; padding: 3px 8px; border: 1.5px solid #f9a51a;">
            
        </div>
        <div class="nav-links">
            <a href="dashboard" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            
            <div class="nav-section">Sales & Finance</div>
            <a href="sales-dashboard" class="nav-item active"><i class="fas fa-chart-pie"></i> Sales</a>
            <a href="profitability" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> Profitability</a>
            <a href="promotions" class="nav-item"><i class="fas fa-tags"></i> Promotions</a>

            <div class="nav-section">Operations</div>
            <a href="pos-register" class="nav-item"><i class="fas fa-users"></i> Staff</a>
            <a href="credit-customers" class="nav-item"><i class="fas fa-address-book"></i> Credit</a>
            <a href="inventory" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="reports" class="nav-item"><i class="fas fa-chart-line"></i> Reports</a>
            <a href="settings" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        </div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <div style="font-weight: bold;" id="userName">...</div>
                <div style="font-size: 12px; opacity: 0.7;" id="userRole">...</div>
            </div>
            </div>
            <button class="sidebar-logout-btn" onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 20px; color: var(--primary-color);">Sales Analytics</h2>
        
        <div class="charts-grid">
            <!-- Category Distribution -->
            <div class="chart-card">
                <h3>Top 5 Selling Products</h3>
                <div style="height: 250px; position: relative;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Payment Methods -->
            <div class="chart-card">
                <h3>Payment Methods</h3>
                <div style="height: 250px; position: relative;">
                    <canvas id="paymentChart"></canvas>
                </div>
            </div>

            <!-- Sales Trend -->
            <div class="chart-card full-width">
                <h3>Sales Revenue Trend (Last 7 Days)</h3>
                <canvas id="salesTrendChart" height="100"></canvas>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Footprint
    </footer>

    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', checkAuth);

        async function checkAuth() {
            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/session', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Not authenticated');
                const data = await response.json();
                const user = data.user;

                document.getElementById('userName').textContent = user.name || 'User';
                const _roleLabel = user.role === 'manager' ? 'Store Manager' : (user.role === 'admin' ? 'Administrator' : (user.role || 'Staff'));
                const _branchLabel = user.store_location ? ` · ${user.store_location}` : '';
                document.getElementById('userRole').textContent = _roleLabel + _branchLabel;
                
                loadSalesData();
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function loadSalesData() {
            let transactions = [];
            try {
                const token = localStorage.getItem('authToken');
                const res = await fetch('/transactions/all', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) transactions = await res.json();
            } catch (e) {
                console.error("Error loading transactions:", e);
            }
            
            // Fallback to localStorage if DB is empty (optional)
            if (transactions.length === 0) transactions = JSON.parse(localStorage.getItem('transactions')) || [];

            // 1. Prepare Data for Sales Trend (Last 7 Days)
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toDateString();
            }).reverse();

            const salesData = last7Days.map(date => {
                return transactions
                    .filter(t => new Date(t.created_at || t.date).toDateString() === date)
                    .reduce((sum, t) => sum + parseFloat(t.total_amount || t.total || 0), 0);
            });

            // 2. Prepare Data for Top Products
            const productStats = {};
            transactions.forEach(t => {
                if (t.items && Array.isArray(t.items)) {
                    // Calculate ratio to include tax/discount in product totals
                    let txnSubtotal = parseFloat(t.subtotal || 0);
                    if (txnSubtotal <= 0) {
                        txnSubtotal = t.items.reduce((sum, i) => sum + (i.price * i.qty), 0);
                    }
                    const txnTotal = parseFloat(t.total_amount || 0);
                    const ratio = (txnSubtotal > 0 && txnTotal > 0) ? (txnTotal / txnSubtotal) : 1;

                    t.items.forEach(item => {
                        // Aggregate revenue by product name
                        const itemTotal = (item.price * item.qty) * ratio;
                        productStats[item.name] = (productStats[item.name] || 0) + itemTotal;
                    });
                }
            });
            
            // Sort by revenue descending and take top 5
            const topProducts = Object.entries(productStats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            // 3. Prepare Data for Payment Methods
            const payments = { 'Cash': 0, 'Momo': 0, 'Card': 0, 'Credit': 0 };
            transactions.forEach(t => {
                let method = t.payment_method || t.paymentMethod || 'Cash';
                method = method.toLowerCase();
                
                if (method === 'momo' || method.includes('mobile')) payments['Momo']++;
                else if (method === 'card') payments['Card']++;
                else if (method === 'credit') payments['Credit']++;
                else payments['Cash']++;
            });

            // --- RENDER CHARTS ---

            // Line Chart
            new Chart(document.getElementById('salesTrendChart'), {
                type: 'line',
                data: {
                    labels: last7Days.map(d => d.slice(0, 10)), // Short date
                    datasets: [{
                        label: 'Revenue',
                        data: salesData,
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(26, 42, 108, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true }
            });

            // Doughnut Chart (Top Products)
            new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: topProducts.map(p => p[0]),
                    datasets: [{
                        label: 'Revenue',
                        data: topProducts.map(p => p[1]),
                        backgroundColor: ['#f59e0b', '#008060', '#2563eb', '#f59e0b', '#7c3aed']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // Doughnut Chart (Payments)
            new Chart(document.getElementById('paymentChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(payments),
                    datasets: [{
                        label: 'Transaction Count',
                        data: Object.values(payments),
                        backgroundColor: ['#108043', '#f59e0b', '#2563eb', '#8b5cf6', '#0ea5e9']
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        async function logout() {
            if (window.authGuard && typeof window.authGuard.logout === 'function') {
                return window.authGuard.logout();
            }
            try {
                const token = localStorage.getItem('authToken');
                if (token) {
                    await fetch('/api/logout', { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).catch(() => {});
                }
            } catch (e) {
                console.error(e);
            } finally {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('/login?logout=true');
            }
        }
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // 2. Mobile Table Auto-Labeler
    function applyTableDataLabels() {
        document.querySelectorAll('.card-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
            if (headers.length === 0) return;
            table.querySelectorAll('tbody tr').forEach(tr => {
                tr.querySelectorAll('td').forEach((td, index) => {
                    if (headers[index] && !td.hasAttribute('data-label')) {
                        td.setAttribute('data-label', headers[index]);
                    }
                });
            });
        });
    }
    /* Optimized: Global MutationObserver removed to prevent DOM thrashing */
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTableDataLabels);
    } else {
        applyTableDataLabels();
    }
})();
</script>
<!-- ====================================================== -->
</body>
</html>
