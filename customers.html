<html lang="en">
<head>

    <style>
        :root { --primary-color: #273990; --accent-color: #f9a51a; --secondary-color: #1c2b70; --accent-color: #f9a51a; --text-color: #202223; --text-secondary: #6d7175; --border-color: #e1e3e5; --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05); --gray-light: #f6f6f7; --sidebar-width: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); display: flex; flex-direction: column; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: #1F3A60; color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; height: 100dvh; overflow-y: auto; }
        .brand { padding: 15px; font-size: 24px; font-weight: 700; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: 'Montserrat', sans-serif; display: flex; align-items: center; gap: 10px; }
        .nav-links { flex: 1; padding-top: 5px; }
        .nav-item { display: flex; align-items: center; padding: 8px 25px; color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--accent-color); }
        .nav-item i { margin-right: 15px; width: 20px; text-align: center; }
        .nav-section { padding: 8px 25px 3px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; }
        .user-profile { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 30px 40px; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #888; font-weight: 500; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: var(--text-color); font-size: 14px; }

        /* Footer */
        footer {
            margin-left: var(--sidebar-width);
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 12px;
            background: #1F3A60;
        }

        /* Mobile Responsive Styles */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); z-index: 1000; transition: transform 0.3s ease; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; padding-top: 70px; }
            .mobile-menu-btn { display: block; }
            .overlay.active { display: block; }
            .card { overflow-x: auto; }
        }
    .user-profile-row { display: flex; align-items: center; gap: 10px; }
        
        .sidebar-logout-btn { margin-left: auto; flex-shrink: 0; background: none; border: none; color: rgba(255,255,255,0.65); cursor: pointer; padding: 7px; border-radius: 6px; font-size: 16px; line-height: 1; transition: color 0.2s ease, background 0.2s ease; } .sidebar-logout-btn:hover { color: white; background: rgba(220,53,69,0.6); }

    <style id="cust-face">
        .cust-search-wrap { margin-bottom: 16px; }
        #custSearch { width: 100%; height: 42px; padding: 0 14px; border: 1px solid var(--edge-strong, #ddd); border-radius: 8px; background: var(--sheet, #fff); font-family: var(--font-ui); font-size: 14px; display: block; }
        #custSearch:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(39, 57, 144, 0.12); }
        #custPrev, #custNext { height: 36px; padding: 0 14px; border: 1px solid var(--edge-strong); border-radius: 8px; background: var(--sheet); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 8px; }
        #custPrev:disabled, #custNext:disabled { opacity: 0.45; cursor: default; }
        #custBody tr.cust-row { cursor: pointer; transition: background 0.14s ease; }
        #custBody tr.cust-row:hover { background: var(--frame, #f8fafc); }
        .cust-act-btn {
            height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--edge-strong, #cbd5e1);
            background: var(--sheet, #fff); color: var(--brand, #273990); font-size: 12px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
        }
        .cust-act-btn:hover { background: #273990; border-color: #273990; color: #fff; }
        /* Customer Profile & Statement Modal */
        .stmt-backdrop { position: fixed; inset: 0; background: rgba(11, 16, 23, 0.62); backdrop-filter: blur(2px); z-index: 10070; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .stmt-modal {
            background: var(--sheet, #fff); color: var(--ink, #0f172a); border: 1px solid var(--edge, #e2e8f0);
            border-radius: 14px; width: 100%; max-width: 1020px; max-height: 92vh; display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28); overflow: hidden;
        }
        .stmt-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--edge, #e2e8f0); background: var(--frame, #f8fafc); }
        .stmt-head h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink, #0f172a); }
        .stmt-meta { margin-top: 4px; font-size: 12.5px; color: var(--muted, #64748b); display: flex; flex-wrap: wrap; gap: 14px; }
        .stmt-close { border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--muted, #64748b); cursor: pointer; width: 32px; height: 32px; border-radius: 6px; }
        .stmt-close:hover { background: var(--edge, #e2e8f0); color: var(--ink, #0f172a); }
        .stmt-body { padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .stmt-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--edge, #e2e8f0); border-radius: 10px; overflow: hidden; background: var(--sheet, #fff); }
        .stmt-kpi { padding: 12px 16px; border-left: 1px solid var(--edge, #e2e8f0); }
        .stmt-kpi:first-child { border-left: 0; }
        .stmt-kpi-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted, #64748b); }
        .stmt-kpi-val { font-size: 18px; font-weight: 700; margin-top: 4px; color: var(--ink, #0f172a); font-variant-numeric: tabular-nums; }
        .stmt-kpi-val.due { color: #b45309; }
        .stmt-kpi-val.good { color: #15803d; }
        .stmt-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
        .stmt-filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .stmt-controls select, .stmt-controls input[type="date"] {
            height: 34px; padding: 0 10px; border: 1px solid var(--edge-strong, #cbd5e1); border-radius: 7px;
            background: var(--sheet, #fff); color: var(--ink, #0f172a); font-size: 12.5px; font-family: var(--font-ui);
        }
        .stmt-chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2, #334155); cursor: pointer; user-select: none; }
        .stmt-table-wrap { border: 1px solid var(--edge, #e2e8f0); border-radius: 10px; overflow-x: auto; }
        .stmt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .stmt-table th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted, #64748b); background: var(--frame, #f8fafc); border-bottom: 1px solid var(--edge, #e2e8f0); }
        .stmt-table td { padding: 10px 12px; border-bottom: 1px solid var(--edge, #f1f5f9); vertical-align: top; }
        .stmt-table tr:last-child td { border-bottom: 0; }
        .stmt-table th.num, .stmt-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .stmt-item-lines { display: flex; flex-direction: column; gap: 4px; }
        .stmt-item-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
        .stmt-item-name { font-weight: 600; color: var(--ink, #0f172a); }
        .stmt-item-qty { font-size: 11.5px; color: var(--muted, #64748b); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .stmt-badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
        .stmt-badge-paid { background: #dcfce7; color: #15803d; }
        .stmt-badge-credit { background: #fef3c7; color: #b45309; }
        .stmt-badge-pay { background: #dbeafe; color: #1d4ed8; }
        .stmt-badge-ret { background: #fee2e2; color: #b91c1c; }
        .stmt-summary-row td { background: var(--frame, #f8fafc); font-weight: 700; }
        @media (max-width: 720px) {
            .stmt-kpis { grid-template-columns: 1fr 1fr; }
            .stmt-kpi { border-left: 0; border-top: 1px solid var(--edge, #e2e8f0); }
        }
    </style>
    <script src="/okw-events.js"></script>
</head>
<body>
    <button class="mobile-menu-btn" data-onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" data-onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand"><img src="/okwesiwa-logo.svg" alt="OKWESIWA CO LTD" style="width: auto; max-width: 140px; height: 36px; border-radius: 6px; object-fit: contain; background: #ffffff; padding: 3px 8px; border: 1.5px solid #f9a51a;"></div>
        <div class="nav-links">
        </div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <div style="font-weight: bold;" id="userName"></div>
                <div style="font-size: 12px; opacity: 0.7;" id="userRole"></div>
            </div>
            </div>
            <button class="sidebar-logout-btn" data-onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="main-content">
        <div class="okw-page-header">
            <div class="okw-page-header-text">
                <h1 class="okw-page-title">Customers</h1>
                <p class="okw-page-subtitle" id="custSummary">Loading customers...</p>
            </div>
            <div class="okw-page-header-actions">
                <button type="button" class="okw-btn okw-btn-primary" id="btnAddCustomer"><i class="fas fa-user-plus"></i> Add Customer</button>
            </div>
        </div>
        <div class="cust-search-wrap">
            <input type="search" id="custSearch" placeholder="Search by name, phone, or account..." aria-label="Search customers">
        </div>
        <div class="card" style="padding:0; overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Account</th>
                        <th class="numeric">Credit limit</th>
                        <th class="numeric">Balance owed</th>
                        <th>Status</th>
                        <th style="text-align:right;">Statement</th>
                    </tr>
                </thead>
                <tbody id="custBody"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
        </div>
        <div id="custPager" style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:12px; font-size:13px; color:var(--muted);">
            <span id="custRange"></span>
            <span>
                <button type="button" class="btn-white btn-control" id="custPrev" aria-label="Previous page">Previous</button>
                <button type="button" class="btn-white btn-control" id="custNext" aria-label="Next page">Next</button>
            </span>
        </div>
    </div>

    <script>
    (function () {
        const PAGE = 50;
        let all = [], view = [], page = 0;
        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const money = (n) => (typeof formatCurrency === 'function' ? formatCurrency(Number(n) || 0) : (Number(n) || 0).toFixed(2));

        const fmtDate = (d) => {
            if (!d) return '-';
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return String(d);
            return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
        };
        const fmtDateTime = (d) => {
            if (!d) return '-';
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return String(d);
            return dt.toLocaleString(undefined, { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        function render() {
            const body = document.getElementById('custBody');
            const start = page * PAGE, rows = view.slice(start, start + PAGE);
            body.innerHTML = rows.length ? rows.map((c) => `
                <tr class="cust-row" data-cust-id="${esc(c.id)}">
                    <td style="max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;" title="${esc(c.name)}">${esc(c.name)}</td>
                    <td>${esc(c.phone) || '-'}</td>
                    <td>${esc(c.account_number) || '-'}</td>
                    <td class="numeric">${money(c.credit_limit)}</td>
                    <td class="numeric">${Number(c.current_balance) > 0 ? money(c.current_balance) : '-'}</td>
                    <td>${esc(c.status) || '-'}</td>
                    <td style="text-align:right;">
                        <button type="button" class="cust-act-btn" data-open-stmt="${esc(c.id)}"><i class="fas fa-file-invoice-dollar"></i> Statement</button>
                    </td>
                </tr>`).join('') : '<tr><td colspan="7">No customers match.</td></tr>';
            document.getElementById('custRange').textContent = view.length ? `${start + 1}-${Math.min(start + PAGE, view.length)} of ${view.length}` : '';
            document.getElementById('custPrev').disabled = page === 0;
            document.getElementById('custNext').disabled = start + PAGE >= view.length;
        }

        const shortRef = (ref) => {
            const raw = String(ref || '').trim();
            if (!raw) return '—';
            const m = raw.match(/^([A-Za-z]+)[-_]?(\d{9,})$/);
            if (m) return `${m[1].toUpperCase()}-${m[2].slice(-6)}`;
            return raw.length > 14 ? `${raw.slice(0, 4)}-${raw.slice(-6)}` : raw;
        };

        const renderDescriptionLabel = (ev) => {
            if (ev.type === 'Payment') return esc(ev.description || 'Payment Received');
            return esc(ev.type || 'Purchase');
        };

        const renderItemsCell = (ev, showItems, isPrint) => {
            const items = Array.isArray(ev.items) ? ev.items : [];
            if (items.length === 0) return '—';
            if (showItems) {
                const multi = items.length > 1;
                return `<div style="display:flex;flex-direction:column;gap:4px;">${items.map((it) => {
                    const meta = multi
                        ? `${esc(it.qty)} &times; ${esc(money(it.price))} = ${esc(money(it.total))}`
                        : `${esc(it.qty)} &times; ${esc(money(it.price))}`;
                    return `<div style="line-height:1.35;"><span style="font-weight:600;color:${isPrint ? '#0f172a' : 'var(--ink,#0f172a)'};">${esc(it.name)}</span> <span style="font-size:${isPrint ? '10px' : '11.5px'};color:#64748b;white-space:nowrap;">(${meta})</span></div>`;
                }).join('')}</div>`;
            }
            const count = items.reduce((sum, it) => sum + (Number(it.qty) || 0), 0) || items.length;
            return `<span style="color:var(--muted,#64748b);">${esc(count)} item${count === 1 ? '' : 's'}</span>`;
        };

        function printBankStatement(data, showItems) {
            const c = data.customer || {};
            const b = data.business || {};
            const s = data.summary || {};
            const entries = data.entries || [];
            const periodLabel = `${fmtDate(data.period?.from)} — ${fmtDate(data.period?.to)}`;
            const generatedOn = fmtDateTime(new Date().toISOString());
            const hasOpening = Math.abs(Number(s.opening_balance || 0)) > 0.004;

            const openingRowHtml = hasOpening ? `
                <tr class="bf-row">
                    <td class="nowrap">${esc(fmtDate(data.period?.from))}</td>
                    <td>—</td>
                    <td>—</td>
                    <td colspan="5">Opening Balance Brought Forward</td>
                    <td class="num">${esc(money(s.opening_balance))}</td>
                </tr>` : '';

            const rowsHtml = entries.length ? entries.map((ev) => `
                <tr>
                    <td class="nowrap">${esc(fmtDate(ev.date))}</td>
                    <td class="nowrap mono" title="${esc(ev.ref)}">${esc(shortRef(ev.ref))}</td>
                    <td class="loc-col">${esc(ev.branch || '—')}</td>
                    <td class="bold">${renderDescriptionLabel(ev)}</td>
                    <td>${renderItemsCell(ev, showItems, true)}</td>
                    <td class="nowrap">${esc(ev.payment_method)}</td>
                    <td class="num">${ev.debit > 0 ? esc(money(ev.debit)) : '—'}</td>
                    <td class="num">${ev.credit > 0 ? esc(money(ev.credit)) : '—'}</td>
                    <td class="num bold">${esc(money(ev.running_balance))}</td>
                </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;padding:24px;color:#64748b;">No transactions recorded for this statement period.</td></tr>`;

            const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Statement — ${esc(c.name)}</title>
<style>
    @page { size: A4; margin: 12mm; }
    * { box-sizing: border-box; }
    body { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; margin: 0; padding: 20px; background: #fff; font-size: 11px; line-height: 1.45; font-variant-numeric: tabular-nums; }
    .no-print { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
    .no-print button { height: 34px; padding: 0 16px; border-radius: 7px; border: 1px solid #cbd5e1; background: #273990; color: #fff; font-weight: 600; cursor: pointer; font-size: 12.5px; }
    .no-print button.sec { background: #fff; color: #0f172a; }
    .sheet { max-width: 840px; margin: 0 auto; }
    .masthead { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2.5px solid #273990; padding-bottom: 14px; margin-bottom: 16px; gap: 16px; }
    .brand-col img { height: 42px; display: block; margin-bottom: 6px; }
    .brand-name { font-size: 16px; font-weight: 800; color: #273990; letter-spacing: -0.01em; }
    .brand-sub { color: #475569; font-size: 11px; margin-top: 2px; }
    .stmt-title-col { text-align: right; }
    .stmt-badge { display: inline-block; background: #273990; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .stmt-meta-tbl { margin-top: 8px; margin-left: auto; border-collapse: collapse; font-size: 11px; }
    .stmt-meta-tbl td { padding: 2px 0 2px 12px; }
    .stmt-meta-tbl td:first-child { color: #64748b; text-align: right; }
    .stmt-meta-tbl td:last-child { font-weight: 600; text-align: right; }
    .info-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; margin-bottom: 18px; }
    .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px 14px; }
    .box-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #273990; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; margin-bottom: 8px; }
    .holder-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .holder-line { font-size: 11.5px; color: #334155; margin: 2px 0; }
    .sum-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .sum-tbl td { padding: 3.5px 0; }
    .sum-tbl td:last-child { text-align: right; font-weight: 600; }
    .sum-tbl tr.total td { border-top: 1.5px solid #0f172a; padding-top: 6px; margin-top: 4px; font-size: 13px; font-weight: 800; color: #273990; }
    .ledger { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .ledger th { background: #f1f5f9; color: #334155; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 7px; border-top: 1.5px solid #273990; border-bottom: 1px solid #cbd5e1; text-align: left; }
    .ledger td { padding: 8px 7px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    .ledger th.num, .ledger td.num { text-align: right; white-space: nowrap; }

        function openCustomerStatementModal(customerId) {
            const prev = document.getElementById('okw-cust-stmt-modal');
            if (prev) prev.remove();

            const today = new Date();
            const toIso = today.toISOString().slice(0, 10);
            const from90 = new Date(today.getTime() - 90 * 86400000).toISOString().slice(0, 10);

            const backdrop = document.createElement('div');
            backdrop.id = 'okw-cust-stmt-modal';
            backdrop.className = 'stmt-backdrop';
            backdrop.innerHTML = `
                <div class="stmt-modal" role="dialog" aria-modal="true" aria-labelledby="stmtCustTitle">
                    <div class="stmt-head">
                        <div>
                            <h2 id="stmtCustTitle">Loading Customer Profile...</h2>
                            <div class="stmt-meta" id="stmtCustMeta"></div>
                        </div>
                        <button type="button" class="stmt-close" id="stmtCloseBtn" aria-label="Close">&times;</button>
                    </div>
                    <div class="stmt-body">
                        <div class="stmt-kpis">
                            <div class="stmt-kpi"><div class="stmt-kpi-lbl">Lifetime Spend</div><div class="stmt-kpi-val" id="stmtKpiSpend">—</div></div>
                            <div class="stmt-kpi"><div class="stmt-kpi-lbl">Credit Limit</div><div class="stmt-kpi-val" id="stmtKpiLimit">—</div></div>
                            <div class="stmt-kpi"><div class="stmt-kpi-lbl">Balance Owed</div><div class="stmt-kpi-val due" id="stmtKpiBalance">—</div></div>
                            <div class="stmt-kpi"><div class="stmt-kpi-lbl">Available Credit</div><div class="stmt-kpi-val good" id="stmtKpiAvail">—</div></div>
                        </div>
                        <div class="stmt-controls">
                            <div class="stmt-filter-group">
                                <select id="stmtPreset" aria-label="Statement period">
                                    <option value="month">This Month</option>
                                    <option value="30">Last 30 Days</option>
                                    <option value="90" selected>Last 90 Days</option>
                                    <option value="year">This Year</option>
                                    <option value="all">All Time</option>
                                </select>
                                <input type="date" id="stmtFrom" value="${esc(from90)}" aria-label="From date">
                                <input type="date" id="stmtTo" value="${esc(toIso)}" aria-label="To date">
                                <label class="stmt-chk"><input type="checkbox" id="stmtShowItems" checked> Itemized details</label>
                            </div>
                            <button type="button" class="okw-btn okw-btn-primary" id="stmtPrintBtn"><i class="fas fa-print"></i> Print Statement</button>
                        </div>
                        <div class="stmt-table-wrap">
                            <table class="stmt-table" data-no-table-tools="1">
                                <thead>
                                    <tr>
                                        <th style="white-space:nowrap;">Date</th>
                                        <th style="white-space:nowrap;">Ref #</th>
                                        <th style="white-space:nowrap;">Location</th>
                                        <th style="min-width:130px;">Description</th>
                                        <th style="min-width:200px;">Items</th>
                                        <th style="white-space:nowrap;">Method</th>
                                        <th class="num">Debit</th>
                                        <th class="num">Credit</th>
                                        <th class="num">Balance</th>
                                    </tr>
                                </thead>
                                <tbody id="stmtTableBody">
                                    <tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted);">Loading statement...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);

            let currentData = null;
            const close = () => backdrop.remove();
            backdrop.querySelector('#stmtCloseBtn').addEventListener('click', close);
            backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) close(); });

            function renderLedger() {
                if (!currentData) return;
                const tbody = backdrop.querySelector('#stmtTableBody');
                const showItems = backdrop.querySelector('#stmtShowItems').checked;
                const s = currentData.summary || {};
                const entries = currentData.entries || [];

                const hasOpening = Math.abs(Number(s.opening_balance || 0)) > 0.004;
                const openingRow = hasOpening ? `
                    <tr class="stmt-summary-row">
                        <td>${esc(fmtDate(currentData.period?.from))}</td>
                        <td>—</td>
                        <td>—</td>
                        <td colspan="5">Opening Balance Brought Forward</td>
                        <td class="num">${esc(money(s.opening_balance))}</td>
                    </tr>` : '';

                const rows = entries.length ? entries.map((ev) => `
                        <tr>
                            <td style="white-space:nowrap;">${esc(fmtDate(ev.date))}</td>
                            <td style="white-space:nowrap;font-family:ui-monospace,monospace;font-size:11.5px;" title="${esc(ev.ref)}">${esc(shortRef(ev.ref))}</td>
                            <td style="white-space:nowrap;color:var(--ink-2,#334155);font-size:12px;">${esc(ev.branch || '—')}</td>
                            <td style="font-weight:600;">${renderDescriptionLabel(ev)}</td>
                            <td>${renderItemsCell(ev, showItems, false)}</td>
                            <td style="white-space:nowrap;">${esc(ev.payment_method)}</td>
                            <td class="num">${ev.debit > 0 ? esc(money(ev.debit)) : '—'}</td>
                            <td class="num">${ev.credit > 0 ? esc(money(ev.credit)) : '—'}</td>
                            <td class="num" style="font-weight:700;">${esc(money(ev.running_balance))}</td>
                        </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted);">No purchases or payments recorded in this period.</td></tr>`;

                const closingRow = `
                    <tr class="stmt-summary-row">
                        <td colspan="6">Period Totals (${esc(s.period_orders || 0)} orders) &amp; Closing Balance</td>
                        <td class="num">${esc(money(s.total_charges))}</td>
                        <td class="num">${esc(money(s.total_payments))}</td>
                        <td class="num">${esc(money(s.closing_balance))}</td>
                    </tr>`;

                tbody.innerHTML = openingRow + rows + closingRow;
            }

            async function fetchStatement() {
                const fromVal = backdrop.querySelector('#stmtFrom').value;
                const toVal = backdrop.querySelector('#stmtTo').value;
                const qs = new URLSearchParams();
                if (fromVal) qs.set('from', fromVal);
                if (toVal) qs.set('to', toVal);
                const tbody = backdrop.querySelector('#stmtTableBody');
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--muted);">Loading statement...</td></tr>';
                try {
                    const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                    const res = await fetch(`/api/customers/${encodeURIComponent(customerId)}/profile-statement?${qs.toString()}`, {
                        headers: { Authorization: 'Bearer ' + token },
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    currentData = await res.json();
                    const c = currentData.customer || {};
                    const s = currentData.summary || {};
                    backdrop.querySelector('#stmtCustTitle').textContent = c.name || 'Customer';
                    backdrop.querySelector('#stmtCustMeta').innerHTML = [
                        `<span><strong>Account:</strong> ${esc(c.account_number)}</span>`,
                        c.phone ? `<span><strong>Phone:</strong> ${esc(c.phone)}</span>` : '',
                        c.email ? `<span><strong>Email:</strong> ${esc(c.email)}</span>` : '',
                        `<span><strong>Type:</strong> ${esc(c.customer_type || 'Retail')}</span>`,
                        `<span><strong>Status:</strong> ${esc(c.status || 'Active')}</span>`
                    ].filter(Boolean).join('');
                    backdrop.querySelector('#stmtKpiSpend').textContent = `${money(s.lifetime_spend)} (${s.lifetime_orders || 0})`;
                    backdrop.querySelector('#stmtKpiLimit').textContent = money(c.credit_limit);
                    backdrop.querySelector('#stmtKpiBalance').textContent = money(c.current_balance);
                    backdrop.querySelector('#stmtKpiAvail').textContent = money(c.available_credit);
                    renderLedger();
                } catch (err) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:24px;color:#dc2626;">Could not load customer statement.</td></tr>';
                }
            }

            backdrop.querySelector('#stmtPreset').addEventListener('change', (e) => {
                const v = e.target.value;
                const now = new Date();
                const fromEl = backdrop.querySelector('#stmtFrom');
                const toEl = backdrop.querySelector('#stmtTo');
                toEl.value = now.toISOString().slice(0, 10);
                if (v === 'month') {
                    fromEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
                } else if (v === '30') {
                    fromEl.value = new Date(now.getTime() - 30 * 86400000).toISOString().slice(0, 10);
                } else if (v === '90') {
                    fromEl.value = new Date(now.getTime() - 90 * 86400000).toISOString().slice(0, 10);
                } else if (v === 'year') {
                    fromEl.value = `${now.getFullYear()}-01-01`;
                } else {
                    fromEl.value = '';
                }
                fetchStatement();
            });
            backdrop.querySelector('#stmtFrom').addEventListener('change', fetchStatement);
            backdrop.querySelector('#stmtTo').addEventListener('change', fetchStatement);
            backdrop.querySelector('#stmtShowItems').addEventListener('change', renderLedger);
            backdrop.querySelector('#stmtPrintBtn').addEventListener('click', () => {
                if (!currentData) return;
                printBankStatement(currentData, backdrop.querySelector('#stmtShowItems').checked);
            });

            fetchStatement();
        }

        const custBodyEl = document.getElementById('custBody');
        if (custBodyEl) custBodyEl.dataset.okwExpandBound = '1';
        custBodyEl.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-open-stmt]');
            if (btn) {
                e.stopPropagation();
                openCustomerStatementModal(btn.getAttribute('data-open-stmt'));
                return;
            }
            const row = e.target.closest('tr.cust-row[data-cust-id]');
            if (row) {
                openCustomerStatementModal(row.getAttribute('data-cust-id'));
            }
        });
        function filter() {
            const q = document.getElementById('custSearch').value.trim().toLowerCase();
            view = q ? all.filter((c) => [c.name, c.phone, c.account_number, c.email].some((v) => String(v || '').toLowerCase().includes(q))) : all;
            page = 0; render();
        }
        async function load() {
            try {
                const res = await fetch('/api/customers', { headers: { Authorization: 'Bearer ' + localStorage.getItem('authToken') } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                all = await res.json();
                const owing = all.filter((c) => Number(c.current_balance) > 0).length;
                document.getElementById('custSummary').textContent = `${all.length} customers, ${owing} with a balance owed`;
                filter();
            } catch (e) {
                document.getElementById('custSummary').textContent = 'Could not load customers.';
                document.getElementById('custBody').innerHTML = '<tr><td colspan="6">Could not load customers. Check your connection and refresh.</td></tr>';
            }
        }
        document.getElementById('custSearch').addEventListener('input', filter);
        document.getElementById('custPrev').addEventListener('click', () => { page = Math.max(0, page - 1); render(); });
        document.getElementById('custNext').addEventListener('click', () => { page += 1; render(); });
        document.addEventListener('DOMContentLoaded', load);
    })();
    </script>

    <footer>
        © 2026 OKWESIWA CO LTD
    </footer>

        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');

        async function logout() {
            if (window.authGuard && typeof window.authGuard.logout === 'function') {
                return window.authGuard.logout();
            }
            try {
                const token = localStorage.getItem('authToken');
                if (token) {
                    await fetch('/api/logout', { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).catch(() => {});
                }
            } catch (e) {
                console.error(e);
            } finally {
                localStorage.clear();
                sessionStorage.clear();
                (window.top || window).location.replace('/login?logout=true');
            }
        }
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // 2. Mobile Table Auto-Labeler
    function applyTableDataLabels() {
        document.querySelectorAll('.card-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
            if (headers.length === 0) return;
            table.querySelectorAll('tbody tr').forEach(tr => {
                tr.querySelectorAll('td').forEach((td, index) => {
                    if (headers[index] && !td.hasAttribute('data-label')) {
                        td.setAttribute('data-label', headers[index]);
                    }
                });
            });
        });
    }
    /* Optimized: Global MutationObserver removed to prevent DOM thrashing */
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTableDataLabels);
    } else {
        applyTableDataLabels();
    }

    const addCustBtn = document.getElementById('btnAddCustomer');
    if (addCustBtn) {
        addCustBtn.addEventListener('click', () => {
            const prev = document.getElementById('okw-add-cust-modal');
            if (prev) prev.remove();
            const backdrop = document.createElement('div');
            backdrop.id = 'okw-add-cust-modal';
            backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(11,16,23,0.6);z-index:10060;display:flex;align-items:center;justify-content:center;padding:16px;';
            backdrop.innerHTML = `
                <div class="okw-card" style="width:100%;max-width:440px;padding:22px 24px;">
                    <h3 style="margin:0 0 14px;">Add Customer</h3>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        <input type="text" id="ac-name" class="okw-input" placeholder="Customer name *" required>
                        <input type="text" id="ac-phone" class="okw-input" placeholder="Phone number">
                        <input type="email" id="ac-email" class="okw-input" placeholder="Email (optional)">
                        <select id="ac-type" class="okw-select">
                            <option value="Retail">Retail</option>
                            <option value="Wholesale">Wholesale</option>
                            <option value="Contractor">Contractor</option>
                        </select>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                        <button type="button" class="okw-btn okw-btn-outline" id="ac-cancel">Cancel</button>
                        <button type="button" class="okw-btn okw-btn-primary" id="ac-save">Save Customer</button>
                    </div>
                </div>`;
            document.body.appendChild(backdrop);
            backdrop.querySelector('#ac-cancel').onclick = () => backdrop.remove();
            backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) backdrop.remove(); });
            backdrop.querySelector('#ac-save').onclick = async () => {
                const name = backdrop.querySelector('#ac-name').value.trim();
                if (!name) return OkwUI.toast('Customer name is required', 'warning');
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const res = await fetch('/api/pos/customers/quick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    credentials: 'include',
                    body: JSON.stringify({
                        name,
                        phone: backdrop.querySelector('#ac-phone').value.trim(),
                        email: backdrop.querySelector('#ac-email').value.trim(),
                        price_group: backdrop.querySelector('#ac-type').value.toLowerCase()
                    })
                });
                if (res.ok) {
                    backdrop.remove();
                    OkwUI.toast('Customer added', 'success');
                    window.location.reload();
                } else {
                    const d = await res.json().catch(() => ({}));
                    OkwUI.toast(d.message || 'Failed to add customer', 'danger');
                }
            };
        });
    }
})();
</script>
