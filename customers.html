<head>

    <style>
        :root { --primary-color: #273990; --accent-color: #f9a51a; --secondary-color: #1c2b70; --accent-color: #f9a51a; --text-color: #202223; --text-secondary: #6d7175; --border-color: #e1e3e5; --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.05); --gray-light: #f6f6f7; --sidebar-width: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--gray-light); display: flex; flex-direction: column; min-height: 100vh; }
        .sidebar { width: var(--sidebar-width); background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; height: 100dvh; overflow-y: auto; }
        .brand { padding: 15px; font-size: 24px; font-weight: 700; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: 'Montserrat', sans-serif; display: flex; align-items: center; gap: 10px; }
        .nav-links { flex: 1; padding-top: 5px; }
        .nav-item { display: flex; align-items: center; padding: 8px 25px; color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 4px solid var(--accent-color); }
        .nav-item i { margin-right: 15px; width: 20px; text-align: center; }
        .nav-section { padding: 8px 25px 3px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; }
        .user-profile { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
        .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 30px 40px; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #888; font-weight: 500; border-bottom: 1px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: var(--text-color); font-size: 14px; }

        /* Footer */
        footer {
            margin-left: var(--sidebar-width);
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        /* Mobile Responsive Styles */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); z-index: 1000; transition: transform 0.3s ease; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; padding-top: 70px; }
            .mobile-menu-btn { display: block; }
            .overlay.active { display: block; }
            .card { overflow-x: auto; }
        }
    .user-profile-row { display: flex; align-items: center; gap: 10px; }
        
        .sidebar-logout-btn { margin-left: auto; flex-shrink: 0; background: none; border: none; color: rgba(255,255,255,0.65); cursor: pointer; padding: 7px; border-radius: 6px; font-size: 16px; line-height: 1; transition: color 0.2s ease, background 0.2s ease; } .sidebar-logout-btn:hover { color: white; background: rgba(220,53,69,0.6); }
        </style>
    <script src="currency.js"></script>
    <script src="telemetry-guard.js"></script>

<body>
    <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar">
        <div class="brand"><img src="logo.png" style="width: auto; max-width: 140px; height: 36px; border-radius: 6px; object-fit: contain; background: #ffffff; padding: 3px 8px; border: 1.5px solid #f9a51a;"></div>
        <div class="nav-links">
            <a href="dashboard" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            
            <div class="nav-section">Sales & Finance</div>
            <a href="sales-dashboard" class="nav-item"><i class="fas fa-chart-pie"></i> Sales</a>
            <a href="profitability" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> Profitability</a>
            <a href="promotions" class="nav-item"><i class="fas fa-tags"></i> Promotions</a>

            <div class="nav-section">Operations</div>
            <a href="pos-register" class="nav-item"><i class="fas fa-user-plus"></i> Register Cashier</a>
            <a href="credit-customers" class="nav-item"><i class="fas fa-address-book"></i> Credit</a>
            <a href="inventory" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="reports" class="nav-item"><i class="fas fa-chart-line"></i> Reports</a>
            <a href="settings" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
        </div>
        <div class="user-profile">
            <div class="user-profile-row">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div class="user-info">
                <div style="font-weight: bold;" id="userName">Admin User</div>
                <div style="font-size: 12px; opacity: 0.7;" id="userRole">Administrator</div>
            </div>
            </div>
            <button class="sidebar-logout-btn" onclick="logout()" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="main-content">
        <h2 style="margin-bottom: 30px;">Customer Database</h2>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Total Spent</th>
                        <th>Last Visit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Walk-in Customer</td>
                        <td>-</td>
                        <td>-</td>
                        <td>${formatCurrency(1250)}</td>
                        <td>Today</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        © 2026 Footprint
    </footer>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        async function logout() {
            if (window.authGuard && typeof window.authGuard.logout === 'function') {
                return window.authGuard.logout();
            }
            try {
                const token = localStorage.getItem('authToken');
                if (token) {
                    await fetch('/api/logout', { 
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }).catch(() => {});
                }
            } catch (e) {
                console.error(e);
            } finally {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('/login?logout=true');
            }
        }
    </script>

<!-- ================== GLOBAL UX FIXES ================== -->
<style>
#custom-toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.custom-toast { background: #0d121f; color: #ffffff; border: 1px solid #f9a51a; padding: 8px 25px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); font-family: "Inter", sans-serif; font-size: 14px; opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; pointer-events: auto; max-width: 350px; word-wrap: break-word; }
.custom-toast.show { opacity: 1; transform: translateY(0); }
.custom-toast.error { background: #e74c3c; border-left: 4px solid #c0392b; }
.custom-toast.success { background: #27ae60; border-left: 4px solid #2ecc71; }
</style>
<script>
(function() {
    // 1. Toast Notification Override
    const container = document.createElement('div');
    container.id = 'custom-toast-container';
    document.body.appendChild(container);

    window.alert = function(message) {
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        if (typeof message === 'string') {
            const msg = message.toLowerCase();
            if (msg.includes('error') || msg.includes('fail')) toast.classList.add('error');
            else if (msg.includes('success') || msg.includes('saved')) toast.classList.add('success');
        }
        toast.textContent = message;
        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // 2. Mobile Table Auto-Labeler
    function applyTableDataLabels() {
        document.querySelectorAll('.card-table').forEach(table => {
            const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
            if (headers.length === 0) return;
            table.querySelectorAll('tbody tr').forEach(tr => {
                tr.querySelectorAll('td').forEach((td, index) => {
                    if (headers[index] && !td.hasAttribute('data-label')) {
                        td.setAttribute('data-label', headers[index]);
                    }
                });
            });
        });
    }
    /* Optimized: Global MutationObserver removed to prevent DOM thrashing */
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyTableDataLabels);
    } else {
        applyTableDataLabels();
    }
})();
</script>
<!-- ====================================================== -->
</body>
</html>
